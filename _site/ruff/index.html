<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ruff Draft</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Dreamcast';
      src: url('dreamcast.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    :root {
      --bg: #f5ead5;
      --ink: #1a1a1a;
      --muted: #8a8175;
      --struck: rgba(26, 26, 26, 0.3);
      --accent: #e8560a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Dreamcast', 'Courier New', Courier, monospace;
      font-size: 15px;
      line-height: 1.7;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      font-size: 36px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .topbar .title { font-weight: 600; letter-spacing: 0.08em; }
    .topbar .actions { display: flex; gap: 16px; }
    .topbar button {
      background: transparent;
      border: 1px solid rgba(26, 26, 26, 0.2);
      border-radius: 8px;
      padding: 4px 18px;
      color: var(--muted);
      font-family: inherit;
      font-size: 36px;
      cursor: pointer;
      letter-spacing: 0.08em;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .topbar button:hover {
      color: var(--accent);
      border-color: rgba(232, 86, 10, 0.45);
    }
    #clean-btn {
      position: relative;
      overflow: hidden;
      transition: color 0.2s, border-color 0.2s, opacity 0.2s, box-shadow 0.3s;
    }
    #clean-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(232, 86, 10, 0.18);
      width: var(--clean-fill, 0%);
      transition: width 400ms ease-out, background 0.3s;
      z-index: 0;
      pointer-events: none;
    }
    #clean-btn .btn-label {
      position: relative;
      z-index: 1;
    }
    #clean-btn.locked {
      opacity: 0.55;
      cursor: not-allowed;
    }
    #clean-btn.locked:hover {
      color: var(--muted);
      border-color: rgba(26, 26, 26, 0.2);
    }
    #clean-btn.ready {
      color: var(--accent);
      border-color: rgba(232, 86, 10, 0.6);
      box-shadow: 0 0 18px rgba(232, 86, 10, 0.22);
    }
    #clean-btn.ready::before {
      background: rgba(232, 86, 10, 0.32);
    }
    #clean-btn.just-unlocked {
      animation: clean-pulse 320ms ease-out;
    }
    #clean-btn.shake {
      animation: clean-shake 260ms ease-in-out;
    }
    @keyframes clean-pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.05); box-shadow: 0 0 28px rgba(232, 86, 10, 0.45); }
      100% { transform: scale(1); }
    }
    @keyframes clean-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    .topbar, .bottombar {
      transition: opacity 1.8s ease-out, transform 1.8s ease-out;
    }
    body.focus-mode .topbar {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
    }
    body.focus-mode .bottombar {
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
    }
    .editor-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 48px 20px 80px;
    }
    .editor {
      max-width: 640px;
      margin: 0 auto;
      outline: none;
      white-space: pre-wrap;
      word-wrap: break-word;
      cursor: text;
      min-height: 50vh;
      font-family: 'Nunito', 'Spoqa Han Sans', 'Apple SD Gothic Neo', sans-serif;
      font-size: var(--editor-size, 15px);
    }
    .char { display: inline; }
    .char.active-word { color: var(--accent); }
    .char.fading { animation: fade-back 2s linear forwards; }
    @keyframes fade-back {
      from { color: var(--accent); }
      to { color: var(--ink); }
    }
    .struck { color: var(--struck); }
    .strike-group {
      position: relative;
      display: inline-block;
    }
    .strike-group::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: var(--struck);
      transform-origin: left center;
      pointer-events: none;
    }
    .strike-group.strike-anim::after {
      animation: strike-sweep 180ms ease-out;
    }
    @keyframes strike-sweep {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    .char.struck.dissolving {
      display: inline-block;
      white-space: pre;
      transform-origin: center bottom;
      animation: ember-burn 620ms cubic-bezier(0.55, 0.05, 0.6, 0.25) forwards;
      will-change: transform, opacity, filter, color, max-width;
    }
    @keyframes ember-burn {
      0%   { color: var(--struck); transform: translateY(0) scale(1); opacity: 1; filter: blur(0); text-shadow: none; max-width: 2ch; }
      15%  { color: var(--accent); transform: translateY(-1px) scale(1.18); opacity: 1; filter: blur(0); text-shadow: 0 0 10px rgba(232, 86, 10, 0.95), 0 0 20px rgba(232, 86, 10, 0.5); max-width: 2ch; }
      45%  { color: var(--accent); transform: translateY(-10px) scale(0.88); opacity: 0.65; filter: blur(1.5px); text-shadow: 0 0 8px rgba(232, 86, 10, 0.45); max-width: 2ch; }
      78%  { color: var(--accent); transform: translateY(-26px) scale(0.5); opacity: 0; filter: blur(4px); text-shadow: none; max-width: 2ch; }
      100% { color: var(--accent); transform: translateY(-26px) scale(0.5); opacity: 0; filter: blur(4px); text-shadow: none; max-width: 0; padding: 0; margin: 0; }
    }
    .strike-group.dissolving-line::after {
      animation: line-burn 520ms ease-out forwards;
    }
    @keyframes line-burn {
      0%   { background: var(--struck); opacity: 1; box-shadow: none; }
      40%  { background: var(--accent); opacity: 0.9; box-shadow: 0 0 6px rgba(232, 86, 10, 0.8); }
      100% { background: var(--accent); opacity: 0; box-shadow: none; transform: scaleX(0); }
    }
    .tk {
      background: rgba(217, 119, 6, 0.15);
      color: var(--accent);
      padding: 0 4px;
      border-radius: 3px;
      font-weight: 600;
    }
    .caret {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--ink);
      vertical-align: baseline;
      margin: 0 -1px -0.15em -1px;
      animation: blink 1s steps(2) infinite;
    }
    body:not(.input-focused) .caret { animation: none; opacity: 0; }
    @keyframes blink { to { opacity: 0; } }
    .placeholder {
      color: var(--muted);
      pointer-events: none;
    }
    .bottombar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      font-size: 36px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .toolbar { display: flex; gap: 6px; }
    .toolbar button {
      background: none;
      border: 1px solid rgba(0,0,0,0.1);
      color: var(--muted);
      font-family: inherit;
      font-size: 33px;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .toolbar button:hover {
      background: rgba(0,0,0,0.05);
      color: var(--ink);
    }
    .toast {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--bg);
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 39px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 10;
    }
    .toast.show { opacity: 1; }
    #input-proxy {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      border: 0;
      padding: 0;
      margin: 0;
      resize: none;
      outline: none;
      pointer-events: none;
      font-size: 16px;
      z-index: -1;
    }
    @media (max-width: 640px) {
      .topbar { padding: 8px 12px; font-size: 20px; }
      .topbar .actions { gap: 6px; }
      .topbar button { font-size: 16px; padding: 4px 10px; border-radius: 6px; }
      .bottombar { padding: 8px 12px; font-size: 18px; }
      .toolbar { gap: 4px; }
      .toolbar button { font-size: 18px; padding: 2px 10px; }
      .editor-wrap { padding: 24px 16px 40px; }
      .toast { font-size: 18px; bottom: 70px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="title">Ruff Draft</div>
    <div class="actions">
      <button id="clean-btn"><span class="btn-label">Polish</span></button>
      <button id="revise-btn" title="Clear the draft">Revise</button>
      <button id="export-btn" title="Download as .md">Export</button>
      <button id="focus-btn" title="Hide UI — press Esc to exit">Focus</button>
    </div>
  </div>
  <div class="editor-wrap" id="editor-wrap">
    <div class="editor" id="editor"></div>
  </div>
  <textarea id="input-proxy" autocapitalize="sentences" autocomplete="off" autocorrect="off" spellcheck="false" aria-hidden="true" tabindex="-1"></textarea>
  <div class="bottombar">
    <div id="word-count">0 words</div>
    <div class="toolbar">
      <button id="size-minus-btn" title="Smaller text">−</button>
      <button id="size-plus-btn" title="Larger text">+</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    // One-time migration from legacy "rough-draft-*" and "ruff-draft-*" keys. Safe to leave in forever; no-ops after the first run.
    (function migrateKeys() {
      const suffixes = ['doc', 'clean-progress', 'placeholder-idx', 'size', 'focus'];
      const oldPrefixes = ['rough-draft-', 'draft-punk-'];
      const newPrefix = 'ruff-draft-';
      for (const suffix of suffixes) {
        const newKey = newPrefix + suffix;
        for (const oldPrefix of oldPrefixes) {
          const oldKey = oldPrefix + suffix;
          const v = localStorage.getItem(oldKey);
          if (v !== null && localStorage.getItem(newKey) === null) {
            localStorage.setItem(newKey, v);
          }
          if (v !== null) localStorage.removeItem(oldKey);
        }
      }
    })();

    // Character model: [{ ch: string, struck: bool, tk: bool }]
    let chars = [];
    let cursor = 0;
    // Snapshot of the word being silently edited. Restored as struck when the user's deletions would empty the word.
    let wordEdit = null; // { startIdx: number, originals: [{ ch, tk? }] }
    // True while the caret is at the growing tip of a continuous insert/silent-edit run. Lets backspace undo a just-typed space instead of striking the prior word.
    let atInsertionTip = false;
    const WRITE_GOAL = 100;
    let cleanProgress = parseInt(localStorage.getItem('ruff-draft-clean-progress'), 10) || 0;
    let cleanUnlockTimer = null;
    let cleanShakeTimer = null;

    const PLACEHOLDERS = [
      'The first draft is always sh*t.',
    ];
    let placeholderIdx = parseInt(localStorage.getItem('ruff-draft-placeholder-idx'), 10);
    if (isNaN(placeholderIdx) || placeholderIdx < 0 || placeholderIdx >= PLACEHOLDERS.length) placeholderIdx = 0;

    const editor = document.getElementById('editor');
    const wordCountEl = document.getElementById('word-count');
    const toast = document.getElementById('toast');

    try {
      const saved = JSON.parse(localStorage.getItem('ruff-draft-doc') || 'null');
      if (Array.isArray(saved)) {
        chars = saved;
        cursor = chars.length;
      }
    } catch (e) {}

    function save() {
      const clean = chars.map(c => {
        const o = { ch: c.ch, struck: !!c.struck };
        if (c.tk) o.tk = true;
        return o;
      });
      localStorage.setItem('ruff-draft-doc', JSON.stringify(clean));
    }

    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function updateActiveWord() {
      let newStart = -1, newEnd = -1;
      if (atInsertionTip && cursor > 0) {
        const tip = chars[cursor - 1];
        if (tip && !isWordBoundary(tip)) {
          newStart = cursor - 1;
          while (newStart > 0 && !isWordBoundary(chars[newStart - 1])) newStart--;
          newEnd = cursor - 1;
          while (newEnd + 1 < chars.length && !isWordBoundary(chars[newEnd + 1])) newEnd++;
        }
      }
      const now = performance.now();
      for (let i = 0; i < chars.length; i++) {
        const c = chars[i];
        const shouldBeActive = newStart >= 0 && i >= newStart && i <= newEnd;
        if (shouldBeActive) {
          if (!c.active) c.active = true;
          if (c.fadeStart !== undefined) c.fadeStart = undefined;
        } else if (c.active) {
          c.active = false;
          if (!c.struck) c.fadeStart = now;
        }
      }
    }

    function render() {
      updateActiveWord();
      updateCleanButton();
      if (chars.length === 0) {
        editor.innerHTML = `<span class="caret"></span><span class="placeholder">${esc(PLACEHOLDERS[placeholderIdx])}</span>`;
        updateWordCount();
        return;
      }
      const now = performance.now();
      let html = '';
      let i = 0;
      while (i < chars.length) {
        if (i === cursor) html += '<span class="caret"></span>';
        const c = chars[i];
        if (c.ch === '\n') {
          html += '<br>';
          i++;
          continue;
        }
        if (c.struck && !c.tk) {
          let j = i;
          let allJustStruck = true;
          let anyDissolving = false;
          let groupHtml = '';
          while (j < chars.length && chars[j].struck && !chars[j].tk && chars[j].ch !== '\n') {
            if (j !== i && j === cursor) break;
            if (!chars[j].justStruck) allJustStruck = false;
            let charCls = 'char struck';
            let charStyle = '';
            if (chars[j].dissolving) {
              anyDissolving = true;
              charCls += ' dissolving';
              const delay = (chars[j].dissolveOrder || 0) * 22;
              charStyle = ` style="animation-delay: ${delay}ms"`;
            }
            groupHtml += `<span class="${charCls}" data-idx="${j}"${charStyle}>${esc(chars[j].ch)}</span>`;
            j++;
          }
          let animCls = '';
          if (allJustStruck) animCls += ' strike-anim';
          if (anyDissolving) animCls += ' dissolving-line';
          html += `<span class="strike-group${animCls}">${groupHtml}</span>`;
          i = j;
        } else {
          let cls = 'char';
          let style = '';
          if (c.tk) cls += ' tk';
          else if (c.active) cls += ' active-word';
          else if (c.fadeStart !== undefined) {
            const elapsed = (now - c.fadeStart) / 1000;
            if (elapsed < 2) {
              cls += ' fading';
              style = ` style="animation-delay: -${elapsed.toFixed(3)}s"`;
            } else {
              c.fadeStart = undefined;
            }
          }
          html += `<span class="${cls}" data-idx="${i}"${style}>${esc(c.ch)}</span>`;
          i++;
        }
      }
      if (cursor === chars.length) html += '<span class="caret"></span>';
      editor.innerHTML = html;
      updateWordCount();
      scrollCaretIntoView();
    }

    function scrollCaretIntoView() {
      const c = editor.querySelector('.caret');
      if (c) c.scrollIntoView({ block: 'nearest' });
    }

    function updateWordCount() {
      const text = chars
        .filter(c => !c.struck)
        .map(c => c.tk ? 'TK' : c.ch)
        .join('');
      const words = text.match(/\S+/g);
      wordCountEl.textContent = (words ? words.length : 0) + ' words';
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove('show'), 1500);
    }

    function isWordBoundary(c) {
      return !c || c.struck || c.ch === ' ' || c.ch === '\n' || c.ch === '\t' || c.tk;
    }

    function insertChar(ch) {
      const justCompletedWord = (ch === ' ' || ch === '\n' || ch === '\t') &&
        cursor > 0 && !isWordBoundary(chars[cursor - 1]);
      chars.splice(cursor, 0, { ch, struck: false });
      cursor++;
      wordEdit = null;
      atInsertionTip = true;
      if (justCompletedWord) {
        const prev = cleanProgress;
        cleanProgress++;
        localStorage.setItem('ruff-draft-clean-progress', cleanProgress);
        if (prev < WRITE_GOAL && cleanProgress >= WRITE_GOAL) triggerUnlockPulse();
      }
    }

    function triggerUnlockPulse() {
      const btn = document.getElementById('clean-btn');
      if (!btn) return;
      btn.classList.add('just-unlocked');
      clearTimeout(cleanUnlockTimer);
      cleanUnlockTimer = setTimeout(() => btn.classList.remove('just-unlocked'), 340);
    }

    function triggerShake() {
      const btn = document.getElementById('clean-btn');
      if (!btn) return;
      btn.classList.add('shake');
      clearTimeout(cleanShakeTimer);
      cleanShakeTimer = setTimeout(() => btn.classList.remove('shake'), 280);
    }

    function updateCleanButton() {
      const btn = document.getElementById('clean-btn');
      if (!btn) return;
      const capped = Math.min(cleanProgress, WRITE_GOAL);
      const pct = (capped / WRITE_GOAL) * 100;
      btn.style.setProperty('--clean-fill', pct + '%');
      const ready = cleanProgress >= WRITE_GOAL;
      btn.classList.toggle('ready', ready);
      btn.classList.toggle('locked', !ready);
      btn.title = ready
        ? 'Remove all strikethroughs'
        : `Write ${WRITE_GOAL - capped} more word${WRITE_GOAL - capped === 1 ? '' : 's'} to unlock`;
    }

    function restoreSnapshotAsStruck() {
      const { startIdx, originals } = wordEdit;
      chars.splice(startIdx, 0, ...originals.map(o => {
        const c = { ch: o.ch, struck: true, justStruck: true };
        if (o.tk) c.tk = true;
        return c;
      }));
      cursor = startIdx + originals.length;
      wordEdit = null;
      atInsertionTip = false;
      scheduleStrikeAnimCleanup();
    }

    function snapshotWordIfNeeded(start, end) {
      if (wordEdit && wordEdit.startIdx === start) return;
      wordEdit = {
        startIdx: start,
        originals: chars.slice(start, end + 1).map(c => {
          const o = { ch: c.ch };
          if (c.tk) o.tk = true;
          return o;
        })
      };
    }

    let _strikeAnimTimer = null;
    function scheduleStrikeAnimCleanup() {
      clearTimeout(_strikeAnimTimer);
      _strikeAnimTimer = setTimeout(() => {
        let changed = false;
        for (const c of chars) {
          if (c.justStruck) { delete c.justStruck; changed = true; }
        }
        if (changed) { render(); save(); }
      }, 260);
    }

    function handleBackspace() {
      if (cursor === 0) return;
      const prev = chars[cursor - 1];
      if (isWordBoundary(prev)) {
        if (atInsertionTip && prev && !prev.tk && !prev.struck) {
          // Undo a just-typed space/newline/tab so the prior word becomes editable again.
          chars.splice(cursor - 1, 1);
          cursor--;
          wordEdit = null;
          return;
        }
        wordEdit = null;
        atInsertionTip = false;
        strikePreviousWord();
        return;
      }
      let start = cursor - 1;
      while (start > 0 && !isWordBoundary(chars[start - 1])) start--;
      let end = cursor - 1;
      while (end + 1 < chars.length && !isWordBoundary(chars[end + 1])) end++;

      snapshotWordIfNeeded(start, end);
      chars.splice(cursor - 1, 1);
      cursor--;

      if (start >= chars.length || isWordBoundary(chars[start])) {
        restoreSnapshotAsStruck();
      }
    }

    function handleDelete() {
      if (cursor >= chars.length) return;
      atInsertionTip = false;
      const next = chars[cursor];
      if (isWordBoundary(next)) {
        wordEdit = null;
        strikeNextWord();
        return;
      }
      let start = cursor;
      while (start > 0 && !isWordBoundary(chars[start - 1])) start--;
      let end = cursor;
      while (end + 1 < chars.length && !isWordBoundary(chars[end + 1])) end++;

      snapshotWordIfNeeded(start, end);
      chars.splice(cursor, 1);

      if (start >= chars.length || isWordBoundary(chars[start])) {
        restoreSnapshotAsStruck();
      }
    }

    function strikePreviousWord() {
      let i = cursor - 1;
      while (i >= 0 && isWordBoundary(chars[i])) i--;
      if (i < 0) return;
      const end = i;
      while (i >= 0 && !isWordBoundary(chars[i])) i--;
      const start = i + 1;
      for (let j = start; j <= end; j++) { chars[j].struck = true; chars[j].justStruck = true; }
      scheduleStrikeAnimCleanup();
    }

    function strikeNextWord() {
      let i = cursor;
      while (i < chars.length && isWordBoundary(chars[i])) i++;
      if (i >= chars.length) return;
      const start = i;
      while (i < chars.length && !isWordBoundary(chars[i])) i++;
      const end = i - 1;
      for (let j = start; j <= end; j++) { chars[j].struck = true; chars[j].justStruck = true; }
      scheduleStrikeAnimCleanup();
    }

    function revise() {
      chars = [];
      cursor = 0;
      wordEdit = null;
      atInsertionTip = false;
      cleanProgress = 0;
      localStorage.setItem('ruff-draft-clean-progress', cleanProgress);
      placeholderIdx = (placeholderIdx + 1) % PLACEHOLDERS.length;
      localStorage.setItem('ruff-draft-placeholder-idx', placeholderIdx);
      render();
      document.getElementById('editor-wrap').scrollTop = 0;
      save();
      showToast('Revised — draft cleared');
      proxy.focus({ preventScroll: true });
    }

    function clean() {
      let dissolveCount = 0;
      for (const c of chars) {
        if (c.struck) {
          c.dissolving = true;
          c.dissolveOrder = dissolveCount++;
        }
      }
      render();
      const cascadeDuration = 640 + dissolveCount * 22;
      setTimeout(() => {
        const filtered = [];
        const indexMap = new Array(chars.length);
        for (let i = 0; i < chars.length; i++) {
          const c = chars[i];
          if (c.struck) { indexMap[i] = -1; continue; }
          const isSpace = c.ch === ' ' || c.ch === '\t';
          if (isSpace) {
            if (filtered.length === 0) { indexMap[i] = -1; continue; }
            const prev = filtered[filtered.length - 1];
            if (prev.ch === ' ' || prev.ch === '\t' || prev.ch === '\n') {
              indexMap[i] = -1; continue;
            }
            let j = i + 1;
            while (j < chars.length) {
              const nc = chars[j];
              if (nc.struck || nc.ch === ' ' || nc.ch === '\t') { j++; continue; }
              break;
            }
            if (j >= chars.length || chars[j].ch === '\n') {
              indexMap[i] = -1; continue;
            }
            indexMap[i] = filtered.length;
            filtered.push({ ch: ' ', struck: false });
          } else {
            indexMap[i] = filtered.length;
            filtered.push(c);
          }
        }
        let newCursor;
        if (cursor >= chars.length) {
          newCursor = filtered.length;
        } else {
          let count = 0;
          for (let i = 0; i < cursor; i++) if (indexMap[i] !== -1) count++;
          newCursor = count;
        }
        chars = filtered;
        cursor = newCursor;
        wordEdit = null;
        atInsertionTip = false;
        cleanProgress = 0;
        localStorage.setItem('ruff-draft-clean-progress', cleanProgress);
        render();
        save();
        showToast('Polished — strikethroughs removed');
        proxy.focus({ preventScroll: true });
      }, cascadeDuration);
    }

    function exportDoc() {
      const text = chars.filter(c => !c.struck).map(c => c.ch).join('');
      if (!text.trim()) { showToast('Nothing to export'); return; }
      const blob = new Blob([text], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ruff-draft-${new Date().toISOString().slice(0,10)}.md`;
      a.click();
      URL.revokeObjectURL(url);
    }

    const proxy = document.getElementById('input-proxy');
    const SENTINEL = '​';
    function resetProxy() {
      proxy.value = SENTINEL;
      try { proxy.setSelectionRange(SENTINEL.length, SENTINEL.length); } catch (e) {}
    }
    resetProxy();
    proxy.addEventListener('focus', () => document.body.classList.add('input-focused'));
    proxy.addEventListener('blur', () => document.body.classList.remove('input-focused'));

    proxy.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey) {
        if (e.key === 's') { e.preventDefault(); save(); showToast('Saved'); }
        return;
      }
      if (e.key === 'Backspace') {
        e.preventDefault();
        handleBackspace();
      } else if (e.key === 'Delete') {
        e.preventDefault();
        handleDelete();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        insertChar('\n');
      } else if (e.key === 'Tab') {
        e.preventDefault();
        insertChar('\t');
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (cursor > 0) cursor--;
        wordEdit = null;
        atInsertionTip = false;
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        if (cursor < chars.length) cursor++;
        wordEdit = null;
        atInsertionTip = false;
      } else if (e.key === 'Home') {
        e.preventDefault();
        while (cursor > 0 && chars[cursor - 1].ch !== '\n') cursor--;
        wordEdit = null;
        atInsertionTip = false;
      } else if (e.key === 'End') {
        e.preventDefault();
        while (cursor < chars.length && chars[cursor].ch !== '\n') cursor++;
        wordEdit = null;
        atInsertionTip = false;
      } else {
        return;
      }
      resetProxy();
      render();
      save();
    });

    proxy.addEventListener('input', (e) => {
      const inputType = e.inputType || '';
      const val = proxy.value;
      if (inputType.startsWith('delete')) {
        if (inputType === 'deleteContentForward') handleDelete();
        else handleBackspace();
      } else {
        const inserted = val.split(SENTINEL).join('');
        for (const ch of inserted) {
          if (ch === '\r') continue;
          insertChar(ch);
        }
      }
      resetProxy();
      render();
      save();
    });

    proxy.addEventListener('paste', (e) => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text');
      for (const ch of text) {
        chars.splice(cursor, 0, { ch, struck: false });
        cursor++;
      }
      wordEdit = null;
      atInsertionTip = false;
      resetProxy();
      render();
      save();
    });

    editor.addEventListener('mousedown', (e) => {
      const target = e.target.closest('.char');
      if (target) {
        const idx = parseInt(target.dataset.idx, 10);
        const rect = target.getBoundingClientRect();
        cursor = (e.clientX > rect.left + rect.width / 2) ? idx + 1 : idx;
        wordEdit = null;
        atInsertionTip = false;
        render();
      }
      e.preventDefault();
      proxy.focus({ preventScroll: true });
    });

    const MIN_SIZE = 16, MAX_SIZE = 76, SIZE_STEP = 2;
    const DEFAULT_SIZE = window.matchMedia('(max-width: 640px)').matches ? 22 : 36;
    let editorSize = parseInt(localStorage.getItem('ruff-draft-size'), 10) || DEFAULT_SIZE;
    editorSize = Math.max(MIN_SIZE, Math.min(MAX_SIZE, editorSize));
    function applySize() {
      document.documentElement.style.setProperty('--editor-size', editorSize + 'px');
      localStorage.setItem('ruff-draft-size', editorSize);
    }
    applySize();
    document.getElementById('size-plus-btn').addEventListener('click', () => {
      if (editorSize >= MAX_SIZE) return;
      editorSize = Math.min(MAX_SIZE, editorSize + SIZE_STEP);
      applySize();
      proxy.focus({ preventScroll: true });
    });
    document.getElementById('size-minus-btn').addEventListener('click', () => {
      if (editorSize <= MIN_SIZE) return;
      editorSize = Math.max(MIN_SIZE, editorSize - SIZE_STEP);
      applySize();
      proxy.focus({ preventScroll: true });
    });

    document.getElementById('revise-btn').addEventListener('click', () => {
      if (chars.length === 0) { showToast('Nothing to revise'); return; }
      if (confirm('Delete all text? This cannot be undone.')) revise();
    });
    document.getElementById('clean-btn').addEventListener('click', () => {
      if (cleanProgress < WRITE_GOAL) { triggerShake(); return; }
      if (!chars.some(c => c.struck)) { showToast('Nothing to polish'); return; }
      clean();
    });
    document.getElementById('export-btn').addEventListener('click', exportDoc);

    function setFocusMode(on) {
      document.body.classList.toggle('focus-mode', on);
      localStorage.setItem('ruff-draft-focus', on ? '1' : '0');
      if (on) showToast('Focus mode — press Esc to exit');
      proxy.focus({ preventScroll: true });
    }
    document.getElementById('focus-btn').addEventListener('click', () => setFocusMode(true));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.body.classList.contains('focus-mode')) {
        e.preventDefault();
        setFocusMode(false);
      }
    });
    if (localStorage.getItem('ruff-draft-focus') === '1') {
      document.body.classList.add('focus-mode');
    }

    proxy.focus({ preventScroll: true });
    render();
  </script>
</body>
</html>
