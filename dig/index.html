<style>
:root {
  color-scheme: light;

  --desk:#000000;

  --desk-lit:#000000;
  --desk-violet:var(--pool-violet);
  --desk-deep:#000000;

  --grid:rgba(255,255,255,.07);
  --panel:#000000;
  --panel2:#1D1410;
  --field:#000000;
  --ink:#FFFFFF;
  --ink2:#9A938E;
  --accent:#FFFFFF;
  --warn:#FF4D4D;

  --warn-ink:#B3200A;
  --on-dark:var(--pool-pink);
  --soft:#1D1410;
  --hair:rgba(255,255,255,.28);

  --pool-violet:#FFFFFF;
  --pool-pink:#E8560A;
  --pool-pale:#000000;

  --paper:var(--pool-pale);
  --paper-line:rgba(255,255,255,.20);

  --display:"Lucida Console","Andale Mono","MS Gothic",Osaka-Mono,ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  --text:"Lucida Console","Andale Mono","MS Gothic",Osaka-Mono,ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  --mono:"Lucida Console","Andale Mono","MS Gothic",ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,"Liberation Mono",monospace;

  --bevel:inset -1.5px -1.5px 0 rgba(0,0,0,.55), inset 1.5px 1.5px 0 #FFFFFF;
  --bevel-soft:inset -1.5px -1.5px 0 rgba(0,0,0,.55), inset 1.5px 1.5px 0 #FFFFFF;
  --bevel-key:inset -2px -2px 0 rgba(0,0,0,.65), inset 2px 2px 0 rgba(255,255,255,.22);
  --bevel-field:inset -2px -2px 0 rgba(0,0,0,.55), inset 2px 2px 0 #FFFFFF;
  --edge:1.5px solid var(--ink);
  --max:1200px;

  --r-shell:18px;
  --r-panel:10px;
  --r-ctl:7px;
  --r-tag:999px;
}

* { box-sizing:border-box; }
html, body { margin:0; padding:0; background:var(--desk); height:100%; overflow:hidden; }

.desk {
  height:100vh; height:100dvh; overflow:hidden; background-color:var(--desk);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    radial-gradient(130% 85% at 50% -12%, var(--desk-lit) 0%, transparent 62%),
    radial-gradient(62% 40% at 4% 112%, var(--pool-pink) 0%, transparent 54%),
    radial-gradient(85% 65% at 88% 112%, var(--desk-violet) 0%, transparent 58%),
    linear-gradient(178deg, var(--desk) 0%, var(--desk) 34%, var(--desk-deep) 100%);
  background-size:8px 8px, 8px 8px, auto, auto, auto, auto;
  background-repeat:repeat, repeat, no-repeat, no-repeat, no-repeat, no-repeat;
  color:var(--ink); font-family:var(--text); font-size:12px; line-height:1.5;
  padding:0 0 12px; display:flex; flex-direction:column; align-items:center;
  -webkit-font-smoothing:antialiased;
}
.desk ::selection { background:var(--accent); color:#FFFFFF; }
.desk a { color:var(--ink); text-decoration:none; }
.desk a:hover { color:var(--accent); }
.desk :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.desk [hidden] { display:none !important; }
.desk button, .desk select, .desk input { font:inherit; }

html { scrollbar-color:var(--ink2) var(--panel2); }

::-webkit-scrollbar-thumb, ::-webkit-scrollbar-button { box-sizing:border-box; }

::-webkit-scrollbar { width:14px; height:14px; }
::-webkit-scrollbar-track { background:var(--panel2); }
::-webkit-scrollbar-track:vertical { border-left:var(--edge); }
::-webkit-scrollbar-corner { background:var(--panel2); }

::-webkit-scrollbar-thumb {
  background:var(--panel); border:var(--edge); border-radius:var(--r-tag);
  box-shadow:var(--bevel);
}
::-webkit-scrollbar-thumb:hover { background:var(--soft); }

::-webkit-scrollbar-button {
  display:block; height:14px; background-color:var(--panel);
  border:var(--edge); border-radius:50%; box-shadow:var(--bevel);
  background-repeat:no-repeat; background-size:4px 4px, 4px 4px;
  background-position:calc(50% - 2px) center, calc(50% + 2px) center;
}
::-webkit-scrollbar-button:hover { background-color:var(--soft); }

::-webkit-scrollbar-button:active {
  box-shadow:inset 1.5px 1.5px 0 rgba(0,0,0,.55), inset -1.5px -1.5px 0 #FFFFFF;
}
::-webkit-scrollbar-button:vertical:decrement {
  background-image:linear-gradient(135deg,transparent 50%,var(--ink) 50%),
                   linear-gradient(45deg,var(--ink) 50%,transparent 50%);
}
::-webkit-scrollbar-button:vertical:increment {
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),
                   linear-gradient(135deg,var(--ink) 50%,transparent 50%);
}

::-webkit-scrollbar-button:vertical:start:increment,
::-webkit-scrollbar-button:vertical:end:decrement,
::-webkit-scrollbar-button:horizontal { display:none; }

.win {
  width:100%; max-width:var(--max);
  background:var(--panel); border:var(--edge); border-radius:var(--r-shell);
  box-shadow:0 2px 0 rgba(21,21,21,.18), 0 20px 38px -18px rgba(21,21,21,.5);
  flex:1; min-height:0; max-height:calc(100dvh - 132px); margin-block:auto;
  display:flex; flex-direction:column;
  transition:max-width .3s cubic-bezier(.22,.61,.36,1);
}

.wintop { flex:none; }
.headrow {
  display:flex; align-items:baseline; justify-content:space-between; gap:16px;
  flex-wrap:wrap; padding:14px 16px 12px; border-bottom:var(--edge);
}
.place { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }

.body {
  flex:1; min-height:0; display:grid; overflow:hidden;
  border-radius:0 0 calc(var(--r-shell) - 2px) calc(var(--r-shell) - 2px);
  grid-template-columns:minmax(420px,1.2fr) minmax(330px,1fr);
  transition:grid-template-columns .3s cubic-bezier(.22,.61,.36,1),
             grid-template-rows .3s cubic-bezier(.22,.61,.36,1);
}

.win.nomap { max-width:600px; }
.win.nomap .body { grid-template-columns:minmax(0px,0fr) minmax(0,1fr); }

.win.nomap .mapcell {
  opacity:0; border-right-width:0; padding:0; pointer-events:none;
}

.mapcell {
  border-right:var(--edge); padding:14px; min-height:0; min-width:0;
  display:flex; flex-direction:column;
  overflow:hidden; transition:opacity .2s ease;
}
.mapcard {
  position:relative; background:var(--paper); border:var(--edge);
  border-radius:var(--r-panel);
  box-shadow:inset 2px 2px 0 var(--paper-line); padding:10px;
  flex:1; min-height:0; display:flex; overflow:hidden;
}

#map {
  flex:1; min-width:0; min-height:0; width:100%; height:100%; display:block;
}

.route-case {
  fill:none; stroke:var(--paper); stroke-width:6; stroke-linejoin:round;
  stroke-linecap:round; pointer-events:none;
}
.route {
  fill:none; stroke:var(--pool-violet); stroke-width:2; stroke-linejoin:round;
  stroke-dasharray:6 4; pointer-events:none;
}

.pin { cursor:pointer; }
.pin .hit { fill:transparent; stroke:none; }
.pin .dot { fill:var(--paper); stroke:var(--ink); stroke-width:1.25; }
.pin .halo { fill:none; stroke:var(--ink); stroke-width:1.5; opacity:0; }

.pin.on .dot { fill:var(--pool-violet); }

.pin.first .dot { fill:var(--pool-violet); }
.pin.first .halo { opacity:1; stroke:var(--pool-violet); }

.pin.off .dot { opacity:.3; }

.pin.approx .dot { stroke-dasharray:2 2; }

.pin .term { fill:none; stroke:var(--ink); stroke-width:1.5; }

.pin.hot .dot, .pin:hover .dot { fill:var(--ink); stroke-width:1.5; }
.pin.hot .halo, .pin:hover .halo { opacity:1; stroke:var(--ink); }

.pin.hot .dot, .pin:hover .dot { opacity:1; }

.placepin { cursor:pointer; }
.placepin .cdisc { fill:var(--accent); stroke:var(--ink); stroke-width:1.5; }

.placepin.hot .cdisc, .placepin:hover .cdisc { fill:var(--ink); }

.citylab {
  font-family:var(--display); font-weight:700; font-size:10px; letter-spacing:0.025em;
  fill:var(--ink); text-anchor:middle;
  paint-order:stroke; stroke:var(--paper); stroke-width:3.5;
  stroke-linejoin:round; pointer-events:none;
}

.placepin.hot .citylab { fill:var(--pool-violet); }

.placepin.orient { pointer-events:none; cursor:default; }

.hoverlab {
  font-family:var(--text); font-size:11px; font-weight:500; fill:var(--ink);
  paint-order:stroke; stroke:var(--paper); stroke-width:3.5;
  stroke-linejoin:round; pointer-events:none;
}

.listcell { display:flex; flex-direction:column; min-height:0; }
#rows { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; }

.listhead {
  flex:none; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:7px 14px; border-bottom:var(--edge); background:var(--panel2);
}
.listhead .sec { font-family:var(--display); font-weight:700; font-size:11px; letter-spacing:0.02em; }

.listhead .sec:empty { display:none; }
.listhead .acts { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-left:auto; }

.row {
  display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:12px;
  align-items:center; padding:9px 14px; border-bottom:1px solid var(--hair);
}
.row { cursor:pointer; }

.row .n { font-family:var(--mono); font-weight:700; font-size:11px; text-align:right; font-variant-numeric:tabular-nums; }

.row .nm {
  font-size:12px; font-weight:500; min-width:0; text-align:left;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  border:0; background:none; padding:0; color:inherit;
  font-family:inherit; cursor:pointer;
}
.row .nm:hover { text-decoration:underline; }
.row .act { display:flex; align-items:center; gap:10px; justify-content:flex-end; }
.row .mins { font-family:var(--mono); font-size:10px; min-width:58px; text-align:right; color:var(--ink2); font-variant-numeric:tabular-nums; }

.row .startbtn {
  border:var(--edge); background:var(--soft); cursor:pointer; padding:3px 8px;
  border-radius:var(--r-tag);
  font-family:var(--display); font-size:9px; letter-spacing:0.03em; color:var(--ink);
  box-shadow:var(--bevel-soft); opacity:0;
}

.row .cut {
  border:var(--edge); background:var(--field); cursor:pointer;
  border-radius:var(--r-tag); padding:3px 7px; font-family:var(--display); font-size:9px; line-height:1;
  color:var(--ink2); box-shadow:var(--bevel); opacity:0;
}
.row .cut:hover { background:var(--warn); color:var(--field); }
.row.hot .startbtn, .row:hover .startbtn, .row .startbtn:focus-visible,
.row.hot .cut, .row:hover .cut, .row .cut:focus-visible { opacity:1; }
.row.first .startbtn { visibility:hidden; }

.row.hot, .row:hover { background:var(--pool-violet); color:var(--pool-pale); }
.row.hot .mins, .row:hover .mins { color:var(--on-dark); }
.empty { margin:0; padding:18px 14px; font-size:11px; color:var(--ink2); letter-spacing:.04em; }

.leadnote {
  margin:0; padding:9px 14px; border-bottom:1px solid var(--hair);
  font-size:9.5px; letter-spacing:.06em; color:var(--ink2);
}

.crow {
  display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px;
  align-items:center; width:100%; padding:12px 14px; cursor:pointer;
  border:0; border-bottom:1px solid var(--hair); background:none;
  color:inherit; font:inherit; text-align:left;
}
.crow .cn {
  font-family:var(--display); font-weight:700; font-size:13px; letter-spacing:0.015em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.crow .cc {
  font-family:var(--mono); font-size:10px; color:var(--ink2);
  font-variant-numeric:tabular-nums; letter-spacing:.04em;
  white-space:nowrap;
}
.crow.hot, .crow:hover { background:var(--pool-violet); color:var(--pool-pale); }
.crow.hot .cc, .crow:hover .cc { color:var(--on-dark); }

.crow:focus-visible { outline:2px solid var(--pool-pink); outline-offset:-4px; }

.dropnote {
  margin:0; padding:8px 14px; border-bottom:1px solid var(--hair);
  font-size:9.5px; letter-spacing:.06em; color:var(--warn);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.dropnote .undo {
  border:var(--edge); background:var(--field); cursor:pointer;
  border-radius:var(--r-tag); padding:3px 9px; font-family:var(--display); font-size:9px; letter-spacing:0.03em;
  color:var(--ink); box-shadow:var(--bevel);
}
.dropnote .undo:hover { background:var(--soft); }

.btn {
  border:var(--edge); background:var(--field); cursor:pointer; padding:7px 14px;
  border-radius:var(--r-ctl);
  font-family:var(--display); font-size:11px; color:var(--ink);
  box-shadow:var(--bevel-field); display:inline-flex; align-items:center; gap:7px;
}
.btn:hover { background:var(--soft); }
.btn.tight { padding:4px 9px; font-size:10px; gap:5px; }
.btn[disabled], .btn.dead { opacity:.4; cursor:default; pointer-events:none; }

.wins { position:fixed; inset:0; pointer-events:none; z-index:20; }
.pop {
  position:absolute; pointer-events:auto;
  width:min(340px, calc(100vw - 24px));
  background:var(--panel); border:var(--edge); border-radius:var(--r-shell);
  box-shadow:0 2px 0 rgba(21,21,21,.18), 0 26px 46px -20px rgba(21,21,21,.55);
  display:flex; flex-direction:column; overflow:hidden;
}
.pop-bar {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:6px 10px; border-bottom:var(--edge);
  cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none;
}
.pop-bar:active { cursor:grabbing; }
.pop-close {
  border:0; background:none; padding:0 2px; font:inherit; font-size:14px;
  line-height:1; cursor:pointer; color:var(--ink);
}
.pop-close:hover { color:var(--warn); }
.pop-title {
  font-family:var(--display); font-weight:700; font-size:11px; letter-spacing:0.02em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:right;
}
.pop-body {
  padding:11px 12px 12px; display:flex; flex-direction:column; gap:10px;
  max-height:min(58vh,520px); overflow-y:auto;
  background:var(--field); box-shadow:inset 2px 2px 0 var(--hair);
}
.spec {
  display:grid; grid-template-columns:56px minmax(0,1fr); gap:5px 10px;
  margin:0; font-size:10.5px;
}
.spec dt { color:var(--ink2); letter-spacing:.06em; font-size:9px; padding-top:2px; }
.spec dd { margin:0; line-height:1.5; overflow-wrap:anywhere; }

.spec dd.shut { color:var(--ink); }
.pop-links { display:flex; flex-wrap:wrap; gap:6px; }

@media (max-width:880px) {

  .headrow { position:relative; }

  .place { padding-right:42px; }

  html, body { height:auto; overflow:auto; }

  .desk { padding:0; }
  .desk { height:100vh; height:100dvh; min-height:560px; overflow:hidden; }

  .win {
    flex:1; min-height:0; max-height:none; margin:0;
    border-radius:0; border-left:0; border-right:0; border-bottom:0;
    box-shadow:none;
  }

  .body {
    grid-template-columns:1fr;
    grid-template-rows:minmax(0,1.62fr) minmax(0,1fr);
    border-radius:0;
  }

  .win.nomap { max-width:none; }
  .win.nomap .body {
    grid-template-columns:1fr;
    grid-template-rows:minmax(0px,0fr) minmax(0,1fr);
  }
  .win.nomap .mapcell { border-bottom-width:0; }
  .mapcell { border-right:0; border-bottom:var(--edge); padding:6px; }

  .placepin { pointer-events:none; cursor:default; }

  .mapcard { flex:1; padding:6px; }

  .headrow { padding:8px 12px 6px; gap:6px; }
  .place { gap:8px; }
  .listhead { padding:5px 12px; }

  .pop.sheet {
    left:0; right:0; bottom:0; top:auto;
    width:auto; max-width:none;
    max-height:82vh; max-height:82dvh;
    border-radius:var(--r-shell) var(--r-shell) 0 0;
    border-bottom:0;
    box-shadow:0 -2px 0 rgba(21,21,21,.18), 0 -22px 44px -18px rgba(21,21,21,.55);
    animation:sheetup .18s ease-out;
  }

  @keyframes sheetup { from { transform:translateY(100%); } }

  .pop.sheet .pop-body { max-height:none; flex:1; min-height:0; }

  .pop.sheet .pop-bar { position:relative; padding:14px 8px 8px; cursor:grab; }
  .pop.sheet .pop-bar::after {
    content:""; position:absolute; left:50%; top:5px; transform:translateX(-50%);
    width:34px; height:3px; border-radius:var(--r-tag); background:var(--hair);
  }

  .pop.sheet .pop-close {
    min-width:44px; min-height:44px; margin:-8px 0 -8px -4px;
    font-size:19px; display:grid; place-items:center;
  }
  .pop.sheet .pop-title { font-size:12px; }

  .row { padding:12px 14px; min-height:44px; }
  .row .nm { font-size:14px; padding:5px 0; }
  .row .startbtn, .row .cut { min-height:32px; padding:6px 10px; }
  .crow { padding:15px 14px; min-height:48px; }
}

@media (max-width:880px) and (min-aspect-ratio:13/10) {
  .body {
    grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
    grid-template-rows:minmax(0,1fr);
  }

  .desk { min-height:380px; }

  .mapcell { border-right:var(--edge); border-bottom:0; }

  .win.nomap .body {
    grid-template-columns:minmax(0px,0fr) minmax(0,1fr);
    grid-template-rows:minmax(0,1fr);
  }
}

@media (min-width:881px) and (max-height:620px) {
  .win { max-height:calc(100dvh - 74px); }
  .headrow { padding:9px 14px 8px; }
  .mapcell { padding:10px; }
}

@media (prefers-reduced-motion: reduce) {
  .desk *, .desk *::before, .desk *::after {
    animation-duration:.001ms !important; transition-duration:.001ms !important;
  }
}

.pin.hot .dot, .pin:hover .dot { fill:var(--warn); }

.row .n { color:var(--accent); }

html { scrollbar-color:var(--ink) var(--panel2); }
::-webkit-scrollbar { width:9px; height:9px; }

.digwrap {

:root {

  --display:"Dreamcast","Nunito","MS Gothic",Osaka,"Helvetica Neue",Arial,sans-serif;
  --text:"Nunito","MS Gothic",Osaka,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Nunito","MS Gothic",ui-monospace,"Cascadia Mono",Consolas,monospace;

  --accent:#E8560A;
  --pool-violet:#E8560A;
  --pool-pink:#E8560A;
  --pool-pale:#000000;
  --on-dark:rgba(0,0,0,.72);

  --bevel:inset -1.5px -1.5px 0 rgba(0,0,0,.55), inset 1.5px 1.5px 0 rgba(255,255,255,.16);
  --bevel-soft:inset -1.5px -1.5px 0 rgba(0,0,0,.5), inset 1.5px 1.5px 0 rgba(255,255,255,.12);
  --bevel-key:inset -2px -2px 0 rgba(0,0,0,.5), inset 2px 2px 0 rgba(255,255,255,.28);
  --bevel-field:inset -2px -2px 0 rgba(0,0,0,.6), inset 2px 2px 0 rgba(255,255,255,.10);
}

.win { box-shadow:0 2px 0 rgba(0,0,0,.6), 0 24px 44px -20px rgba(0,0,0,.9); }

  background-color:var(--accent); color:#000000;
}

<style>
/* ============================================================
   PAPER MODE — dig, re-skinned to ericroberts.net
   ------------------------------------------------------------
   Appended last, so equal-specificity rules win on source order.
   Nothing above this block is edited.

   The site runs exactly two modes and never a third:

     cover   #E8560A ground, #FFFFFF ink   — /, /music, the footer band
     paper   #FFFFFF ground, #343A40 ink   — /posts, /apps, /me, /now

   dig had invented a third — black ground, white ink, orange as a
   small accent — which is why it read as a separate property. This
   block maps dig's two screens onto the site's two modes instead:
   the magazine cover becomes the site's cover, the tool becomes the
   site's paper. Black survives only where the site keeps it: as a
   hover ink (#1D1410, which is `.dc a:hover` on the home page).

   Contrast, measured rather than eyeballed, because the orange is
   the whole constraint:

     #E8560A on #FFFFFF   3.64:1   large type and >=3px marks only
     #FFFFFF on #E8560A   3.64:1   same — display sizes only
     #1D1410 on #E8560A   4.98:1   the accessible pairing on orange
     #C4460A on #FFFFFF   4.97:1   the accessible orange on paper
     #343A40 on #FFFFFF  10.30:1   body ink

   So orange never carries small text. Below ~16px it becomes
   #C4460A on paper or #1D1410 on orange. That is the same discipline
   the site already keeps — it only ever sets orange as a ground or
   as the 7rem+ Dreamcast wordmark, never as running text.
   ============================================================ */

:root {
  /* the site's own values, lifted from /style.css */
  --er-orange:#E8560A;      /* body.home-page, .wrapper-footer */
  --er-orange-ink:#C4460A;  /* orange, darkened until it passes on paper */
  --er-ink:#343A40;         /* body colour */
  --er-ink-hi:#1D1410;      /* .dc a:hover */
  --er-muted:#868E96;       /* h4, h6, .date, blockquote p */
  --er-line:#E9ECEF;        /* table borders, .tag ground */
  --er-line-soft:#F1F3F5;   /* hr, ::selection, footnote borders */
  --er-line-mid:#DEE2E6;    /* blockquote rule, .count ground */
  --er-wash:#F8F9FA;        /* .highlight ground */
  --er-blue:#1B6EC2;        /* a — the only link colour on the site */

  /* Shape. The site has no square corner anywhere — its whole radius
     vocabulary is three values, and they are small:
       2px  a.footnote
       3px  .post .tag a, code.highlighter-rouge, pre.highlight, and the
            seven rx="3" vent slats in the home page's Dreamcast drawing
       5px  img, .site-avatar img
     dig had gone the other way twice: full 999px pills in the original
     retro sheet, then border-radius:0 on everything when that sheet was
     flattened. Neither is a shape the site makes. Controls take the 3px
     it puts on a tag or a code span; surfaces take the 5px it puts on an
     image. Nothing becomes a pill, because nothing on the site is one. */
  --er-r-fine:2px;
  --er-r-ctl:3px;
  --er-r-surf:5px;

  /* remap dig's existing tokens onto them, so every rule that was
     already written against a token comes along for free */
  --ink:var(--er-ink);
  --ink2:var(--er-muted);
  --paper:#FFFFFF;
  --panel:#FFFFFF;
  --panel2:transparent;
  --field:#FFFFFF;
  --soft:var(--er-line-soft);
  --hair:var(--er-line-soft);
  --paper-line:var(--er-line-soft);
  --accent:var(--er-orange);
  --pool-violet:var(--er-orange);
  --pool-pink:var(--er-orange);
  --pool-pale:#FFFFFF;
  --on-dark:var(--er-muted);
  --warn:var(--er-orange-ink);
  --warn-ink:var(--er-orange-ink);
  --edge:1.5px solid var(--er-line);
}

html, body { background:#FFFFFF; }

/* ---------------- 1. the cover: the site's home page ----------------
   Orange field, white line art, Dreamcast wordmark. The word was
   filled orange, which on an orange ground is nothing at all; it goes
   back to the white outline it had — and that outline is now the same
   gesture as the home page's 2.35px white Dreamcast drawing rather
   than a coincidence. */
.digwrap {
  background-color:var(--er-orange);
  background-image:none;   /* see "flat grounds" below */
  color:#FFFFFF;
}

.wordwrap.city .word {
  color:transparent;
  -webkit-text-stroke:2.35px #FFFFFF;  /* the home page's stroke-width */
  letter-spacing:-.03em;
}
.wordwrap.city:hover .word,
.wordwrap.city:focus-within .word,
.wordwrap:hover .word,
.wordwrap select:focus-visible ~ .word,
.wordwrap .cycle:focus-visible ~ .word {
  color:#FFFFFF; -webkit-text-stroke-color:#FFFFFF;
}

/* 13px bold on orange is exactly where white stops being readable
   (3.64:1), so the subtitle takes the ink instead — 4.98:1, and the
   same colour the home page's hover state uses.

   Set in sentence case, so the tracking comes almost all the way out.
   .18em was buying legibility back from all-caps, which loses the
   word-shapes that let you read at a glance; with ascenders and
   descenders doing that job, the same tracking just pulls the line
   apart. The site sets no tracking on running text at all. */
.valueline {
  color:var(--er-ink-hi); letter-spacing:.01em; text-align:center;
}
/* Centred under the count rather than ranged left with it. The number is
   drawn as fixed-width .dgt cells so its block has a definite width, and
   this column shrink-wraps to whichever of the two is wider — so the
   caption sits on the number's centre line instead of its left edge.
   The block itself stays at left:22px; only the pair is centred. */
.wordwrap.city { align-items:center; }

/* The destination action is solid and the location shortcut is outlined,
   so the planning path remains primary for visitors outside Japan. */
.mag-search {
  background:transparent; color:#FFFFFF;
  border:2.35px solid #FFFFFF; border-radius:0;
}
.mag-search:hover, .mag-search:focus-visible {
  background:#FFFFFF; color:var(--er-ink-hi); animation:none;
}
.mag-search:active { background:var(--er-ink-hi); color:#FFFFFF; border-color:var(--er-ink-hi); }
.mag-search:focus-visible { outline:2px solid #FFFFFF; outline-offset:4px; }
/* "Start", not "START" — so .22em of tracking comes out with the caps.
   A word in sentence case is read by its silhouette; spacing the
   letters apart is what you do when there is no silhouette left. */
.mag-search .go { letter-spacing:.02em; }
.mag-actions {
  display:flex; align-items:stretch; justify-content:flex-end; gap:12px;
}
.mag-primary {

}

}
.mag-secondary:hover, .mag-secondary:focus-visible {

}
.mag-secondary:active {

}

.geo-status {

@media (max-width:720px) {
  .mag-foot { align-items:stretch; }

@keyframes searchfill {
  0%,  20%  { background-color:rgba(255,255,255,0); }
  22%, 40%  { background-color:rgba(255,255,255,1); }
  42%, 100% { background-color:rgba(255,255,255,0); }
}
@keyframes searchink {
  0%,  20%  { color:#FFFFFF; }
  22%, 40%  { color:#1D1410; }
  42%, 100% { color:#FFFFFF; }
}
.digwrap :focus-visible { outline:2px solid #FFFFFF; outline-offset:3px; }
.digwrap ::selection { background:#FFFFFF; color:var(--er-ink-hi); }

/* There was a Dreamcast "Eric Roberts" down here linking back to the
   site. Removed: the cover already says what it is in 116px, and a
   second wordmark on the same screen makes the reader choose between
   two titles. The sweep below still runs on arrival — the continuity it

/* ---------------- 2. the tool: the site's content pages ----------------
   White paper, #343A40 ink, hairlines out of the site's grey ramp.

   FLAT GROUNDS. Every ground here was carrying a 34px ruled grid, and
   two of them a stack of radial glows underneath it as well. The site
   has neither: body.home-page is one flat #e8560a, the content pages are
   one flat #ffffff, and the only marks on either are the drawing and the
   type. A ruled ground is a texture the site does not own, and on paper
   it also competes with the thing the grid is supposed to suggest — the
   map already has its own graticule. So all of it comes off: no grid on
   the cover, none on the desk, none in the map card. */
.desk, .digwrap.gone {
  background-color:#FFFFFF;
  background-image:none;
  color:var(--er-ink);
}
.desk ::selection { background:var(--er-line-soft); color:#000000; }
.desk :focus-visible { outline:2px solid var(--er-orange-ink); outline-offset:2px; }
.desk a { color:var(--er-ink); }
.desk a:hover { color:var(--er-orange-ink); }

.headrow { border-bottom:1.5px solid var(--er-line); }
.listhead { background:transparent; border-bottom:1.5px solid var(--er-line); }
.listhead .sec { color:var(--er-muted); }
.mapcell { border-right:0; }

.shop-search {
  flex:1 1 320px; max-width:470px; min-width:240px; margin-left:auto;

  }

/* ---------------- 3. the map, drawn with the home page's pen ----------------
   The home page is a technical line drawing: 2.35px, no fills, round
   caps and joins, dimension arrows with labels. The map is the same
   idiom, so it gets the same pen instead of its own. */
.mapcard {
  background-color:#FFFFFF; background-image:none;
  box-shadow:none; border:0;
}
.route {
  stroke:var(--er-orange); stroke-width:2.35;
  stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:none;
}
.route-done { stroke:rgba(52,58,64,.28); stroke-width:1.6; }
.route-case { stroke:#FFFFFF; stroke-width:6; }

/* The moving mark used to be a chevron flying along the route on an
   animateMotion — a second object on a map that otherwise has only
   dots and one line, and it had to be rotated to face the right way at
   every corner. It is now the route itself: the same path, the same
   2.35px, dashed so that exactly one short segment exists at a time,
   and travelling by stroke-dashoffset. Nothing is added to the drawing;
   a stretch of the line just goes dark and moves. Round caps so the
   segment reads as a speck rather than a cut piece of pipe. */
.runner {
  stroke:var(--er-ink-hi); stroke-width:2.35;
  stroke-linecap:round; stroke-linejoin:round;
}

.pin .dot { fill:#FFFFFF; stroke:var(--er-ink); stroke-width:1.4; }
.pin .halo { stroke:var(--er-orange); stroke-width:1.6; }
.pin .term { stroke:var(--er-ink); }
.pin.on .dot, .pin.first .dot { fill:var(--er-orange); stroke:var(--er-orange); }
.pin.first .halo { stroke:var(--er-orange); }
.pin.hot .dot, .pin:hover .dot { fill:var(--er-orange-ink); stroke:var(--er-orange-ink); }
.pin.hot .halo, .pin:hover .halo { stroke:var(--er-orange-ink); }
.hoverlab { fill:var(--er-ink); stroke:#FFFFFF; }
.citylab  { fill:var(--er-ink); stroke:#FFFFFF; }
.placepin .cdisc { fill:var(--er-orange); stroke:var(--er-orange); stroke-width:1.5; }
.placepin.hot .cdisc, .placepin:hover .cdisc { fill:var(--er-ink-hi); stroke:var(--er-ink-hi); }
.placepin.hot .citylab, .placepin:hover .citylab { fill:var(--er-ink-hi); }
.leader { stroke:var(--er-muted); opacity:.6; }

/* ---------------- 4. controls ----------------
   Quiet outlines in the site's grey ramp; orange only for the state
   that is actually on, and with the ink on top of it. */
/* background-COLOR, not the background shorthand, on all four of these.
   The phone rules below paint the ▾ as a background-image, and a
   shorthand here would reset it — silently dropping the caret from
   exactly the chips that are switched on. */
.ctlbtn, .ctlicon {
  border:1.5px solid var(--er-line-mid); background-color:transparent;
  color:var(--er-ink);
}
.ctlbtn:hover, .ctlicon:hover {

}

}
.ctlbtn.on, .ctlbtn[aria-expanded="true"], .segbtn.on,
.segbtn[aria-pressed="true"] {
  background-color:var(--er-orange); border-color:var(--er-orange);
  color:var(--er-ink-hi);
}
.ctlicon.dead { color:#CED4DA; border-color:var(--er-line); }

.ctlmenu {
  background:#FFFFFF; border:1.5px solid var(--er-line);
  box-shadow:0 14px 30px -16px rgba(52,58,64,.5);
}
.ctlmenu button { color:var(--er-ink); }
.ctlmenu button:hover { background:var(--er-line-soft); color:var(--er-ink-hi); }
.ctlmenu button[aria-selected="true"] { background:var(--er-orange); color:var(--er-ink-hi); }

.ctlmenu button[disabled]:hover { background:transparent; color:#CED4DA; }

.backbtn {
  border:1.5px solid var(--er-line-mid); background:transparent;
  color:var(--er-ink);
}
.backbtn:hover {
  background:var(--er-orange); border-color:var(--er-orange);
  color:var(--er-ink-hi);
}
.backbtn:focus-visible { outline:2px solid var(--er-orange-ink); outline-offset:2px; }

.btn, .row .startbtn, .row .cut, .dropnote .undo {
  border:1.5px solid var(--er-line-mid); background:transparent;
  color:var(--er-ink); border-radius:0; box-shadow:none;

}

  background:var(--er-orange-ink); border-color:var(--er-orange-ink);

}

/* ---------------- 5. the list ----------------
   The hover row was a solid inversion. On paper that is a black bar
   through a white page; the site's own ::selection is #F1F3F5, so the
   row takes that and a 3px orange rule instead. The colour still
   marks the row, at a weight where 3.64:1 is allowed. */
.row, .crow { border-bottom:1px solid var(--er-line-soft); }
.row { box-shadow:inset 3px 0 0 transparent; }
.row .n { color:var(--er-orange-ink); }
.row.first .n { color:var(--er-ink-hi); }
.row .mins { color:var(--er-muted); }
.row.hot, .row:hover {
  background:var(--er-line-soft); color:var(--er-ink-hi);

.row.hot .n, .row:hover .n,
.row.hot.first .n, .row:hover.first .n { color:var(--er-orange-ink); }

.row.hot .startbtn, .row:hover .startbtn,

}

}

}

.empty, .leadnote { color:var(--er-muted); }
.dropnote { color:var(--er-orange-ink); border-bottom-color:var(--er-line-soft); }

/* ---------------- 6. shop windows ---------------- */
.pop {
  background:#FFFFFF; border:1.5px solid var(--er-line); border-radius:0;

/* ---------------- 8. type scale ----------------
   The site sets an 18px root and reads its articles at 1.45rem/1.75.
   dig was running 10-12px, which is a different publication. Opened up
   on desktop only — the mobile rules above already sized up, and this
   sheet is later, so an unscoped rule would shrink them back. */
@media (min-width:881px) {
  .row .nm { font-size:14px; letter-spacing:.005em; }

  .row .mins { font-size:11px; }

  .crow .cc { font-size:11px; }

/* ---------------- 9. shape ----------------
   The site's three radii, put back on. Controls at 3px, surfaces at 5px,
   and the window itself left square because it is the edge of the page
   rather than an object sitting on it. */
.btn, .row .startbtn, .row .cut, .dropnote .undo,
.ctlbtn, .ctlicon, .backbtn, .mag-search {
  border-radius:var(--er-r-ctl);
}
.ctlmenu, .pop, .mapcard { border-radius:var(--er-r-surf); }

/* The pane switcher is mobile-only and was missed entirely by the passes
   above: a white 1.5px border and white labels, which on paper is an
   invisible control floating over the map. Same treatment as the filter
   chips it is a sibling of, plus a shadow, because unlike them it is
   fixed over the map rather than sitting in the header. */
@media (max-width:880px) {
  .seg {

    background:#FFFFFF; overflow:hidden;

    background:var(--er-orange); color:var(--er-ink-hi);

/* ---------------- 10. the header row on a phone ----------------
   The Maps button was dropping onto a second line of its own. .place is
   flex-wrap:wrap, and on a 360px screen the four controls before it do
   not fit: back(29) + place + genre + day + icon(27) + gaps. With the
   genre set to "Club & Dance" that comes to roughly 390px, so the icon
   wraps — and being last, it wraps alone.

   Shrinking the chips does not fix it, it only moves the threshold. The
   longest genre in the set is "Electronica & Ambient", and at any legible
   size that row cannot fit on a phone. So the row stops wrapping and the
   genre chip absorbs the difference instead: it is the only control here
   whose label has no bound, and the only one that can lose its tail and
   still be identifiable. Everything else stays flex:none at full width.

   Which means the ▾ has to come off ::after and become a background
   mark, or text-overflow would eat the caret before the label. Drawn
   with the same two-gradient triangle pair the scrollbar end-caps use,
   in currentColor so it follows the chip through its active state, and
   applied to all three chips so one caret shape is used throughout —
   not a different one on the chip that happens to truncate. */
@media (max-width:880px) {
  .headrow { padding:10px 12px 9px; }
  .place { flex-wrap:nowrap; min-width:0; gap:6px; }

  .ctlbtn {
    display:block; min-width:0; min-height:29px; line-height:17px;
    padding:6px 22px 6px 9px; font-size:9px; letter-spacing:.1em;
    text-align:left;
  }
  .ctlbtn::after { content:none; }

  /* The states have to be named here, not just .ctlbtn. Two rules above
     this sheet — .ctlbtn:hover and .ctlbtn.on — set the background
     SHORTHAND, which expands to background-image:none at 0,2,0. A plain
     .ctlbtn caret at 0,1,0 loses to that on specificity no matter how
     late it is declared, so the mark would disappear from precisely the
     chips that are switched on. Matching their specificity and coming
     later wins both. */
  .ctlbtn,
  .ctlbtn:hover,
  .ctlbtn.on,
  .ctlbtn[aria-expanded="true"] {
    background-image:
      linear-gradient(45deg,  transparent 50%, currentColor 50%),
      linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-repeat:no-repeat, no-repeat;
    background-size:4px 4px, 4px 4px;
    background-position:right 10px center, right 6px center;
  }

  /* the one control allowed to give ground, and the floor it stops at */
  #ctlGenre { flex:0 1 auto; min-width:56px; }
  #ctlGenreBtn {
    max-width:100%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  /* so it can never be the thing that gets pushed off the row */
  #mapsLink { flex:none; }
}

{"n": "HOT VINYL", "nja": "", "slug": "hotvinyl", "a": "Nishi", "c": "Kanagawa", "lat": 35.46337192377048, "lng": 139.6175530846595, "adr": "Room 211, 2-9-9 Minamisaiwai, Nishi-ku, Yokohama, Kanagawa, Japan.", "h": "Open daily from 11:00 AM to 7:30 PM. The shop can stay open later by arrangement, so customers are welcome to get in touch in advance. Closed on Tuesdays. Please note that extended temporary closures may occur during record-buying trips.", "cl": "", "g": ["Rock & Indie"], "inv": null, "tel": "045-322-9144", "ig": "", "w": "http://www.hotvinyl.jp/", "tw": "https://twitter.com/hotvinyljp", "new": null, "used": null, "v": "", "s": "Opened in November 2000, this is one of the few true collector-focused record shops in Yokohama. The store specializes in UK bands, particularly Merseybeat, with a solid selection of essential titles always in stock. Special attention is given to the shop’s singles selection, attracting collectors who travel from far away specifically to browse 45s and other single releases. The store is also a popular destination for DJs searching for new finds, and it's not uncommon for customers to strike up friendships through their shared passion for music—one of the shop’s unique charms. All records are meticulously organized in strict alphabetical order, making it easy to check whether a particular title is available. Customers are welcome to listen to as many records as they like before purchasing, providing added confidence for collectors and audiophiles who place a high value on sound quality.", "src": "recoya", "osm": "", "dOK": true, "lOK": true},

  function displayTitleCase(name) {
    var abbreviations = {
      HMV: true, CD: true, CDS: true, DVD: true, DJ: true,
      LP: true, EP: true, UK: true, USA: true, NYC: true, JPN: true,
      JR: true, SNS: true, URL: true
    };

    return String(name || "").replace(/[A-Za-z][A-Za-z'\u2019.-]*/g, function (word) {
      var key = word.replace(/[^A-Za-z]/g, "").toUpperCase();
      if (abbreviations[key]) return word.toUpperCase();
      if (word !== word.toUpperCase()) return word;

      return word.toLowerCase().replace(/(^|-)([a-z])/g, function (_, boundary, letter) {
        return boundary + letter.toUpperCase();
      });
    });
  }

  function directoryShopName(s) {
    var name = String(s.n || "").replace(
      /\s*[\uFF08(][^\uFF09)]*[\u3040-\u30ff\u3400-\u9fff][^\uFF09)]*[\uFF09)]\s*$/,

    if (!here.length && !locked) {

    var html = "", rows;

      here.forEach(function (v) { at[v.s.ix] = v; });
      rows = pool.slice().sort(function (a, b) {
        var pa = at[a.ix], pb = at[b.ix];
        return (pa ? Math.hypot(pa.x - cx, pa.y - cy) : 1e9) -
               (pb ? Math.hypot(pb.x - cx, pb.y - cy) : 1e9);

  function dockWindow(win) {
    if (sheetMode()) {

  function clampTo(win, x, y) {
    var w = win.offsetWidth;
    return [
      Math.max(60 - w, Math.min(x, window.innerWidth - 60)),
      Math.max(0, Math.min(y, window.innerHeight - 30))
    ];
  }

  function drag(win, bar) {
    var sx = 0, sy = 0, ox = 0, oy = 0, on = false, sheet = false, dy = 0;

    bar.addEventListener("pointerdown", function (e) {
      if (e.target.closest(".pop-close")) return;
      on = true; dy = 0;
      sheet = win.classList.contains("sheet");
      sx = e.clientX; sy = e.clientY;
      if (sheet) {
        win.style.transition = "none";
      } else {
        ox = parseFloat(win.style.left) || 0;
        oy = parseFloat(win.style.top) || 0;
      }
      try { bar.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });

    bar.addEventListener("pointermove", function (e) {
      if (!on) return;
      if (sheet) {

        dy = Math.max(0, e.clientY - sy);
        win.style.transform = "translateY(" + dy.toFixed(1) + "px)";
        return;
      }
      var p = clampTo(win, ox + e.clientX - sx, oy + e.clientY - sy);
      win.style.left = p[0] + "px";
      win.style.top = p[1] + "px";
    });

    function stop(e) {
      if (!on) return;
      on = false;
      try { bar.releasePointerCapture(e.pointerId); } catch (err) {}
      if (!sheet) return;
      if (dy > SHEET_DISMISS) { closeShop(+win.getAttribute("data-shop")); return; }

      win.style.transition = REDUCE ? "" : "transform .16s ease-out";
      win.style.transform = "";
    }
    bar.addEventListener("pointerup", stop);
    bar.addEventListener("pointercancel", stop);
  }

  function openShop(ix, e) {
    var s = SHOPS[ix];
    if (!s) return;
    if (WINS[ix]) { front(WINS[ix]); return; }

    if (sheetMode()) {
      Object.keys(WINS).forEach(function (k) { closeShop(+k); });
    }

    var win = document.createElement("div");
    win.className = "pop";
    win.setAttribute("data-shop", ix);
    win.innerHTML =
      '<div class="pop-bar">' +
        '<button class="pop-close" type="button" aria-label="Close ' + esc(directoryShopName(s)) + '">✕</button>' +
        '<span class="pop-title">' + esc(directoryShopName(s)) + "</span>" +
      "</div>" +
      '<div class="pop-body">' + shopBody(s) + "</div>";

    if (!sheetMode()) {
      var w = Math.min(340, window.innerWidth - 24);
      var x, y;
      if (e && (e.clientX || e.clientY)) {
        x = e.clientX + 16;
        y = e.clientY - 24;
        if (x + w > window.innerWidth - 8) x = e.clientX - w - 16;
      } else {
        x = (window.innerWidth - w) / 2 + cascade * 24;
        y = 90 + cascade * 24;
        cascade = (cascade + 1) % 6;
      }
      win.style.left = Math.max(8, x) + "px";
      win.style.top = Math.max(8, y) + "px";
    }

    $("wins").appendChild(win);
    if (sheetMode()) {
      dockWindow(win);
    } else {
      var p = clampTo(win, parseFloat(win.style.left), parseFloat(win.style.top));
      win.style.left = p[0] + "px";
      win.style.top = p[1] + "px";
    }

    front(win);
    WINS[ix] = win;

    win.addEventListener("pointerdown", function () { front(win); });
    win.querySelector(".pop-close").addEventListener("click", function () { closeShop(ix); });
    drag(win, win.querySelector(".pop-bar"));
  }

  var REDUCE = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var anim = null;

  function animateTo(t, ms) {
    if (!t) return;
    if (anim) { cancelAnimationFrame(anim); anim = null; }
    if (REDUCE || !ms) {
      view.lat = t.lat; view.lng = t.lng; view.z = clampZ(t.z);
      render();
      return;
    }
    var fx = mercX(view.lng), fy = mercY(view.lat), fz = view.z;
    var tx = mercX(t.lng), ty = mercY(t.lat), tz = clampZ(t.z);
    var t0 = null;
    function step(now) {
      if (t0 === null) t0 = now;
      var k = Math.min(1, (now - t0) / ms);
      var e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      view.lng = invX(fx + (tx - fx) * e);
      view.lat = invY(fy + (ty - fy) * e);
      view.z = fz + (tz - fz) * e;
      if (k < 1) { drawFrame(); anim = requestAnimationFrame(step); }
      else { anim = null; render(); }
    }
    anim = requestAnimationFrame(step);
  }

    if (!openMenu) return;
    $(openMenu.menu).hidden = true;
    $(openMenu.btn).setAttribute("aria-expanded", "false");
    openMenu = null;
  }

  function fillMenu(id, rows, on, pick, rebuild, single) {
    var m = $(id);
    m.innerHTML = rows.map(function (r) {

      var lit = on(r.v);
      return '<button type="button" role="option" data-v="' + esc(r.v) + '"' +
        ' aria-selected="' + lit + '"' +
        (r.n ? "" : " disabled") + '>' +

        (single ? "" : '<span class="box">' + (lit ? "\u2713" : "") + "</span>") +
        '<span class="lb">' + esc(r.label) + "</span>" +
        '<span class="ct">' + r.n + "</span></button>";
    }).join("");
    m.onclick = function (e) {
      var b = e.target.closest && e.target.closest("button[data-v]");
      if (!b || b.disabled) return;
      pick(b.getAttribute("data-v"));

      if (single) { shutCtl(); paintFilters(); return; }

      paintFilters();

      PIN = null; CUT = {}; EDIT_SCOPE = null; hot = null;
      rebuild();
      var t = searchTarget();
      if (t) { animateTo(t, 260); } else { render(); }
    };
  }

  (function wireFilters() {
    function toggle(btn, menu, build) {
      return function (e) {
        e.stopPropagation();
        var wasOpen = openMenu && openMenu.btn === btn;
        shutCtl();
        if (wasOpen) return;
        build();
        $(menu).hidden = false;
        $(btn).setAttribute("aria-expanded", "true");
        openMenu = { btn: btn, menu: menu };
      };
    }

    $("ctlPlaceBtn").addEventListener("click",
      toggle("ctlPlaceBtn", "ctlPlaceMenu", function build() {
        fillMenu("ctlPlaceMenu", placeRows(),
          function (v) { return v === PLACE; },
          function (v) {
            if (!v) return;
            clearShopSearch(false);
            jump("city:" + v);
          },
          build, true);
      }));

    $("ctlGenreBtn").addEventListener("click",
      toggle("ctlGenreBtn", "ctlGenreMenu", function build() {
        fillMenu("ctlGenreMenu", genreRows(),
          function (v) { return v ? !!GENS[v] : !genCount(); },
          function (v) {
            if (!v) { GENS = {}; return; }
            if (GENS[v]) { delete GENS[v]; } else { GENS[v] = 1; }
          }, build);
      }));

    $("ctlDayBtn").addEventListener("click",
      toggle("ctlDayBtn", "ctlDayMenu", function build() {
        fillMenu("ctlDayMenu", dayRows(),
          function (v) { return v ? !!DAYSET[v] : !dayCount(); },
          function (v) {
            if (!v) { DAYSET = {}; return; }
            if (DAYSET[v]) { delete DAYSET[v]; } else { DAYSET[v] = 1; }
          }, build);
      }));

    document.addEventListener("click", function (e) {
      if (openMenu && !(e.target.closest && e.target.closest(".ctl"))) shutCtl();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" || e.keyCode === 27) shutCtl();
    });
  })();

  (function rowsFade() {
    var el = $("rows");
    if (!el) return;
    function upd() {
      el.classList.toggle("more", el.scrollHeight - el.scrollTop - el.clientHeight > 2);
    }
    el.addEventListener("scroll", upd, { passive: true });
    window.addEventListener("resize", upd);
    if (window.MutationObserver) new MutationObserver(upd).observe(el, { childList: true });
    upd();
  })();

  var WFIT_MIN = 0.26;
  var wprobe = null;
  function fitWords() {
    var wraps = document.querySelectorAll(".wordwrap");
    if (!wraps.length) return;

    if (!wprobe) {
      wprobe = document.createElement("span");
      wprobe.setAttribute("aria-hidden", "true");
      wprobe.style.cssText = "position:fixed;left:-9999px;top:0;" +
        "white-space:nowrap;visibility:hidden;pointer-events:none;" +
        "margin:0;padding:0;border:0;";
      document.body.appendChild(wprobe);
    }

    Array.prototype.forEach.call(wraps, function (w) {
      var word = w.querySelector(".word");
      if (!word) return;

      w.style.setProperty("--wfit", "1");

      var cs = window.getComputedStyle(word);
      wprobe.style.fontFamily = cs.fontFamily;
      wprobe.style.fontWeight = cs.fontWeight;
      wprobe.style.fontStyle = cs.fontStyle;
      wprobe.style.fontSize = cs.fontSize;
      wprobe.style.letterSpacing = cs.letterSpacing;
      wprobe.style.textTransform = cs.textTransform;
      wprobe.textContent = word.textContent;

      var need = wprobe.getBoundingClientRect().width;
      var avail = w.getBoundingClientRect().width;

      var fit = (need > 0 && avail > 0 && need > avail)
        ? Math.max(WFIT_MIN, (avail / need) * 0.99)
        : 1;
      w.style.setProperty("--wfit", fit.toFixed(3));
    });
  }
  window.addEventListener("resize", fitWords);
  window.addEventListener("orientationchange", fitWords);

  function enterDig(after) {
    var wrap = $("digWrap"), win = document.querySelector(".win");

    if (REDUCE || !win) {
      wrap.hidden = true;
      if (after) requestAnimationFrame(after);
      return;
    }

    win.classList.add("arriving");
    wrap.classList.add("leaving");
    setTimeout(function () {
      wrap.hidden = true;
      wrap.classList.remove("leaving");
      win.classList.remove("arriving");
      if (after) after();
    }, 700);
  }

  function paintSearch(count) {
    var input = $("shopSearch"), clear = $("clearSearch"), out = $("searchCount");
    if (!input || !clear || !out) return;
    clear.hidden = !SEARCH_RAW;
    if (SEARCH_RAW && !SEARCH) {
      out.textContent = "Type 1 more";
    } else {
      out.textContent = count + (count === 1 ? " shop" : " shops");
    }

    var title = SEARCH ? "Search results" : (lockedName || PLACE || "All Japan");
    if ($("resultPlace")) $("resultPlace").textContent = title;
  }

  function searchTarget() {
    if (SEARCH) return fitTarget(PLACED.filter(keep), 60);
    if (locked) return fitTarget(locked.filter(keep), 60);
    return PLACE ? cityFit(PLACE, 40) : null;
  }

  function editSource() {
    if (SEARCH) return PLACED;
    if (locked) return locked;
    if (!EDIT_SCOPE) {
      EDIT_SCOPE = inView().map(function (v) { return v.s; });
    }
    return EDIT_SCOPE;
  }

  function refitAfterEdit() {
    var remaining = editSource().filter(keep);
    var t = fitTarget(remaining, narrow() ? 40 : 60);
    if (!t) { render(); return; }

    var mapHidden = document.querySelector(".body").classList.contains("listview");
    animateTo(t, mapHidden ? 0 : 260);
  }

  function applyShopSearch(value, move) {
    SEARCH_RAW = normalizeSearch(value);
    SEARCH = SEARCH_RAW.length >= 2 ? SEARCH_RAW : "";
    PIN = null;
    CUT = {};
    EDIT_SCOPE = null;
    hot = null;
    shutCtl();

    var t = searchTarget();
    if (move && t) animateTo(t, 220);
    else render();
  }

  function clearShopSearch(move) {
    var input = $("shopSearch");
    if (input) input.value = "";
    applyShopSearch("", move !== false);
  }

  (function wireSearch() {
    var input = $("shopSearch"), clear = $("clearSearch"), timer = 0;
    input.addEventListener("input", function () {
      clearTimeout(timer);
      var value = input.value;
      timer = setTimeout(function () { applyShopSearch(value, true); }, 120);
    });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && input.value) {
        e.preventDefault();
        clearShopSearch(true);
      }
    });
    clear.addEventListener("click", function () {
      clearShopSearch(true);
      input.focus();
    });
  })();

  (function digPanel() {

    $("wCity").innerHTML = String(PLACED.length).replace(
      /\d/g, function (d) { return '<span class="dgt">' + d + "</span>"; });
    fitWords();

    if (!REDUCE) (function scrambleCount() {
      var el = $("wCity"), target = String(PLACED.length), n = target.length;

      function cells(s) {
        var out = "", i;
        for (i = 0; i < s.length; i++) {
          out += '<span class="dgt">' + s.charAt(i) + "</span>";
        }
        return out;
      }
      var HOLD = 900,
          STAGGER = 600,
          STEP = 55,
          t0 = Date.now(), timer;

      timer = setInterval(function () {
        var t = Date.now() - t0, s = "", settled = true, i;
        for (i = 0; i < n; i++) {
          if (t >= HOLD + i * STAGGER) {
            s += target.charAt(i);
          } else {
            s += String(Math.floor(Math.random() * 10));
            settled = false;
          }
        }
        el.innerHTML = cells(s);
        if (settled) {
          clearInterval(timer);

          fitWords();
        }
      }, STEP);
    })();

    var LANDING = CITY_BY_NAME["Tokyo"] ? "Tokyo" : (CITIES[0] && CITIES[0].c);

    $("digChoose").setAttribute("aria-label",
      "Choose a destination from " + PLACED.length + " record stores in Japan");

    $("digChoose").addEventListener("click", function () {
      GENS = {};
      DAYSET = {};
      clearShopSearch(false);
      if (LANDING) jump("city:" + LANDING, 0);
      enterDig(function () {
        $("ctlPlaceBtn").focus();
      });
    });

    $("nearMe").addEventListener("click", function () {
      var button = $("nearMe"), status = $("geoStatus");

      function ready() {
        button.disabled = false;
        button.removeAttribute("aria-busy");
        button.querySelector(".go").textContent = "Use my location";
      }

      function say(message) {
        status.textContent = message;
        status.hidden = false;
      }

      if (!navigator.geolocation) {
        say("Location is not available in this browser. Choose a destination instead.");
        $("digChoose").focus();
        return;
      }

      status.hidden = true;
      button.disabled = true;
      button.setAttribute("aria-busy", "true");
      button.querySelector(".go").textContent = "Finding you\u2026";

      navigator.geolocation.getCurrentPosition(function (position) {
        var here = [position.coords.latitude, position.coords.longitude];
        var nearest = PLACED.slice().sort(function (a, b) {
          return kmBetween(here, [a.lat, a.lng]) - kmBetween(here, [b.lat, b.lng]);
        }).slice(0, 12);

        if (!nearest.length) {
          ready();
          say("No located shops are available right now. Choose a destination instead.");
          $("digChoose").focus();
          return;
        }

        var nearestKm = kmBetween(here, [nearest[0].lat, nearest[0].lng]);
        if (nearestKm > 150) {
          ready();
          say("You appear to be outside Japan. Choose a destination to plan your trip.");
          $("digChoose").focus();
          return;
        }

        GENS = {};
        DAYSET = {};
        clearShopSearch(false);
        CUT = {};
        EDIT_SCOPE = null;
        PLACE = null;
        wantAreas = false;
        hot = null;
        locked = nearest;
        lockedName = "Near you";
        placeName = "NEAR YOU";
        PIN = nearest[0].ix;

        measure();
        animateTo(fitTarget(nearest, 60), 0);
        ready();
        enterDig();
      }, function (error) {
        ready();
        if (error.code === error.PERMISSION_DENIED) {
          say("Location access was blocked. Choose a destination instead.");
        } else if (error.code === error.TIMEOUT) {
          say("Finding your location took too long. Try again or choose a destination.");
        } else {
          say("We could not find your location. Choose a destination instead.");
        }
        $("digChoose").focus();
      }, {
        enableHighAccuracy:false,
        timeout:8000,
        maximumAge:300000
      });
    });

    if ($("digBack")) $("digBack").addEventListener("click", function () {
      $("digWrap").hidden = false;
      $("digWrap").classList.remove("leaving");
    });

  })();

  function jump(val, ms) {
    var t = null;
    if (val.indexOf("city:") === 0) {
      var c = val.slice(5);

      wantAreas = citySplits(c);
      PLACE = c;

      measure();
      t = cityFit(c, 40);

      if (t && t.z < CITY_Z) t.z = CITY_Z;
      placeName = c.toUpperCase();
    } else if (val.indexOf("area:") === 0) {

      pickArea(val.slice(5));
      return;
    }
    PIN = null;
    hot = null;
    CUT = {};
    EDIT_SCOPE = null;

    locked = null;
    lockedName = "";

    animateTo(t, ms === undefined ? 300 : ms);
  }

  function pickArea(key) {
    var a = AREA_BY_KEY[key];
    if (!a) return;
    wantAreas = false;
    locked = a.shops.slice();
    lockedName = a.a.toUpperCase();
    PIN = null;
    hot = null;
    hotArea = null;
    CUT = {};
    EDIT_SCOPE = null;
    animateTo(fitTarget(a.shops, 60), 300);
  }

  $("resetStart").addEventListener("click", function () { PIN = null; render(); });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    closeTopWindow();
  });

  $("rows").addEventListener("click", function (e) {
    var ar = e.target.closest(".crow[data-area]");
    if (ar) { pickArea(ar.getAttribute("data-area")); return; }

    var cb = e.target.closest("button[data-cut]");
    if (cb) {
      editSource();
      var cix = +cb.dataset.cut;
      CUT[cix] = 1;
      if (PIN === cix) PIN = null;

      refitAfterEdit();
      return;
    }
    if (e.target.closest("#undoCut")) {
      CUT = {};
      refitAfterEdit();
      return;
    }

    var sb = e.target.closest("button[data-start]");
    if (sb) {
      var ix = +sb.dataset.start;
      PIN = PIN === ix ? null : ix;
      render();
      return;
    }
    var r = e.target.closest(".row");
    if (!r) return;
    var rix = +r.getAttribute("data-ix");

    if (COARSE && hot !== rix && !e.target.closest(".nm")) {
      setHot(rix);
      return;
    }
    openShop(rix, e);
  });
  $("rows").addEventListener("mouseover", function (e) {
    if (COARSE) return;
    if (q_areaRows()) {
      var ar = e.target.closest(".crow[data-area]");
      setHotArea(ar ? ar.getAttribute("data-area") : null);
      return;
    }
    var r = e.target.closest(".row[data-ix]");
    setHot(r ? +r.getAttribute("data-ix") : null);
  });
  $("rows").addEventListener("mouseleave", function () {
    if (COARSE) return;

    if (q_areaRows()) setHotArea(null);
    else setHot(null);
  });

  function q_areaRows() { return !!document.querySelector(".crow[data-area]"); }

  $("rows").addEventListener("focusin", function (e) {
    var ar = e.target.closest(".crow[data-area]");
    if (ar) setHotArea(ar.getAttribute("data-area"));
  });

  function measure() {
    var r = svg.getBoundingClientRect();
    if (!r.width || !r.height) return false;
    var changed = Math.abs(r.width - size.w) > 0.5 || Math.abs(r.height - size.h) > 0.5;
    size.w = r.width; size.h = r.height;
    return changed;
  }

  function headSpace() {
    var hr = document.querySelector(".headrow");
    if (hr) {
      document.documentElement.style.setProperty("--headh", hr.offsetHeight + "px");
    }
  }
  headSpace();

  var reflowT = 0;
  function reflow() {
    headSpace();
    clearTimeout(reflowT);
    reflowT = setTimeout(function () {
      if (measure()) {

        if (SEARCH || PLACE || locked) {
          var t = searchTarget();
          if (t) { view.lat = t.lat; view.lng = t.lng; view.z = clampZ(t.z); }
        }
        render();
      }
      syncWindows();
    }, 90);
  }
  if (window.ResizeObserver) new ResizeObserver(reflow).observe(svg);
  window.addEventListener("resize", reflow);

  measure();

  PLACE = "Tokyo";
  var t0 = cityFit("Tokyo", 40);
  if (t0) {
    view.lat = t0.lat; view.lng = t0.lng;

    view.z = clampZ(Math.max(t0.z, CITY_Z));
  }
  placeName = "TOKYO";
  wantAreas = citySplits("Tokyo");
  render();
  requestAnimationFrame(function () { if (measure()) render(); });
})();
</script>

<script>
/* PAPER MODE — the one bit of the site that is DOM rather than CSS:
   the panel you arrive through. Purely additive; it appends a single
   element and touches nothing the app already owns. */
(function () {
  "use strict";

  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  /* Same panel, easing and duration as .page-overlay in /style.css,
     painted the cover's orange because that is the ground it uncovers. */
  var sweep = document.createElement("div");
  sweep.className = "er-sweep armed";
  document.body.appendChild(sweep);

  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      sweep.classList.add("moving");
      sweep.classList.remove("armed");
      sweep.classList.add("out");
    });
  });
})();
</script>
</body>
