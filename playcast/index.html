    return m >= 1000 ? (m / 1000) + " KM" : m + " M";
  }

  /* Returns the view that frames a set, rather than jumping to it — callers
     animate toward it so the eye can follow. */
  function fitTarget(list, pad) {
    if (!list.length) return null;
    var x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    list.forEach(function (s) {
      var x = mercX(s.lng), y = mercY(s.lat);
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
    });
    var availW = Math.max(60, size.w - pad * 2);
    var availH = Math.max(60, size.h - pad * 2);
    var dx = x1 - x0, dy = y1 - y0;
    var k = Math.min(dx > 1e-9 ? availW / dx : Infinity,
                     dy > 1e-9 ? availH / dy : Infinity);
    return {
      lng: invX((x0 + x1) / 2),
      lat: invY((y0 + y1) / 2),
      z: clampZ(k === Infinity ? 16 : Math.log(k * 2 * Math.PI / 256) / Math.LN2)
    };
  }

  /* ---- what the viewport currently holds ---- */
  function inView() {
    var out = [];
    PLACED.forEach(function (s) {
      var p = project(s.lat, s.lng);
      if (p[0] < 0 || p[0] > size.w || p[1] < 0 || p[1] > size.h) return;
      out.push({ s: s, x: p[0], y: p[1] });
    });
    return out;
  }

  /* ---- the base layer ---- */
  function drawBase() {
    var g = $("base");
    g.innerHTML = "";
    var W = size.w, H = size.h;

    /* world-anchored metric grid */
    var mm = mppMerc();
    var step = niceStep(mm * 90);
    var cx = mercX(view.lng) * R_EARTH, cy = mercY(view.lat) * R_EARTH;
    var halfW = (W / 2) * mm, halfH = (H / 2) * mm;
    var m, p;
    for (m = Math.ceil((cx - halfW) / step) * step; m <= cx + halfW; m += step) {
      p = (m - cx) / mm + W / 2;
      g.appendChild(el("path", { "class": "grid", d: "M" + p.toFixed(1) + " 0V" + H }));
    }
    for (m = Math.ceil((cy - halfH) / step) * step; m <= cy + halfH; m += step) {
      p = (cy - m) / mm + H / 2;
      g.appendChild(el("path", { "class": "grid", d: "M0 " + p.toFixed(1) + "H" + W }));
    }
  }

  /* ---- scale bar, pinned to the frame rather than the world ---- */
  function drawChrome() {
    var g = $("chrome");
    g.innerHTML = "";
    var m = mpp();
    var target = niceStep(m * 100);
    var barPx = target / m;
    var x = 14, y = size.h - 16;
    g.appendChild(el("path", {
      "class": "scaleline",
      d: "M" + x + " " + (y - 5) + "V" + y + "H" + (x + barPx).toFixed(1) +
         "V" + (y - 5)
    }));
    var t = el("text", { "class": "scaletext", x: x, y: y - 9 });
    t.textContent = distLabel(target);
    g.appendChild(t);
  }

  /* ---- markers, the route line and its direction ----
     Every shop in the frame gets its own circle. Nothing is merged and
     nothing is nudged: overlap at low zoom reads as density, and zooming is
     what separates them. Each circle carries an invisible hit disc so a
     4.5px dot is still comfortable to hit. */
  function drawMarks(here, routed, dimmed) {
    var marks = $("marks");
    marks.innerHTML = "";

    var pos = {}, last = 0;
    if (routed) {
      routed.stops.forEach(function (s, i) { pos[s.ix] = i + 1; });
      last = routed.stops.length;
    }

    here.forEach(function (it) {
      var s = it.s, n = pos[s.ix];
      var cls = "pin" +
        (n === 1 ? " first" : n === last && last > 1 ? " last" : n ? " on" : "") +
        (dimmed(s) ? " off" : "") +
        (s.lOK ? "" : " approx");
      var g = el("g", { "class": cls, "data-ix": s.ix, "aria-label": s.n });
      var x = it.x.toFixed(1), y = it.y.toFixed(1);
      g.appendChild(el("circle", { "class": "halo", cx: x, cy: y, r: 8 }));
      if (n === last && last > 1) {
        g.appendChild(el("rect", {
          "class": "term", x: (it.x - 8).toFixed(1), y: (it.y - 8).toFixed(1),
          width: 16, height: 16
        }));
      }
      g.appendChild(el("circle", { "class": "dot", cx: x, cy: y, r: 4.5 }));
      /* 20px across is a comfortable mouse target and a poor thumb one, so the
         disc is 28px on a touch device. Read off the device, not off the last
         gesture, so it is right on the very first paint. */
      g.appendChild(el("circle", { "class": "hit", cx: x, cy: y, r: coarseDev.matches ? 14 : 10 }));
      marks.appendChild(g);
    });

    var pts = routed && routed.stops.length > 1
      ? routed.stops.map(function (s) { return project(s.lat, s.lng); })
      : [];
    var d = pts.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
    $("routeCase").setAttribute("points", d);
    $("route").setAttribute("points", d);
    drawChevrons(pts);
  }

  /* Direction, without numbering anything: a chevron every ~70px along the
     line, pointing the way you walk. Placed by walking the polyline in screen
     space so spacing stays even however the route bends. */
  function drawChevrons(pts) {
    var g = $("chev");
    g.innerHTML = "";
    if (pts.length < 2) return;
    var GAP = 70, carry = GAP / 2;
    for (var i = 1; i < pts.length; i++) {
      var ax = pts[i - 1][0], ay = pts[i - 1][1];
      var bx = pts[i][0], by = pts[i][1];
      var dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy);
      if (len < 1e-6) continue;
      var ux = dx / len, uy = dy / len;
      for (var at = carry; at < len; at += GAP) {
        var cx = ax + ux * at, cy = ay + uy * at;
        if (cx < -20 || cx > size.w + 20 || cy < -20 || cy > size.h + 20) continue;
        var deg = Math.atan2(uy, ux) * R2D;
        g.appendChild(el("path", {
          "class": "chev", d: "M-4 -4 L0 0 L-4 4",
          transform: "translate(" + cx.toFixed(1) + " " + cy.toFixed(1) +
                     ") rotate(" + deg.toFixed(1) + ")"
        }));
      }
      carry = (carry - len) % GAP;
      if (carry < 0) carry += GAP;
    }
  }

  /* ============================================================
     the city layer
     ------------------------------------------------------------
     Zoomed out to the whole country, 346 dots collapse into three
     blots you cannot aim at, and the list underneath turns into a
     346-row dump with no order to it. So below CITY_Z the map stops
     drawing shops and draws cities: one circle each, sized by how
     many it holds, named only under the pointer, and clicking one
     flies in and hands you back the shops.
     A locked walk switches the layer off — a walk you have frozen
     has to stay visible however far out you pull.
     ============================================================ */
  function cityMode() { return !locked && view.z < CITY_Z; }

  /* Every city with a circle to draw, in screen space. Counts run through the
     same keep() the dots do, so the day and genre filters shrink these circles
     exactly as they thin a cluster — and a city with nothing left in it is
     dropped from the map, the way a filtered-out shop is. Zero-count cities
     still come back in this list: the count is what the drop note needs. */
  function citiesHere() {
    return CITIES.map(function (c) {
      var p = project(c.lat, c.lng);
      return {
        c: c.c, n: c.shops.filter(keep).length, all: c.shops.length,
        x: p[0], y: p[1]
      };
    }).filter(function (v) {
      /* a generous margin, so a circle straddling the edge is still drawn */
      return v.x > -60 && v.x < size.w + 60 && v.y > -60 && v.y < size.h + 60;
    });
  }

  /* 1 shop → 7.5px, 43 → 11.6, 90 → 14.5, 212 → 19.6. Square-rooted so the
     AREA tracks the count and not the radius, which is the only scaling that
     doesn't overstate the big city.
     The ceiling and the floor are both doing work. The floor keeps a two-digit
     count inside its circle; the ceiling is what stops Osaka and Kyoto — 29px
     apart on screen with the whole country in frame — from fusing into one
     figure-of-eight. At this scale they clear each other by 3px. */
  function cityR(n) { return Math.max(7.5, Math.min(22, 5 + Math.sqrt(n))); }

  /* ---- who does what at country scale ----
     On one column the map stops being something you aim at. At that zoom it is
     not really a map at all — it is an index that happens to be drawn
     geographically, and nobody chooses between Tokyo and Osaka by their relative
     positions. Meanwhile the geography is compressed enough that the circles
     collide: measured at 470px, Osaka and Kyoto sit 21.9px apart carrying 26.1px
     of combined radius, so they overlap by 4px and read as one blob. Widening
     the screen fixes it and narrowing it makes it worse, which is the tell that
     aiming was the wrong job to give it.
     So the two jobs are split. The map orients: marks and names, nothing to hit.
     The list aims: it already carries every city as a real button. Nothing is
     lost, collisions stop mattering because nothing has to be hit, and the marks
     can shrink to where they no longer touch. */
  function orientOnly() { return narrow(); }

  function drawCities(list) {
    var marks = $("marks");
    marks.innerHTML = "";
    var orient = orientOnly();
    /* Once the list is the control, the map no longer has to say HOW MANY —
       the row right below says "TOKYO · 212 SHOPS" in words. Dropping the
       numeral is what lets the mark shrink far enough to clear its neighbour. */
    var shrink = orient ? 0.62 : 1;
    /* no route at this zoom — and these have to be cleared by hand, or the
       line drawn before you zoomed out would still be lying across the map */
    $("routeCase").setAttribute("points", "");
    $("route").setAttribute("points", "");
    $("chev").innerHTML = "";

    list.forEach(function (v) {
      if (!v.n) return;
      var g = el("g", {
        "class": "placepin citypin" + (v.c === hotCity ? " hot" : ""),
        "data-city": v.c,
        "aria-label": v.c + ", " + v.n + (v.n === 1 ? " shop" : " shops")
      });
      var r = cityR(v.n) * shrink;
      var x = v.x.toFixed(1), y = v.y.toFixed(1);
      g.appendChild(el("circle", { "class": "cdisc", cx: x, cy: y, r: r.toFixed(1) }));
      if (!orient) {
        var t = el("text", { "class": "cct", x: x, y: (v.y + 3.5).toFixed(1) });
        t.textContent = v.n;
        g.appendChild(t);
      }
      /* The name, drawn and left there. Under the circle rather than beside it,
         so Osaka and Kyoto put their labels at different heights and clear.
         Shown whenever the marks cannot be pointed at for a name — either
         because the list is doing the aiming, or because a thumb has no hover
         to reveal one with. */
      if (orient || coarseDev.matches) {
        var lab = el("text", { "class": "citylab", x: x, y: (v.y + r + 11).toFixed(1) });
        lab.textContent = v.c;
        g.appendChild(lab);
      }
      /* No invisible hit disc, unlike a shop dot. Where these ARE targets they
         are big enough to be their own; where they are not, a padded one would
         be worse than useless. The count is pointer-transparent in CSS, so
         clicking the number is clicking the circle. */
      marks.appendChild(g);
    });
    setHotCity(hotCity);
  }

  /* The city layer's twin of setHot, and it keeps the same promise: the circle
     under the pointer is the only thing on this map that ever carries a name.
     Lights the matching list row too, so the two halves stay tied together the
     way they are for shops. */
  var hotCity = null;
  function setHotCity(c) {
    hotCity = c;
    var disc = null;
    var pins = document.querySelectorAll(".citypin[data-city]");
    Array.prototype.forEach.call(pins, function (n) {
      var on = c != null && n.getAttribute("data-city") === c;
      n.classList.toggle("hot", on);
      if (on) disc = n.querySelector(".cdisc");
    });
    var rows = document.querySelectorAll(".crow[data-city]");
    Array.prototype.forEach.call(rows, function (n) {
      n.classList.toggle("hot", c != null && n.getAttribute("data-city") === c);
    });

    var old = document.querySelector(".hoverlab");
    if (old) old.remove();
    if (!disc) return;
    /* Where the names already stand under every mark, a hover label would print
       the same word twice on top of itself. The standing one takes the .hot
       styling instead, which is the same signal by other means. */
    if (document.querySelector(".citylab")) return;
    var x = +disc.getAttribute("cx"), y = +disc.getAttribute("cy");
    var r = +disc.getAttribute("r");
    var right = x < size.w - 140;
    var t = el("text", {
      "class": "hoverlab",
      x: (x + (right ? r + 8 : -(r + 8))).toFixed(1), y: (y + 4).toFixed(1),
      "text-anchor": right ? "start" : "end"
    });
    t.textContent = c;
    $("marks").appendChild(t);
  }

  /* ============================================================
     the area layer
     ------------------------------------------------------------
     Between "which city" and "which shops" there was nothing, and
     the gap showed: arriving in Tokyo put 212 dots on the map and a
     message telling you to sort it out yourself. This is the missing
     rung, and it makes the whole thing country → city → area → walk,
     a tap each.
     It is keyed on the ROUTING LIMIT rather than on a zoom number.
     While more shops are in frame than a walk can hold, the map
     offers neighbourhoods instead; the moment a frame is walkable it
     goes back to drawing shops. So the layer appears exactly when it
     is needed and never when it is not, and the message it replaces
     was the very condition that summons it.
     No area in the set holds more than 35 shops, so picking one
     always lands on something routable — the drill terminates by
     construction rather than by hoping.
     ============================================================ */
  /* Below this an area is a place with a record shop in it, not a place to
     spend an afternoon. Tokyo has 38 such areas holding 49 shops between them,
     and marking them all put 38 overlapping pairs on the map. They stay in the
     LIST, which is where they can be read; they just are not drawn. */
  var AREA_MARK_MIN = 3;

  /* Set when the reader asks for a city, and held until they ask for something
     else. It used to be inferred purely from the shop count, which gave three
     different answers to the same request: ALL TOKYO listed districts, ALL OITA
     opened a one-stop walk, and ALL KYOTO did one or the other depending on
     whether a genre happened to be switched on. "Show me this city" should mean
     the same thing every time, so it is now recorded rather than guessed. */
  var wantAreas = false;

  function areaMode(drawCount) {
    return !locked && (wantAreas || drawCount > ROUTE_MAX);
  }

  /* Same shape citiesHere returns, so the two layers can be drawn by eye from
     one another. Counts run through keep(), so filters thin these exactly as
     they thin the dots. */
  function areasHere() {
    return AREAS.map(function (a) {
      var p = project(a.lat, a.lng);
      return {
        k: a.key, label: a.a, n: a.shops.filter(keep).length,
        all: a.shops.length, x: p[0], y: p[1]
      };
    }).filter(function (v) {
      return v.n > 0 &&
        v.x > -60 && v.x < size.w + 60 && v.y > -60 && v.y < size.h + 60;
    }).sort(function (a, b) {
      /* Ranked by what SURVIVES the filter, not by how big the area is in
         general. Under JAZZ, Shinjuku's 3 were sitting above Shimokitazawa's 5
         purely because Shinjuku is the bigger ward — which is the opposite of
         the question being asked. Ties break by name so the order is stable
         rather than dependent on however the areas were built. */
      return b.n - a.n || a.label.localeCompare(b.label);
    });
  }

  function drawAreas(list) {
    var marks = $("marks");
    marks.innerHTML = "";
    $("routeCase").setAttribute("points", "");
    $("route").setAttribute("points", "");
    $("chev").innerHTML = "";

    /* Always orientation-only, at every screen size — unlike the city layer,
       which can still be aimed at on a wide one. Eighteen marks over a city
       collide however much room there is, so the map never pretends to be the
       control here and the list always is. */
    /* Placed names, so the next one can be told to stay quiet if it would land
       on top of one already down. Jinbocho and Ochanomizu are 700m apart, which
       at the zoom that frames a whole city is five pixels — no radius separates
       those, and two names on the same five pixels is worse than one. The list
       is sorted largest-first and this walks it in order, so where two collide
       it is always the bigger neighbourhood that keeps its name. The smaller one
       still gets its mark, and its name is in the list either way. */
    var placed = [];
    list.forEach(function (v) {
      if (v.n < AREA_MARK_MIN) return;
      var r = cityR(v.n) * 0.62;
      var ly = v.y + r + 11;
      /* 5.6px per character at 10px in the display face, near enough */
      var half = v.label.length * 2.8 + 4;
      var clear = placed.every(function (p) {
        return Math.abs(p.y - ly) > 11 || v.x + half < p.x0 || v.x - half > p.x1;
      });

      var g = el("g", {
        "class": "placepin areapin orient" + (v.k === hotArea ? " hot" : ""),
        "data-area": v.k,
        "aria-hidden": "true"
      });
      var x = v.x.toFixed(1), y = v.y.toFixed(1);
      g.appendChild(el("circle", { "class": "cdisc", cx: x, cy: y, r: r.toFixed(1) }));
      if (clear) {
        var lab = el("text", { "class": "citylab", x: x, y: ly.toFixed(1) });
        lab.textContent = v.label;
        g.appendChild(lab);
        placed.push({ y: ly, x0: v.x - half, x1: v.x + half });
      }
      marks.appendChild(g);
    });
    setHotArea(hotArea);
  }

  /* The area layer's twin of setHotCity. Only ever driven from the list, since
     nothing here can be pointed at. */
  var hotArea = null;
  function setHotArea(k) {
    hotArea = k;
    Array.prototype.forEach.call(
      document.querySelectorAll(".areapin[data-area], .crow[data-area]"),
      function (n) {
        n.classList.toggle("hot", k != null && n.getAttribute("data-area") === k);
      });
  }

  /* ============================================================
     render
     ============================================================ */
  /* City and area, for the status bar. Never drawn on the map — dense
     clusters make persistent labels unreadable — so the place name lives in
     chrome instead, next to the scale. */
  /* The city, and nothing after it. This used to append the dominant ward when
     one covered half the frame — "TOKYO / SHINJUKU" — and that half was already
     on screen a few pixels below, in JUMP TO, which names the walk you picked.
     Two controls saying SHINJUKU is one too many, and the city is the half the
     select cannot tell you, since it goes on naming your last jump however far
     you then pan away from it.
     More than one city in frame still lists them all: that is a fact about the
     view rather than a repeat of a control. */
  function breadcrumb(shops) {
    if (!shops.length) return placeName || "JAPAN";
    var cities = {};
    shops.forEach(function (s) { cities[s.c] = 1; });
    return Object.keys(cities)
      .map(function (c) { return c.toUpperCase(); })
      .sort().join(" / ");
  }

  var lastRoute = null, lastDim = function () { return false; };

  /* Shown on the walk screen, collapsed on the country and district ones.
     Taking FULL off on the way out is not tidiness, it is the fix for two
     classes that each hide one half of the window: mapfull hides the list so
     the map can have everything, nomap collapses the map because there is
     nothing worth showing on it. Set together — press FULL in a walk, then pick
     ALL TOKYO from the menu — they hid both halves and left an empty screen with
     the district list unreachable behind it. FULL is a choice about one walk's
     screen, so it does not survive leaving that screen. */
  function showMap(on) {
    var body = document.querySelector(".body");
    /* nomap on the WINDOW (it resizes), mapfull on the BODY (it re-lays-out) */
    document.querySelector(".win").classList.toggle("nomap", !on);
    if (!on && body.classList.contains("mapfull")) {
      body.classList.remove("mapfull");
      var b = $("mapFull");
      b.textContent = "FULL";
      b.setAttribute("aria-label", "Expand the map");
    }
  }

  /* Map only. Called on every animation frame, so it must not re-solve the
     route or rebuild the list — those settle once the movement stops. */
  function drawFrame() {
    $("map").setAttribute("viewBox", "0 0 " + size.w + " " + size.h);
    drawBase();
    drawChrome();
    /* Checked per frame, not per gesture, so a flight between the country and
       a city swaps layers as it crosses CITY_Z rather than at either end —
       the circles break into dots on the way in, which is what makes the two
       views read as the same map. */
    if (cityMode()) { drawCities(citiesHere()); return; }
    var draw = inView().filter(function (v) { return keep(v.s); });
    /* The same test render() makes, made per frame, so flying out of a walk
       into a whole city dissolves the dots into neighbourhoods on the way
       rather than at the end of the flight. */
    if (areaMode(draw.length)) { drawAreas(areasHere()); return; }
    drawMarks(draw, lastRoute, lastDim);
    setHot(hot);
  }

  /* The country view. No route and no ordered list, because at this zoom the
     question is which city rather than which shop — so both halves answer
     that one instead. */
  function renderCityView() {
    var list = citiesHere();
    var live = list.filter(function (v) { return v.n; });
    var shops = live.reduce(function (a, v) { return a + v.n; }, 0);
    lastRoute = null;
    lastDim = function () { return false; };
    hot = null;

    drawBase();
    drawChrome();
    drawCities(list);

    /* Named from what is actually on screen rather than from placeName, which
       a pan or a wheel tick clears — so panning off Tokyo cannot leave the
       header still claiming the whole country. */
    $("walkName").textContent = !live.length ? "JAPAN"
      : live.length === CITIES.length ? "ALL JAPAN"
      : live.map(function (v) { return v.c.toUpperCase(); }).sort().join(" / ");
    $("walkStats").textContent =
      live.length + (live.length === 1 ? " CITY" : " CITIES") + " · " +
      shops + (shops === 1 ? " SHOP" : " SHOPS");

    showMap(false);
    var lead = live.length
      ? "PICK A CITY TO SEE ITS DISTRICTS"
      : "NOTHING MATCHES HERE — CLEAR THE GENRE OR THE DAY";

    $("listSec").textContent = "CITIES";

    var html = live.map(function (v) {
      return '<button class="crow" type="button" data-city="' + esc(v.c) + '">' +
        '<span class="cn">' + esc(v.c.toUpperCase()) + "</span>" +
        '<span class="cc">' + v.n + (v.n === 1 ? " SHOP" : " SHOPS") + "</span>" +
        "</button>";
    }).join("");
    if (!live.length) html = '<p class="empty">NOTHING MATCHES HERE.</p>';
    html = '<p class="leadnote">' + lead + "</p>" + html;

    /* Keyed by .c here, not .k: the entries in THIS list are cities. The area
       view's version of these four lines was pasted in with its AREA_BY_KEY
       lookup intact, which read undefined and threw — after listSec had been
       set and before the rows were written, so the header said CITIES while the
       list still showed the previous screen's areas. A silent half-render. */
    var gone = [];
    list.forEach(function (v) {
      CITY_BY_NAME[v.c].shops.forEach(function (s) { if (!keep(s)) gone.push(s); });
    });
    if (gone.length) {
      html += '<p class="dropnote">' + gone.length + " LEFT OUT — " +
        whyDropped(gone) + ". NOT COUNTED ABOVE.</p>";
    }
    $("rows").innerHTML = html;
    /* again, now the rows exist — drawCities lit the circle, and this is what
       lights its row to match */
    setHotCity(hotCity);

    renderGenreMenu(inView());
    renderControls(null, false);
    $("zIn").disabled = view.z >= Z_MAX - 0.001;
    $("zOut").disabled = view.z <= Z_MIN + 0.001;
  }

  /* The city view's sibling, one rung down. The map marks the neighbourhoods
     big enough to be worth a walk; the list carries every one of them, largest
     first, because a ranked menu of neighbourhoods is the thing a person
     planning a day out actually wants and is precisely what a map of 56
     centroids cannot be. */
  function renderAreaView() {
    var list = areasHere();
    var shops = list.reduce(function (a, v) { return a + v.n; }, 0);
    var marked = list.filter(function (v) { return v.n >= AREA_MARK_MIN; }).length;
    lastRoute = null;
    lastDim = function () { return false; };
    hot = null;

    drawBase();
    drawChrome();
    drawAreas(list);

    $("walkName").textContent = breadcrumb(
      inView().map(function (v) { return v.s; }));
    $("walkStats").textContent =
      list.length + (list.length === 1 ? " AREA" : " AREAS") + " · " +
      shops + (shops === 1 ? " SHOP" : " SHOPS");

    showMap(false);
    /* "TOO MANY FOR ONE WALK" is only true when it is. Oita has one shop and
       Kyoto under a genre filter can have a dozen; this screen is reached for
       both of those because a city was asked for, not because anything
       overflowed. */
    var lead = !list.length
      ? "NOTHING MATCHES HERE — CLEAR THE GENRE OR THE DAY"
      : shops > ROUTE_MAX
        ? "TOO MANY FOR ONE WALK — PICK A DISTRICT"
        : "PICK A DISTRICT";

    $("listSec").textContent = "AREAS";

    var html = list.map(function (v) {
      /* Measured over the shops that SURVIVE the filters rather than over the
         whole area: with a genre picked, what matters is how far apart the ones
         you would actually visit are. */
      var sp = spanLabel(spanKm(AREA_BY_KEY[v.k].shops.filter(keep)));
      return '<button class="crow" type="button" data-area="' + esc(v.k) + '">' +
        '<span class="cn">' + esc(v.label.toUpperCase()) + "</span>" +
        '<span class="cc">' + v.n + (v.n === 1 ? " SHOP" : " SHOPS") +
          (sp ? " · " + sp : "") + "</span>" +
        "</button>";
    }).join("");
    if (!list.length) html = '<p class="empty">NOTHING MATCHES HERE.</p>';
    html = '<p class="leadnote">' + lead + "</p>" + html;
    /* This screen never said what the filters were removing — the city view had
       the note and the area view, which is where a genre is most likely to be
       switched on, quietly did not. */
    var gone = [];
    list.forEach(function (v) {
      AREA_BY_KEY[v.k].shops.forEach(function (s) { if (!keep(s)) gone.push(s); });
    });
    if (gone.length) {
      html += '<p class="dropnote">' + gone.length + " LEFT OUT — " +
        whyDropped(gone) + ". NOT COUNTED ABOVE.</p>";
    }
    $("rows").innerHTML = html;
    setHotArea(hotArea);

    renderGenreMenu(inView());
    renderControls(null, false);
    $("zIn").disabled = view.z >= Z_MAX - 0.001;
    $("zOut").disabled = view.z <= Z_MIN + 0.001;
  }

  function render() {
    $("map").setAttribute("viewBox", "0 0 " + size.w + " " + size.h);

    if (cityMode()) { renderCityView(); return; }
    showMap(true);
    /* No label. The rows are numbered 1, 2, 3 with the minutes between them and
       the walk is named in the window header — "THE WALK, IN ORDER" was a
       caption for something already captioned twice. The element stays, because
       the two screens above still put a word in it. */
    $("listSec").textContent = "";
    hotCity = null;
    hotArea = null;

    var here = inView();
    /* locked: the walk is a fixed set of shops. live: it is whatever is in
       frame. Either way the day and genre filters still apply on top. */
    var source = locked || here.map(function (v) { return v.s; });
    var pool = source.filter(keep);

    /* Too many in frame to make a walk of? Then offer neighbourhoods rather
       than a message telling the reader to fix it. */
    if (areaMode(pool.length)) { renderAreaView(); return; }

    var routable = pool.length >= 2 && pool.length <= ROUTE_MAX;
    var R = routable ? solveRoute(pool) : null;

    var inPool = {};
    pool.forEach(function (s) { inPool[s.ix] = 1; });

    /* A filtered-out shop leaves the map rather than ghosting at low opacity:
       the route line already carries the shape, so the ghosts were noise.
       What stays dimmed is only the other case — shops that pass the filters
       but sit outside a LOCKED walk, where seeing what is nearby but not
       included is the whole point. */
    var draw = here.filter(function (v) { return keep(v.s); });
    var dimmed = function (s) { return !inPool[s.ix]; };
    lastRoute = R;
    lastDim = dimmed;

    drawBase();
    drawChrome();
    drawMarks(draw, R, dimmed);

    /* ---- header ---- */
    var place = breadcrumb(here.map(function (v) { return v.s; }));
    $("walkName").textContent = locked ? lockedName : place;
    /* This line used to open by saying the same number twice — "29 SHOPS IN
       VIEW · 29 STOPS" — because with no walk locked the shops in frame ARE the
       stops. So the in-view count is now printed only when it genuinely differs
       from the stop count, which is what happens with a walk locked: the walk is
       frozen while the view moves over it. Compared rather than assumed, so if
       solveRoute ever drops a stop the line still tells the truth.
       What is left is the part nothing else on the page says: how far it is and
       how long it takes. */
    var bits = [];
    if (R && R.km) {
      if (R.stops.length !== draw.length) {
        bits.push(draw.length + " IN VIEW");
      }
      bits.push(R.stops.length + " STOPS");
      bits.push(R.km.toFixed(1) + " KM");
      /* The total walking time used to headline here and it was false precision
         dressed as help: nobody walks a solved order through record shops, they
         wander and browse, and "~238 MIN ON FOOT" mostly frightened people off a
         perfectly good afternoon. The per-leg minutes in the list stay, because
         a four-minute hop to the next shop is a real thing to know. So does the
         distance — it is the honest shape of the thing without pretending to a
         schedule. */
    } else {
      bits.push(draw.length + (draw.length === 1 ? " SHOP" : " SHOPS") + " IN VIEW");
      /* On one column the hint below the map says this at length, a few pixels
         further down, and there is no room to say it twice. */
      if (pool.length > ROUTE_MAX && !narrow()) bits.push("ZOOM IN TO ROUTE");
    }
    /* LOCKED is already on the button and in the map hint. On a phone, twice is
       plenty; the header is not the place for a third. */
    /* The header already carries the walk's name and the hint explains the
       state; a third mention was two too many. */
    $("walkStats").textContent = bits.join(" · ");

    /* The floating hint that used to sit over the map has gone. Of its five
       messages one restated the header and the button ("SHOWING THE SHIBUYA
       WALK"), two restated the list word for word, and one could no longer
       happen at all — the area layer now catches an over-long frame before the
       walk view ever sees it. What was left worth saying is said in the list,
       where there is room for it and where the reader is already looking. */
    renderGenreMenu(here);
    renderList(here, source, pool, R);
    renderControls(R, routable);
    setHot(hot);

    $("zIn").disabled = view.z >= Z_MAX - 0.001;
    $("zOut").disabled = view.z <= Z_MIN + 0.001;
  }

  /* Counts are over what is on screen and passing the day filter, so the menu
     answers "what is in this neighbourhood" — they must not collapse to the
     genres already ticked. Genres absent from the frame still list, at zero,
     so a selection is never silently dropped. */
  function renderGenreMenu(here) {
    var counts = {};
    here.forEach(function (v) {
      if (!inDay(v.s)) return;
      famsOf(v.s).forEach(function (f) { counts[f] = (counts[f] || 0) + 1; });
    });
    genList().forEach(function (g) { if (counts[g] === undefined) counts[g] = 0; });
    var live = Object.keys(counts).sort(function (a, b) {
      return counts[b] - counts[a] || a.localeCompare(b);
    });

    var n = genCount();
    $("genreBtn").textContent =
      n === 0 ? "ANY GENRE" : n === 1 ? genList()[0] : n + " GENRES";
    $("genreBtn").setAttribute("aria-expanded", String(menuOpen));
    $("genreBtn").classList.toggle("on", n > 0);

    $("genrePanel").innerHTML =
      '<button type="button" class="clear" data-g="*" aria-pressed="' + (n === 0) +
        '"><span class="box">' + (n === 0 ? "\u2713" : "") + "</span>ANY GENRE</button>" +
      live.map(function (g) {
        var on = !!GENS[g];
        return '<button type="button" data-g="' + esc(g) + '" aria-pressed="' + on +
          '"><span class="box">' + (on ? "\u2713" : "") + "</span>" + esc(g) +
          '<span class="ct">' + counts[g] + "</span></button>";
      }).join("");
    $("genrePanel").hidden = !menuOpen;
    /* re-measured after every rebuild: ticking a genre changes the button
       labels and can change the panel's width */
    placeMenu();
  }

  function renderList(here, source, pool, R) {
    if (!here.length && !locked) {
      $("rows").innerHTML =
        '<p class="empty">NOTHING IN VIEW — ZOOM OUT, OR PICK SOMEWHERE FROM JUMP TO.</p>';
      return;
    }

    var html = "", rows;
    if (R) {
      rows = R.stops.map(function (s, i) {
        var mins = i === 0 ? "START" : Math.max(1, walkMinutes(R.legs[i - 1])) + " MIN";
        return row(s, i + 1, mins, i === 0, true);
      });
      html = rows.join("");
    } else {
      /* not routable: still list what's here, nearest the middle of the frame
         first, so the list and the map stay in step */
      var cx = size.w / 2, cy = size.h / 2, at = {};
      here.forEach(function (v) { at[v.s.ix] = v; });
      rows = pool.slice().sort(function (a, b) {
        var pa = at[a.ix], pb = at[b.ix];
        return (pa ? Math.hypot(pa.x - cx, pa.y - cy) : 1e9) -
               (pb ? Math.hypot(pb.x - cx, pb.y - cy) : 1e9);
      }).map(function (s) { return row(s, "·", "", false, false); });
      /* "NOT ENOUGH TO ROUTE" named the condition; these name the way out.
         The over-the-limit case that used to be handled here is unreachable
         now — more shops in frame than a walk can hold sends you to the
         district layer before this function is ever called. */
      /* Cause-agnostic on purpose. An empty pool can mean a filter excluded
         everything OR that every stop was cut by hand, and the notes appended
         below already name whichever it was — so this line states the position
         and leaves the diagnosis to the line that actually knows it. Naming a
         cause here would be wrong half the time. */
      html = '<p class="leadnote">' +
        (pool.length ? "A WALK NEEDS TWO STOPS." : "NOTHING TO WALK HERE.") +
        "</p>" + rows.join("");
    }

    var cutHere = source.filter(function (s) { return CUT[s.ix]; }).length;
    if (cutHere) {
      html += '<p class="dropnote">' + cutHere +
        (cutHere === 1 ? " STOP" : " STOPS") + " REMOVED BY HAND" +
        '<button class="undo" type="button" id="undoCut">RESTORE</button></p>';
    }

    var dropped = source.length - pool.length - cutHere;
    if (dropped) {
      var gone = source.filter(function (s) { return !CUT[s.ix] && !keep(s); });
      html += '<p class="dropnote">' + dropped + " LEFT OUT — " +
        whyDropped(gone) + ". HIDDEN ON THE MAP.</p>";
    }
    if (R && R.pinLost) {
      html += '<p class="dropnote">YOUR CHOSEN START IS NO LONGER IN VIEW — ' +
        "SHOWING THE SHORTEST ORDER INSTEAD.</p>";
    } else if (R && R.pinned && R.extraKm > 0.05) {
      html += '<p class="dropnote">' + R.extraKm.toFixed(1) +
        " KM LONGER THAN THE SHORTEST ORDER.</p>";
    }
    $("rows").innerHTML = html;
  }

  /* Why a set of shops is not on screen. It used to say "NOT JAZZ" for all of
     them, which was true of some and a guess about the rest: 100 of the 346
     list no genre at all, and a filter cannot know what it has not been told.
     Saying so is the difference between a filter and an opinion. */
  function whyDropped(gone) {
    var bits = [];
    if (day !== "") bits.push("LISTED AS CLOSED " + DAY_ABBR[+day]);
    if (genCount()) {
      var blank = untagged(gone);
      bits.push("NOT " + genList().join(" OR ") +
        (blank ? " (" + blank + " OF THEM LIST NO GENRE AT ALL)" : ""));
    }
    return bits.join(", OR ");
  }

  function row(s, n, mins, first, canStart) {
    return '<div class="row' + (first ? " first" : "") + '" data-ix="' + s.ix + '">' +
      '<span class="n">' + n + "</span>" +
      '<button class="nm" type="button">' + esc(s.n) + "</button>" +
      '<div class="act">' +
        (canStart
          ? '<button class="startbtn" type="button" data-start="' + s.ix + '">START HERE</button>'
          : "") +
        '<span class="mins">' + mins + "</span>" +
        '<button class="cut" type="button" data-cut="' + s.ix +
          '" title="Remove from this walk" aria-label="Remove ' + esc(s.n) +
          ' from this walk">✕</button>' +
      "</div></div>";
  }

  function renderControls(R, routable) {
    $("daySel").value = day;
    $("resetStart").hidden = PIN == null;

    /* This button has always done two jobs under one label, and one of them was
       a lie: with a walk locked it frames the WALK, not the country, while still
       reading ALL. So it now says which it is doing.
       The unlocked job — fit everything, and set JUMP TO to ALL JAPAN — is
       precisely the dropdown's own first option, sitting in the header a single
       tap away. On a phone that is a button spending 36px of map to duplicate a
       menu item, so it is marked as a duplicate and the narrow layout drops it.
       The locked job has no other route anywhere, so it always stays. */
    var fit = $("zFit");
    fit.textContent = locked ? "WALK" : "ALL";
    fit.setAttribute("aria-label",
      locked ? "Frame the whole walk" : "Fit every shop");
    fit.classList.toggle("dup", !locked);

    var lock = $("lockBtn");
    lock.hidden = !locked && !routable;
    /* Said as what happens, not as what the flag is called. "UNLOCK" described
       a mechanism, and after picking an area it appeared for a state the reader
       had never asked for; "SHOW ALL HERE" describes where the press lands you. */
    lock.textContent = locked ? "▢ SHOW ALL HERE" : "▣ KEEP THIS WALK";
    lock.classList.toggle("primary", !!locked);

    var link = $("mapsLink"), more = $("mapsMore");
    more.innerHTML = "";
    if (R && R.stops.length > 1) {
      var legs = routeLegs(R.stops);
      link.href = legs[0].url;
      link.textContent = legs.length === 1
        ? "▶ WALK IT IN MAPS"
        : "▶ MAPS " + legs[0].from + "–" + legs[0].to;
      link.setAttribute("aria-label", legs.length === 1
        ? "Open the whole walk in Google Maps"
        : "Open stops " + legs[0].from + " to " + legs[0].to + " in Google Maps");
      link.classList.remove("dead");
      link.removeAttribute("aria-disabled");
      /* The rest of the day, in order. Numbered by the stops they cover rather
         than "part 2 of 4", because the numbers on those buttons are the same
         numbers running down the list beside them. */
      legs.slice(1).forEach(function (g) {
        var a = document.createElement("a");
        a.className = "btn tight";
        a.target = "_blank";
        a.rel = "noopener";
        a.href = g.url;
        a.textContent = g.from + "–" + g.to;
        a.setAttribute("aria-label",
          "Open stops " + g.from + " to " + g.to + " in Google Maps");
        more.appendChild(a);
      });
    } else {
      link.removeAttribute("href");
      link.textContent = "▶ WALK IT IN MAPS";
      link.removeAttribute("aria-label");
      link.classList.add("dead");
      link.setAttribute("aria-disabled", "true");
    }
  }

  /* ============================================================
     shop windows
     ------------------------------------------------------------
     Each stop opens as its own small window, draggable by its title
     bar, stacking in front when you touch it. They live in a fixed
     layer outside the list, so a re-render never disturbs one.
     ============================================================ */
  var WINS = {}, winZ = 30, cascade = 0;

  /* On a phone the same window docks to the bottom edge instead of floating.
     Not a different component — same title bar, same bevel, same plate; it is
     the POSITION that changes, so the 1997 reading survives while the thing
     stops opening under your thumb and stops being draggable off the screen.
     Keyed on the same one-column test the header stats use — see narrow(). */
  function sheetMode() { return narrow(); }
  var SHEET_DISMISS = 90;      /* px of downward drag that means "go away" */

  function front(win) { win.style.zIndex = ++winZ; }

  /* Dock a window to the bottom, or hand it back its floating coordinates.
     Called when one opens and again on every rotation, so a window that was
     open across the change is moved rather than orphaned in the wrong idiom. */
  function dockWindow(win) {
    if (sheetMode()) {
      win.classList.add("sheet");
      /* the inline pair is what CSS would otherwise be fighting */
      win.style.left = "";
      win.style.top = "";
      return;
    }
    win.classList.remove("sheet");
    win.style.transform = "";
    if (win.style.left) return;          /* already has somewhere to be */
    var w = Math.min(340, window.innerWidth - 24);
    var p = clampTo(win, (window.innerWidth - w) / 2 + cascade * 24, 90 + cascade * 24);
    cascade = (cascade + 1) % 6;
    win.style.left = p[0] + "px";
    win.style.top = p[1] + "px";
  }

  /* Rotating a phone, or dragging a desktop window across the breakpoint, moves
     whatever is open into the other idiom rather than leaving it stranded in the
     wrong one. Going narrow, a desk holding three floating windows would dock
     all three to the same edge and hide two of them completely, so only the
     frontmost survives the crossing — the same one-at-a-time rule openShop
     applies, enforced at the moment the rule starts to apply. */
  function syncWindows() {
    var keys = Object.keys(WINS);
    if (!keys.length) return;
    if (sheetMode() && keys.length > 1) {
      keys.sort(function (a, b) { return +WINS[b].style.zIndex - +WINS[a].style.zIndex; });
      keys.slice(1).forEach(function (k) { closeShop(+k); });
      keys = keys.slice(0, 1);
    }
    keys.forEach(function (k) { if (WINS[k]) dockWindow(WINS[k]); });
  }
  /* Hung off the media query AND off the plain resize path further down, because
     the query's own change event turned out not to be dependable on its own —
     shrinking past the breakpoint left three windows sitting at their desktop
     coordinates on a 400px screen, and they only docked when something else
     later forced the issue. syncWindows is idempotent, so being called from
     both is free: dockWindow on a window already in the right idiom re-adds a
     class it has and returns before touching a position it kept. */
  narrowMQ.addEventListener("change", syncWindows);

  function spec(dt, dd, cls) {
    return dd ? "<dt>" + dt + "</dt><dd" + (cls ? ' class="' + cls + '"' : "") +
      ">" + dd + "</dd>" : "";
  }
  function linkBtn(href, label) {
    return '<a class="btn tight" href="' + esc(href) + '" target="_blank" rel="noopener">' +
      label + "</a>";
  }

  function shopBody(s) {
    var shut = closedDays(s);
    /* upper-case the source text BEFORE escaping — the other way round turns
       an "&" in a shop's own wording into "&AMP;" */
    var shutTxt = shut ? shut.map(function (d) { return DAY_ABBR[d]; }).join(" · ")
      : (s.cl ? esc(String(s.cl).toUpperCase()) : "");
    var fams = famsOf(s);

    /* The window is a spec sheet: every line in it carries a label. The
       Japanese name and the prose summary are the two unlabelled strings in
       the record, so neither is shown here. */
    var out = "";

    out += '<dl class="spec">' +
      spec("AREA", esc(s.a) + (s.c !== s.a ? " · " + esc(s.c) : "")) +
      spec("ADDRESS", s.adr ? esc(s.adr) : "—") +
      spec("HOURS", s.h ? esc(s.h) : "NOT LISTED") +
      spec("CLOSED", shutTxt, "shut") +
      spec("GENRE", fams.join(" · ")) +
      spec("STOCK", s.inv ? s.inv.toLocaleString("en-US") + " RECORDS" : "") +
      spec("TEL", s.tel ? esc(s.tel) : "") +
      "</dl>";

    var links = [linkBtn(shopMapUrl(s), "◧ MAPS")];
    if (s.w) links.push(linkBtn(s.w, "WEBSITE"));
    if (s.ig) links.push(linkBtn(s.ig, "INSTAGRAM"));
    if (s.tw) links.push(linkBtn(s.tw, "X"));
    if (s.v) links.push(linkBtn("https://www.youtube.com/watch?v=" + s.v, "▶ EPISODE"));
    out += '<div class="pop-links">' + links.join("") + "</div>";
    return out;
  }

  /* keep the whole title bar visible and a decent grab of the body on screen,
     so a window can never be dragged somewhere you can't get it back from */
  function clampTo(win, x, y) {
    var w = win.offsetWidth;
    return [
      Math.max(60 - w, Math.min(x, window.innerWidth - 60)),
      Math.max(0, Math.min(y, window.innerHeight - 30))
    ];
  }

  /* The same grab, doing the thing the shape calls for. Floating, the bar moves
     the window around the desk. Docked, there is nowhere to move it TO — the
     one place it can go is away, so the identical gesture becomes swipe-down to
     dismiss: it follows your finger, and either clears the threshold and closes
     or falls back into place. */
  function drag(win, bar) {
    var sx = 0, sy = 0, ox = 0, oy = 0, on = false, sheet = false, dy = 0;

    bar.addEventListener("pointerdown", function (e) {
      if (e.target.closest(".pop-close")) return;
      on = true; dy = 0;
      sheet = win.classList.contains("sheet");
      sx = e.clientX; sy = e.clientY;
      if (sheet) {
        win.style.transition = "none";
      } else {
        ox = parseFloat(win.style.left) || 0;
        oy = parseFloat(win.style.top) || 0;
      }
      try { bar.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });

    bar.addEventListener("pointermove", function (e) {
      if (!on) return;
      if (sheet) {
        /* downward only — it is already against the bottom edge, and letting it
           ride upward would just open a gap under it */
        dy = Math.max(0, e.clientY - sy);
        win.style.transform = "translateY(" + dy.toFixed(1) + "px)";
        return;
      }
      var p = clampTo(win, ox + e.clientX - sx, oy + e.clientY - sy);
      win.style.left = p[0] + "px";
      win.style.top = p[1] + "px";
    });

    function stop(e) {
      if (!on) return;
      on = false;
      try { bar.releasePointerCapture(e.pointerId); } catch (err) {}
      if (!sheet) return;
      if (dy > SHEET_DISMISS) { closeShop(+win.getAttribute("data-shop")); return; }
      /* short of the threshold it falls back rather than snapping, so a
         half-committed gesture reads as a thing with weight */
      win.style.transition = REDUCE ? "" : "transform .16s ease-out";
      win.style.transform = "";
    }
    bar.addEventListener("pointerup", stop);
    bar.addEventListener("pointercancel", stop);
  }

  function openShop(ix, e) {
    var s = SHOPS[ix];
    if (!s) return;
    if (WINS[ix]) { front(WINS[ix]); return; }

    /* One at a time when they are sheets. Cascading three 340px windows down a
       402px screen was a pile with three 14px ✕ buttons in it; docked, a second
       sheet would simply sit on top of the first and hide it completely. */
    if (sheetMode()) {
      Object.keys(WINS).forEach(function (k) { closeShop(+k); });
    }

    var win = document.createElement("div");
    win.className = "pop";
    win.setAttribute("data-shop", ix);
    win.innerHTML =
      '<div class="pop-bar">' +
        '<button class="pop-close" type="button" aria-label="Close ' + esc(s.n) + '">✕</button>' +
        '<span class="pop-title">' + esc(s.n) + "</span>" +
      "</div>" +
      '<div class="pop-body">' + shopBody(s) + "</div>";

    /* Floating: open next to the pointer, keyboard activations cascading from
       the middle since they have no coordinates. Docked: the pointer is exactly
       what must NOT decide where it goes — with a finger, "next to the pointer"
       is underneath the hand — so CSS puts it against the bottom edge and no
       coordinates are set at all. */
    if (!sheetMode()) {
      var w = Math.min(340, window.innerWidth - 24);
      var x, y;
      if (e && (e.clientX || e.clientY)) {
        x = e.clientX + 16;
        y = e.clientY - 24;
        if (x + w > window.innerWidth - 8) x = e.clientX - w - 16;
      } else {
        x = (window.innerWidth - w) / 2 + cascade * 24;
        y = 90 + cascade * 24;
        cascade = (cascade + 1) % 6;
      }
      win.style.left = Math.max(8, x) + "px";
      win.style.top = Math.max(8, y) + "px";
    }

    $("wins").appendChild(win);
    if (sheetMode()) {
      dockWindow(win);
    } else {
      var p = clampTo(win, parseFloat(win.style.left), parseFloat(win.style.top));
      win.style.left = p[0] + "px";
      win.style.top = p[1] + "px";
    }

    front(win);
    WINS[ix] = win;

    win.addEventListener("pointerdown", function () { front(win); });
    win.querySelector(".pop-close").addEventListener("click", function () { closeShop(ix); });
    drag(win, win.querySelector(".pop-bar"));
  }

  function closeShop(ix) {
    if (!WINS[ix]) return;
    WINS[ix].remove();
    delete WINS[ix];
  }

  function closeTopWindow() {
    var keys = Object.keys(WINS);
    if (!keys.length) return false;
    keys.sort(function (a, b) { return +WINS[b].style.zIndex - +WINS[a].style.zIndex; });
    closeShop(keys[0]);
    return true;
  }

  /* ---- hover linking: one index, both halves. Pointing at a row lights its
     circle and vice versa, and the circle under the pointer is the only thing
     on the map that ever gets a name. ---- */
  function setHot(ix) {
    hot = ix;
    var sel = document.querySelectorAll(".row[data-ix], .pin[data-ix]");
    Array.prototype.forEach.call(sel, function (n) {
      n.classList.toggle("hot", ix != null && +n.getAttribute("data-ix") === ix);
    });

    /* the one label the map ever shows, read off the rendered circle so it
       can never drift from it */
    var old = document.querySelector(".hoverlab");
    if (old) old.remove();
    if (ix == null) return;
    var dot = document.querySelector('.pin[data-ix="' + ix + '"] .dot');
    if (!dot) return;
    var x = +dot.getAttribute("cx"), y = +dot.getAttribute("cy");
    var right = x < size.w - 140;
    var t = el("text", {
      "class": "hoverlab",
      x: (x + (right ? 13 : -13)).toFixed(1), y: (y + 4).toFixed(1),
      "text-anchor": right ? "start" : "end"
    });
    t.textContent = SHOPS[ix].n;
    $("marks").appendChild(t);
  }

  /* Bring a stop's row where it can be read. Tapping a circle is useless if the
     row it lights is forty rows down — and on the narrow layout, where the list
     runs the length of the page rather than scrolling inside itself, this
     scrolls the page instead, which is the same intent. "nearest" so it moves
     as little as it can and never throws the map off screen. */
  function showRow(ix) {
    var r = document.querySelector('.row[data-ix="' + ix + '"]');
    if (r && r.scrollIntoView) r.scrollIntoView({ block: "nearest" });
  }

  /* ---- moving the view ----
     Zooms and jumps interpolate rather than cut. Without it the dots simply
     reappear somewhere else and you lose which cluster was which; ~180ms is
     enough for the eye to carry one through. Only the map redraws per frame —
     re-solving the route on all eleven would be pointless and slow. */
  var REDUCE = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var anim = null;

  function animateTo(t, ms) {
    if (!t) return;
    if (anim) { cancelAnimationFrame(anim); anim = null; }
    if (REDUCE || !ms) {
      view.lat = t.lat; view.lng = t.lng; view.z = clampZ(t.z);
      render();
      return;
    }
    var fx = mercX(view.lng), fy = mercY(view.lat), fz = view.z;
    var tx = mercX(t.lng), ty = mercY(t.lat), tz = clampZ(t.z);
    var t0 = null;
    function step(now) {
      if (t0 === null) t0 = now;
      var k = Math.min(1, (now - t0) / ms);
      var e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      view.lng = invX(fx + (tx - fx) * e);
      view.lat = invY(fy + (ty - fy) * e);
      view.z = fz + (tz - fz) * e;
      if (k < 1) { drawFrame(); anim = requestAnimationFrame(step); }
      else { anim = null; render(); }
    }
    anim = requestAnimationFrame(step);
  }

  /* the view a zoom about a point would land on, without going there yet */
  function zoomTarget(px, py, dz) {
    var lat = view.lat, lng = view.lng, z = view.z;
    var before = unproject(px, py);
    view.z = clampZ(view.z + dz);
    var after = unproject(px, py);
    var out = {
      lng: invX(mercX(view.lng) + mercX(before.lng) - mercX(after.lng)),
      lat: invY(mercY(view.lat) + mercY(before.lat) - mercY(after.lat)),
      z: view.z
    };
    view.lat = lat; view.lng = lng; view.z = z;
    return out;
  }

  /* ============================================================
     map interaction — drag to pan, wheel or buttons to zoom
     ------------------------------------------------------------
     Panning translates the drawn group rather than redrawing, so it
     stays smooth with a few hundred markers; the view only commits
     and re-renders when the pointer lifts.
     ============================================================ */
  var svg = $("map");

  (function panzoom() {
    var TAP = 6;               /* under this much travel it counts as a tap */
    var on = false, sx = 0, sy = 0, id = null, downEl = null;

    /* ---- pinch ----
       touch-action is none on the map, so the browser will not zoom this for
       us and until now nothing did: a phone had the two buttons and no
       gesture. Every pointer down is tracked, and the moment there are two of
       them the drag is abandoned mid-way and a pinch takes over from where the
       fingers already are — no jump, because the anchor is recomputed at the
       changeover rather than carried over from the drag. */
    /* Counted off the table's keys rather than kept as a running total. A
       counter assumes one pointerdown per pointer and one pointerup to match;
       a repeated down for an id already held would then read as a second
       finger and hand a one-finger drag to the pinch handler. */
    var DOWN = {}, pinch = null;
    function nDown() { var n = 0, k; for (k in DOWN) n++; return n; }

    function localMid() {
      var r = svg.getBoundingClientRect(), xs = [], ys = [], k;
      for (k in DOWN) { xs.push(DOWN[k].x); ys.push(DOWN[k].y); }
      return [(xs[0] + xs[1]) / 2 - r.left, (ys[0] + ys[1]) / 2 - r.top];
    }
    function spread() {
      var xs = [], ys = [], k;
      for (k in DOWN) { xs.push(DOWN[k].x); ys.push(DOWN[k].y); }
      return Math.hypot(xs[0] - xs[1], ys[0] - ys[1]);
    }
    function startPinch() {
      /* the half-finished drag is dropped rather than committed — a pinch is
         not a pan, and translating the group as well would double the motion */
      on = false;
      svg.classList.remove("dragging");
      $("pan").removeAttribute("transform");
      var m = localMid();
      pinch = { d0: Math.max(1, spread()), z0: view.z, anchor: unproject(m[0], m[1]) };
    }
    function movePinch() {
      var d = spread();
      if (d < 1) return;
      var m = localMid();
      view.z = clampZ(pinch.z0 + Math.log(d / pinch.d0) / Math.LN2);
      /* hold the geography that was between the fingers between the fingers */
      var after = unproject(m[0], m[1]);
      view.lng = invX(mercX(view.lng) + mercX(pinch.anchor.lng) - mercX(after.lng));
      view.lat = invY(mercY(view.lat) + mercY(pinch.anchor.lat) - mercY(after.lat));
      placeName = "";
      drawFrame();
    }

    svg.addEventListener("pointerdown", function (e) {
      if (e.button != null && e.button !== 0) return;
      DOWN[e.pointerId] = { x: e.clientX, y: e.clientY };
      if (nDown() >= 2) { if (!pinch) startPinch(); return; }

      on = true; sx = e.clientX; sy = e.clientY; id = e.pointerId;
      /* Captured below, which retargets every later pointer event — and the
         click that follows — to the <svg>. So remember what was actually
         under the pointer now; this is the only moment it is knowable. */
      downEl = e.target;
      try { svg.setPointerCapture(id); } catch (err) {}
    });

    svg.addEventListener("pointermove", function (e) {
      if (DOWN[e.pointerId]) { DOWN[e.pointerId].x = e.clientX; DOWN[e.pointerId].y = e.clientY; }
      if (pinch) { if (nDown() >= 2) movePinch(); return; }
      if (!on) return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) + Math.abs(dy) >= TAP) svg.classList.add("dragging");
      $("pan").setAttribute("transform", "translate(" + dx + "," + dy + ")");
    });

    function forget(e) {
      delete DOWN[e.pointerId];
    }

    function release(e) {
      forget(e);
      if (pinch) {
        /* Lifting one of two fingers ends the zoom rather than dropping back
           into a pan on the finger left behind — that reads as the map lurching
           away under the hand that did not move. */
        if (nDown() < 2) { pinch = null; on = false; render(); }
        return;
      }
      if (!on) return;
      on = false;
      svg.classList.remove("dragging");
      try { svg.releasePointerCapture(id); } catch (err) {}
      $("pan").removeAttribute("transform");

      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) + Math.abs(dy) < TAP) { tap(downEl, e); return; }

      var k = pxPerRad(view.z);
      view.lng = invX(mercX(view.lng) - dx / k);
      view.lat = invY(mercY(view.lat) + dy / k);
      placeName = "";
      render();
    }
    svg.addEventListener("pointerup", release);
    svg.addEventListener("pointercancel", function (e) {
      forget(e);
      if (pinch && nDown() < 2) { pinch = null; render(); }
      on = false;
      svg.classList.remove("dragging");
      $("pan").removeAttribute("transform");
    });

    /* Double-TAP, which is a different event from double-click and does not
       arrive reliably on touch. Two taps inside 300ms and 30px of each other,
       measured here rather than trusted to the browser. */
    var lastTap = { t: -1e9, x: 0, y: 0 };
    function doubleTapped(e) {
      var now = e.timeStamp;
      var near = Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30;
      var soon = now - lastTap.t < 300;
      lastTap = { t: now, x: e.clientX, y: e.clientY };
      if (soon && near) { lastTap.t = -1e9; return true; }
      return false;
    }

    /* A tap on a circle opens that shop — or, on the city layer, flies into
       that city, which is the one place a circle does something else.
       Under a thumb it takes two taps, and the first one is standing in for the
       hover that isn't available: it names the shop, lights its row and brings
       that row into view. Only a second tap on the SAME circle opens it. This
       is how every maps app behaves, and it is the only way a touch user can
       ever read a name off this map without committing to a window. */
    function tap(target, e) {
      if (!target || !target.closest) return;
      var city = target.closest(".citypin[data-city]");
      if (city) { pickCity(city.getAttribute("data-city")); return; }

      var pin = target.closest(".pin[data-ix]");
      if (!pin) {
        /* Bare map. Two quick taps zoom in on the spot, which is the touch
           equivalent of the double-click below; one tap puts the current stop
           back down, the way moving the cursor off a circle does. */
        if (COARSE && doubleTapped(e)) {
          var r = svg.getBoundingClientRect();
          placeName = "";
          animateTo(zoomTarget(e.clientX - r.left, e.clientY - r.top, 2), 220);
          return;
        }
        if (COARSE) setHot(null);
        return;
      }
      var ix = +pin.getAttribute("data-ix");
      if (COARSE && hot !== ix) { setHot(ix); showRow(ix); return; }
      openShop(ix, e);
    }

    /* double-click zooms in where you pointed — the usual way out of a dense
       patch now that nothing merges into a cluster you could click */
    svg.addEventListener("dblclick", function (e) {
      e.preventDefault();
      /* Touch gets its double tap measured in tap() instead — some browsers
         synthesise a dblclick from two taps as well, and handling both would
         zoom four levels for one gesture. */
      if (COARSE) return;
      /* On a city circle the first click already started the flight in; a
         second one must not then zoom two more levels past it. */
      if (e.target.closest && e.target.closest(".citypin[data-city]")) return;
      var r = svg.getBoundingClientRect();
      placeName = "";
      animateTo(zoomTarget(e.clientX - r.left, e.clientY - r.top, 2), 220);
    });

    svg.addEventListener("wheel", function (e) {
      e.preventDefault();
      var r = svg.getBoundingClientRect();
      placeName = "";
      /* short, so rapid ticks chain into one continuous zoom */
      animateTo(zoomTarget(e.clientX - r.left, e.clientY - r.top,
                           e.deltaY < 0 ? 1 : -1), 130);
    }, { passive: false });

    /* Touch browsers synthesise a mouseover from a tap, and it lands BEFORE the
       click. Left unguarded it would set the current stop itself, so the tap
       that followed would find the row already current and open the window —
       stage one of the two-stage tap silently skipped. Hovering is a mouse's
       job only; a thumb goes through tap(). */
    svg.addEventListener("mouseover", function (e) {
      if (COARSE || !e.target.closest) return;
      if (cityMode()) {
        var city = e.target.closest(".citypin[data-city]");
        setHotCity(city ? city.getAttribute("data-city") : null);
        return;
      }
      var pin = e.target.closest(".pin[data-ix]");
      setHot(pin ? +pin.getAttribute("data-ix") : null);
    });
    svg.addEventListener("mouseleave", function () {
      if (COARSE) return;
      if (cityMode()) setHotCity(null); else setHot(null);
    });
  })();

  $("zIn").addEventListener("click", function () {
    placeName = ""; animateTo(zoomTarget(size.w / 2, size.h / 2, 1), 180);
  });
  $("zOut").addEventListener("click", function () {
    placeName = ""; animateTo(zoomTarget(size.w / 2, size.h / 2, -1), 180);
  });
  /* with a walk locked this frames the walk, which is what you actually want
     back after zooming into one leg of it */
  $("zFit").addEventListener("click", function () {
    if (locked) { animateTo(fitTarget(locked, 60), 260); return; }
    placeName = "ALL JAPAN";
    wantAreas = false;
    $("walkSel").value = "all";
    animateTo(fitTarget(PLACED, 40), 260);
  });

  /* Hand the whole window to the map, and back. The svg is measured from the
     box it is drawn in, so the box has to change first — getBoundingClientRect
     inside measure() forces the layout to settle, which is why this can read
     the new size in the same turn rather than waiting a frame for it. */
  $("mapFull").addEventListener("click", function () {
    var body = document.querySelector(".body");
    var full = body.classList.toggle("mapfull");
    var b = $("mapFull");
    b.textContent = full ? "SPLIT" : "FULL";
    b.setAttribute("aria-label", full ? "Show the list again" : "Expand the map");
    measure();
    render();
  });

  $("lockBtn").addEventListener("click", function () {
    if (locked) { locked = null; lockedName = ""; }
    else if (lastRoute && lastRoute.stops.length > 1) {
      /* freeze the route exactly as shown, so clearing a filter later restores
         these stops rather than whatever happens to be on screen by then */
      locked = lastRoute.stops.slice();
      lockedName = breadcrumb(locked);
    }
    render();
  });

  /* ============================================================
     wiring
     ============================================================ */
  /* JUMP TO is navigation, not a filter: it flies the map somewhere. The
     route is always whatever ends up on screen.
     It lists AREAS, which is what the drill-down list beneath it lists. It used
     to list WALKS — shops chained within 500m of each other — named after the
     ward they sit in, and the two disagreed on sixteen of twenty-one names
     because they are different groupings of the same shops. "Shibuya (19)" in
     here beside "SHIBUYA 33 SHOPS" below was the visible half of that; Jinbocho
     was worse, reading 17 here and 12 there, because a 500m cluster around
     Jinbocho reaches into Ochanomizu.
     Wards win the job because a menu has to be able to reach everything, and
     they do: every shop is in exactly one. Clusters cover 71% at best — even
     taking all 346 shops and chaining at 500m, 102 of them sit alone. The
     clusters were the better WALK and the worse INDEX, and this is an index. */
  (function buildJump() {
    var html = '<option value="all">ALL JAPAN (' + PLACED.length + ")</option>";
    CITIES.forEach(function (c) {
      html += '<optgroup label="' + esc(c.c.toUpperCase()) + '">' +
        '<option value="city:' + esc(c.c) + '">ALL ' + esc(c.c.toUpperCase()) +
        " (" + c.shops.length + ")</option>";
      AREAS.filter(function (a) { return a.c === c.c; }).forEach(function (a) {
        html += '<option value="area:' + esc(a.key) + '">' + esc(a.a.toUpperCase()) +
          " (" + a.shops.length + ")</option>";
      });
      html += "</optgroup>";
    });
    $("walkSel").innerHTML = html;
  })();

  function jump(val) {
    var t = null;
    if (val === "all") {
      t = fitTarget(PLACED, 40);
      placeName = "ALL JAPAN";
      wantAreas = false;          /* the country layer answers this one */
    } else if (val.indexOf("city:") === 0) {
      var c = val.slice(5);
      wantAreas = true;           /* a city means its districts, at any size */
      t = fitTarget(PLACED.filter(function (s) { return s.c === c; }), 40);
      /* Guarantees the flight lands clear of the city layer however narrow the
         card is. Every real city fits at 10.5 or tighter, so this never fires
         on the current data — but without it a city whose shops were spread
         wide enough could frame below CITY_Z, and clicking a circle would put
         you back in front of the same circle. */
      if (t && t.z < CITY_Z) t.z = CITY_Z;
      placeName = c.toUpperCase();
    } else if (val.indexOf("area:") === 0) {
      /* Straight to pickArea, so choosing Shibuya from the menu and tapping
         Shibuya in the list are the same act with the same result — including
         the walk being pinned to it. */
      pickArea(val.slice(5));
      return;
    }
    PIN = null;
    hot = null;
    hotCity = null;
    CUT = {};          /* a new place is a fresh walk */
    /* And a fresh walk cannot be the old one held in place. Picking a
       destination is as plain a "take me somewhere else" as this page has; left
       locked, every entry in the menu flew the map somewhere new while the
       header, the list and the route all went on describing the walk you left,
       and the country view could not be reached at all. */
    locked = null;
    lockedName = "";
    animateTo(t, 300);
  }

  /* Clicking a city — circle or row — is the same act as choosing ALL <CITY>
     from JUMP TO, so it goes through the same door and drags the select along
     with it rather than leaving it pointing somewhere you have left. */
  function pickCity(c) {
    $("walkSel").value = "city:" + c;
    jump("city:" + c);
  }

  /* Picking a neighbourhood LOCKS the walk to it, and that is the part that
     makes the drill terminate. Framing Shibuya at a readable zoom also puts a
     good deal of Shinjuku on screen — over the routing limit again, which
     would bounce straight back to this layer and stay there. Locking says the
     walk is these shops, whatever else the frame happens to catch; the rest
     stay drawn but dimmed, which is exactly what lock is for and what its own
     comment says it is for. Unlock and you are back to live. */
  function pickArea(key) {
    var a = AREA_BY_KEY[key];
    if (!a) return;
    $("walkSel").value = "area:" + key;
    wantAreas = false;            /* a district was chosen; this is a walk now */
    locked = a.shops.slice();
    lockedName = a.a.toUpperCase();
    PIN = null;
    hot = null;
    hotArea = null;
    CUT = {};
    animateTo(fitTarget(a.shops, 60), 300);
  }

  $("walkSel").addEventListener("change", function (e) { jump(e.target.value); });
  $("daySel").addEventListener("change", function (e) { day = e.target.value; render(); });
  $("resetStart").addEventListener("click", function () { PIN = null; render(); });

  $("genreBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    menuOpen = !menuOpen;
    $("genrePanel").hidden = !menuOpen;
    $("genreBtn").setAttribute("aria-expanded", String(menuOpen));
    placeMenu();
  });

  $("genrePanel").addEventListener("click", function (e) {
    /* render() below replaces this panel's contents, detaching the button that
       was clicked. Without stopping here, the document handler would then find
       no .gwrap ancestor on a node with no parent, and shut the menu. */
    e.stopPropagation();
    var btn = e.target.closest("button[data-g]");
    if (!btn) return;
    var g = btn.dataset.g;
    if (g === "*") GENS = {};
    else if (GENS[g]) delete GENS[g];
    else GENS[g] = 1;
    render();               /* stays open: picking two genres is one gesture */
  });

  /* Keep the panel on screen whichever end of the picker row its button has
     drifted to. It used to be pinned to the button's RIGHT edge, which was
     correct while GENRE sat at the end of the row and became wrong the moment
     it was moved to the front: the panel then hung 67px off the left of a
     phone, with a third of the genres unreachable. An anchor is a guess about
     where the button is; this measures instead, so reordering the row cannot
     break it a second time. */
  function placeMenu() {
    var p = $("genrePanel");
    if (p.hidden) return;
    p.style.left = "0px";
    p.style.right = "auto";
    var pad = 8, vw = document.documentElement.clientWidth;
    var r = p.getBoundingClientRect();
    var shift = 0;
    if (r.right > vw - pad) shift = (vw - pad) - r.right;   /* pull it left */
    if (r.left + shift < pad) shift = pad - r.left;         /* but not off the other side */
    p.style.left = shift.toFixed(1) + "px";
  }

  function closeMenu() {
    if (!menuOpen) return false;
    menuOpen = false;
    $("genrePanel").hidden = true;
    $("genreBtn").setAttribute("aria-expanded", "false");
    return true;
  }

  /* click anywhere else and the menu closes */
  document.addEventListener("click", function (e) {
    if (menuOpen && !e.target.closest(".gwrap")) closeMenu();
  });

  /* one Escape handler for the whole page: the menu first, then windows */
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (closeMenu()) return;
    closeTopWindow();
  });

  $("rows").addEventListener("click", function (e) {
    var cr = e.target.closest(".crow[data-city]");
    if (cr) { pickCity(cr.getAttribute("data-city")); return; }
    var ar = e.target.closest(".crow[data-area]");
    if (ar) { pickArea(ar.getAttribute("data-area")); return; }

    var cb = e.target.closest("button[data-cut]");
    if (cb) {
      var cix = +cb.dataset.cut;
      CUT[cix] = 1;
      if (PIN === cix) PIN = null;   /* the start cannot be a stop you removed */
      /* The removal used to be taken out of the locked list as well, on the
         grounds that unlocking would otherwise bring the stop back. It would
         not: keep() excludes anything in CUT whether the walk is locked or not,
         so the stop stays gone either way — and shrinking the list had a cost.
         Cut every stop of a locked walk and the list became empty, which made
         the count of cuts-within-it zero, which took away the RESTORE button.
         An empty walk you could not undo. */
      render();
      return;
    }
    if (e.target.closest("#undoCut")) { CUT = {}; render(); return; }

    var sb = e.target.closest("button[data-start]");
    if (sb) {
      var ix = +sb.dataset.start;
      PIN = PIN === ix ? null : ix;    /* clicking the current start unpins */
      render();
      return;
    }
    var r = e.target.closest(".row");
    if (!r) return;
    var rix = +r.getAttribute("data-ix");
    /* Symmetrical with the map: on touch the first tap makes this the current
       stop — which lights its circle and is what brings START HERE and ✕ out
       from under the hover they used to need — and the second one opens it.
       The name itself is a real button, so a thumb that wants the window
       immediately can go straight for the name and skip the first tap. */
    if (COARSE && hot !== rix && !e.target.closest(".nm")) {
      setHot(rix);
      return;
    }
    openShop(rix, e);
  });
  $("rows").addEventListener("mouseover", function (e) {
    if (COARSE) return;        /* see the note on the map's mouseover */
    if (cityMode()) {
      var cr = e.target.closest(".crow[data-city]");
      setHotCity(cr ? cr.getAttribute("data-city") : null);
      return;
    }
    if (q_areaRows()) {
      var ar = e.target.closest(".crow[data-area]");
      setHotArea(ar ? ar.getAttribute("data-area") : null);
      return;
    }
    var r = e.target.closest(".row[data-ix]");
    setHot(r ? +r.getAttribute("data-ix") : null);
  });
  $("rows").addEventListener("mouseleave", function () {
    if (COARSE) return;
    if (cityMode()) setHotCity(null);
    else if (q_areaRows()) setHotArea(null);
    else setHot(null);
  });
  /* the area list is on screen exactly when there are area rows in it */
  function q_areaRows() { return !!document.querySelector(".crow[data-area]"); }
  /* the rows are buttons, so tabbing the list lights its circle too */
  $("rows").addEventListener("focusin", function (e) {
    var cr = e.target.closest(".crow[data-city]");
    if (cr) { setHotCity(cr.getAttribute("data-city")); return; }
    var ar = e.target.closest(".crow[data-area]");
    if (ar) setHotArea(ar.getAttribute("data-area"));
  });

  /* ---- menu bar clock ---- */
  function tick() {
    var d = new Date();
    $("clock").textContent =
      String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  tick();
  setInterval(tick, 1000);

  /* ---- minimise ----
     The window folds away and the desk is left holding one icon. The shop
     windows go with it: they belong to the application and not to the
     desktop, and leaving them floating over an empty field would claim the
     thing was still open when it isn't. They are not closed, only put out of
     sight, so they come back exactly where they were left. */
  var deskEl = document.querySelector(".desk");
  var winEl = document.querySelector(".win");
  var winsEl = $("wins");
  var deskIcon = $("deskIcon");
  var minBtn = $("minBtn");
  var foldTimer = 0;

  function minimise() {
    if (winEl.hidden || winEl.classList.contains("folding")) return;
    closeMenu();          /* a menu left open would come back open over nothing */
    clearTimeout(foldTimer);
    winEl.classList.remove("unfolding");
    winEl.classList.add("folding");
    foldTimer = setTimeout(function () {
      winEl.classList.remove("folding");
      winEl.hidden = true;
      winsEl.hidden = true;
      deskEl.classList.add("bare");
      deskIcon.hidden = false;
      deskIcon.focus();
    }, REDUCE ? 0 : 130);
  }

  function restore() {
    clearTimeout(foldTimer);
    deskIcon.hidden = true;
    deskEl.classList.remove("bare");
    winEl.hidden = false;
    winsEl.hidden = false;
    winEl.classList.remove("folding");
    if (!REDUCE) {
      winEl.classList.add("unfolding");
      foldTimer = setTimeout(function () {
        winEl.classList.remove("unfolding");
      }, 160);
    }
    minBtn.focus();
    /* The map sizes itself from the box it is drawn in, and for as long as it
       was away it had no box at all. The ResizeObserver below catches this on
       its own, but a frame later than the paint that put the window back. */
    requestAnimationFrame(function () { if (measure()) render(); });
  }

  minBtn.addEventListener("click", minimise);
  deskIcon.addEventListener("click", restore);

  /* ---- boot ----
     The SVG is measured rather than given a fixed viewBox, so every unit on
     the map is one CSS pixel and nothing has to be scaled by hand. */
  function measure() {
    var r = svg.getBoundingClientRect();
    if (!r.width || !r.height) return false;
    var changed = Math.abs(r.width - size.w) > 0.5 || Math.abs(r.height - size.h) > 0.5;
    size.w = r.width; size.h = r.height;
    return changed;
  }

  /* Coalesced. The map's track animates open over 300ms, which fires the
     observer on almost every frame of it — and a render re-solves the route,
     so a 40-stop walk would be solved seventeen times to draw one transition.
     The trailing edge is the only one that matters: the size it settles at. */
  var reflowT = 0;
  function reflow() {
    clearTimeout(reflowT);
    reflowT = setTimeout(function () {
      if (measure()) render();
      syncWindows();
    }, 90);
  }
  if (window.ResizeObserver) new ResizeObserver(reflow).observe(svg);
  window.addEventListener("resize", reflow);

  measure();
  /* open on the biggest Tokyo cluster: something routable on the first screen,
     with the whole country one click away in JUMP TO */
  /* Opens on Tokyo whole, which puts the district list on screen before any
     choice has been made: SHIBUYA 33 · SHINJUKU 32 · SHIMOKITAZAWA 18, 900M
     ACROSS … It used to open inside one particular walk, which is a fine screen
     only if you already know the city well enough to have wanted that walk. A
     first-time visitor knows the word Tokyo and nothing below it, so the first
     screen is now the one that answers "where are the records", and every ward
     name on it is something the guide is telling them rather than something it
     is asking them for. */
  var t0 = fitTarget(PLACED.filter(function (s) { return s.c === "Tokyo"; }), 40);
  if (t0) {
    view.lat = t0.lat; view.lng = t0.lng;
    /* clear of the country layer, so this lands on districts and not on cities */
    view.z = clampZ(Math.max(t0.z, CITY_Z));
  }
  placeName = "TOKYO";
  wantAreas = true;               /* same as choosing ALL TOKYO from the menu */
  $("walkSel").value = "city:Tokyo";
  render();
  requestAnimationFrame(function () { if (measure()) render(); });
})();
</script>

</body></html>
