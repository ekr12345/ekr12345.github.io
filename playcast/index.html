<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<title>PlayCast 98 — Record Walk</title>

<style>
/* ============================================================

   https://www.fontspace.com/emotion-engine-font-f18002
   ------------------------------------------------------------

   download. So what sits here is not the font: it is an 11-glyph
   subset cut to exactly the characters in "PlayCast 98" — 23 KB
   of TTF down to 1000 bytes of woff2 — inlined because the
   artifact CSP blocks every font host.
   CHANGING THE WORDMARK MEANS RECUTTING THE SUBSET: any letter
   outside "PlayCast 98" is not in this file and will fall through
   to Century Gothic.
   ============================================================ */
@font-face {
  font-family:"Emotion Engine";

  src:url(data:font/woff2;base64,d09GMgABAAAAAAPoAA0AAAAABpwAAAOWAAEZmgAAAAAAAAAAAAAAAAAAAAAAAAAAGxAcGgZgAGwRCAqFcIRyATYCJAMsCxgABCAFgXAHIBslBSA+DHCH+QouHlhWRBTc0ybvrEvfP80u0+UIKFt+5Hie/6vdN9O+2mpl0Mkx4/Go44GX9uGBH0e+fzSrtO0MhrI5wo1Il0bywHO5f2M2fHibYIqPBbI5DqR3YFGiUaCJpbIDH9Dxfj1f9HiLEzg8KEmLIcpsNx7pcAMcUF0XJhh/H6aU6vyvWw+Xd73Gy7AJ9I+3Sx1A6XGBhlG3XXpooOGlwytIOMUIkpAziKoRHA/1wwmjPCzlToxfbQRL5/+aetF2YBVEJ34i945yVbajVdCsnu/53gyqQT4uQSY4G023Ieqr/0VEas4D/KrAgBIVgDxGhx6xy6mvRA6AVnTMRdLkklURpKPurT8KJYCKtGWO297TEmMFMdMibf9G7nUe5QsCWu12LDiQhArIsCJJeI+UNLCgRpIEM/4iiSOHcupp+S8O/NxI3S+6spap1K5tGglsyF8hZii2MfQfZAIyLcyoif7HporJRUvLSMpsptg2ep/uw7p2BNGzCqccxeLRh1rN1nRjg1KFovLYnNesZa1In6Jdoe30nVQRBxGEtC7AU4DDD1oo3TelJytUzJSQZk/1oNpI3aYk2+5zj5JQPEIqrqokp9CmGsu0NTtUT1Y6nTT8rICkUK5Nu6Nib/tacB5WyX542lm9jav+4O2ikH6RIimjD4VsqkRkCZi+pil4qyKa0kd9uTmO+DR/RU6uI00X8+JzyNxhc6Sh/PGWOf3f3nmtVlYcRTlbT7Zu2+475v7LcuVOv8Kzuk/kvIVyponRN59FhiPNZh3355LliE9X2VD2GMt5xSMnRbWSB8vmKD+i9/R2SZWMeIfghSN5jieuGc/qhOWnqqLGX31CHyAr1+ma8rdf+1BbJ8Dweb1DM9z1iv21tYq92iZGxT1oZGXbd/OkQSvt8WcRKfpQwH+sD3g+ncuK/brQ9+SBtiA7y35YGDWi7VGcxQ1HfK5lLyFbmR8WVkf5IQYPl/BGdI49TYOJN9SXPcrrxc1Ee7b69zJsMlXr/Sn4dgsIpPWcuHJ1f6nqLx/KAV5NO9Xr/f/f/MP2nR9ChgAc6Hz/IyVyK4AqfvKPvX6Y1kL9Q/2+v8GJ8HnoJJtsk6psvqk+d4+AoVPImNfaIpAkYnkEI5AsQY6RLCkMK1mKjXxP5mDZKKKpoIp6ShS+EjPRbBElpQIixvzl5IclzNpwgBQKqKWuldy5bNNwSzEu45V0zkhaVkWLAAAAAA==) format("woff2");

/* ============================================================
   PLAYCAST 98 — retro-desktop tokens, per the Record Walk handoff
   (shipped as JOKYO 97; renamed, and the spine now carries the mark)
   ------------------------------------------------------------
   One visual world on purpose: a 1997 cobalt desktop. No dark
   variant — the palette IS the design, so it does not invert.
   ============================================================ */
:root {
  color-scheme: light;

  /* Pulled off a Nokia 3310 ad: an electric cobalt field, the packaging's
     cool white, and the blue-black of the photograph's shadows. The blue
     does double duty — it is the ground outside the window and the ink
     inside it, which is the same inversion the box art runs on. */
  --desk:#2B37C9;      /* the cobalt field */
  /* The ad's backdrop is not one blue — it is a lit studio wall: hot near the
     top where the light hits, indigo where it wraps, and blue-black in the
     corners. These three take the field from flat paint to that wall. */
  --desk-lit:#3D4BE8;     /* the hot centre */
  --desk-violet:var(--pool-violet); /* the indigo it turns toward, low right */
  --desk-deep:#0E1342;    /* the blue-black falloff at the edges */
  /* Held as a translucent ink rather than a fixed blue so the grid darkens
     the field by the same amount everywhere. A solid #2430A6 read as a
     shadow on the lit centre but as a highlight down in the corners, which
     made the ruling swim. Over the lit field it mixes to very near the
     colour it always was. */
  --grid:rgba(9,13,45,.28);  /* 8px desktop grid */
  --panel:#EEF0FA;     /* window and menu plates */
  --panel2:#DCE1F2;    /* filter bar, list header */
  --field:#FBFCFF;     /* inputs, inactive chips, map card, unfilled markers */
  --ink:#0D1233;       /* text and every structural border — blue-black */
  --ink2:#505B87;      /* secondary text — dark enough for 10px on panel2 */
  --accent:#2B37C9;    /* route, filled markers, active state */
  --warn:#A93154;      /* closures and destructive actions only */
  --on-dark:var(--pool-pink); /* secondary text inside an inverted row */
  --soft:#ECC9E4;      /* START HERE, chip hover — the pink mixed to the exact
                          weight the cobalt-lilac had, so hover keeps its
                          former strength against the plates rather than
                          fading into them */
  --hair:#C6CCE2;      /* row separators, map card inner shadow */

  /* Poolside FM's duotone, worked in where a second hue earns its place: the
     sun going down behind the wallpaper, the logo block, the row under the
     pointer, and everything you touch. Deliberately kept off the map card —
     hot pink on near-white paper is 1.78:1, which would lose a 2px route
     line altogether, so the map stays cobalt. */
  --pool-violet:#4318C9;  /* the deep violet */
  --pool-pink:#F7A8D4;    /* the hot pink */
  --pool-pale:#FDE7F0;    /* the pale pink it prints on */

  /* The map is a printed sheet rather than a screen: violet ink on the pink
     stock. Everything that has to vanish into the sheet — the casing under
     the route, an unfilled marker, the halo behind a hover label — keys off
     --paper, so a flat ground is required and they all match exactly. */
  --paper:var(--pool-pale);  /* the map ground */
  --paper-line:#E7BFD4;      /* graticule, and the card's inner shadow */

  /* Three faces, three jobs. Nothing can be fetched — the artifact CSP
     blocks font CDNs — so each is named first for anyone who has it and then
     falls to something installed everywhere.

     --display  headings, plates and every button: Nokia Sans, the face off
                the 3310 packaging. It falls to Trebuchet MS, the nearest
                humanist sans that ships on both platforms and, being a 1996
                Microsoft screen face, exactly the right vintage for this
                desktop.
     --text     shop names, addresses, hours: Tahoma, then Verdana — Carter's
                mid-90s screen sans. A complement rather than a second voice:
                same era, plainer, drawn to hold together at the 9–11px this
                page runs most of its labels at.
     --mono     figures only, where columns have to line up: the walk order,
                the times, the map's scale and grid labels. */
  --display:"Nokia Sans","Nokia Pure Text","Trebuchet MS","Segoe UI","Lucida Grande",system-ui,sans-serif;
  --text:Tahoma,Verdana,"DejaVu Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,"Liberation Mono",monospace;

  --bevel:inset -1.5px -1.5px 0 #C3C9E2, inset 1.5px 1.5px 0 #FFFFFF;
  --bevel-soft:inset -1.5px -1.5px 0 #A9B4E8, inset 1.5px 1.5px 0 #FFFFFF;
  --bevel-key:inset -2px -2px 0 #1C25A4, inset 2px 2px 0 #6E79E6;
  --bevel-field:inset -2px -2px 0 #C3C9E2, inset 2px 2px 0 #FFFFFF;
  --edge:1.5px solid var(--ink);
  --max:1200px;
  --spine-w:62px;      /* the case spine down the left edge — sized to the
                          wordmark, which sets across the band, not along it */

  /* A scale, so the corners read as one moulded family rather than a blanket
     8px. Big on the shell, tighter as parts get smaller — which is how an
     injection-moulded object actually works. */
  --r-shell:18px;      /* the window and the shop windows */
  --r-panel:10px;      /* map card, menus, recessed areas */
  --r-ctl:7px;         /* selects, buttons */
  --r-tag:999px;       /* chips and the logo block — full pills */
}

* { box-sizing:border-box; }
html, body { margin:0; padding:0; background:var(--desk); height:100%; overflow:hidden; }

/* The whole thing is one screen. Nothing here scrolls the page: the window
   fills the height that's left and the shop list scrolls inside itself. */
/* Six layers, front to back: the two ruling lines, a hot pool of light up
   behind the title bar, a pink bloom coming in low from the left, the violet
   the wall turns to on the right, and the vertical falloff underneath it
   all. Both bottom sources have their origins off-canvas so only the tails
   reach the field — a sunset behind the desktop, not a spotlight on it. The
   window is lightest where the ground is darkest, which is the whole trick
   of the box art. */
.desk {
  height:100vh; height:100dvh; overflow:hidden; background-color:var(--desk);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    radial-gradient(130% 85% at 50% -12%, var(--desk-lit) 0%, transparent 62%),
    radial-gradient(62% 40% at 4% 112%, var(--pool-pink) 0%, transparent 54%),
    radial-gradient(85% 65% at 88% 112%, var(--desk-violet) 0%, transparent 58%),
    linear-gradient(178deg, var(--desk) 0%, var(--desk) 34%, var(--desk-deep) 100%);
  background-size:8px 8px, 8px 8px, auto, auto, auto, auto;
  background-repeat:repeat, repeat, no-repeat, no-repeat, no-repeat, no-repeat;
  color:var(--ink); font-family:var(--text); font-size:13px; line-height:1.45;
  padding:0 0 12px var(--spine-w); display:flex; flex-direction:column; align-items:center;
  -webkit-font-smoothing:antialiased;
}
.desk ::selection { background:var(--accent); color:#FFFFFF; }
.desk a { color:var(--ink); text-decoration:none; }
.desk a:hover { color:var(--accent); }
.desk :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.desk [hidden] { display:none !important; }
.desk button, .desk select, .desk input { font:inherit; }

/* ---------------- scrollbars ----------------
   Three things scroll — the shop list, a shop window's body and the genre
   menu — and the browser was drawing every one of them in its own style,
   which left the only piece of chrome on the page that wasn't ours. Same
   plates, same 1.5px ink borders, same bevel as the window itself. The end
   caps reuse the two-gradient caret the selects already draw, so there is
   one arrow shape in the design rather than two, and they are round like the
   map's zoom buttons, which are the other small circular controls here.
   Firefox can't put a border on a thumb, so a pale one would vanish; it gets
   the ink-family pair instead — the same palette, as near as that engine
   allows. */
html { scrollbar-color:var(--ink2) var(--panel2); }

/* the universal selector at the top of this sheet does not reach scrollbar
   pseudo-elements, so their borders would otherwise be added to the height */
::-webkit-scrollbar-thumb, ::-webkit-scrollbar-button { box-sizing:border-box; }

::-webkit-scrollbar { width:14px; height:14px; }
::-webkit-scrollbar-track { background:var(--panel2); }
::-webkit-scrollbar-track:vertical { border-left:var(--edge); }
::-webkit-scrollbar-corner { background:var(--panel2); }

::-webkit-scrollbar-thumb {
  background:var(--panel); border:var(--edge); border-radius:var(--r-tag);
  box-shadow:var(--bevel);
}
::-webkit-scrollbar-thumb:hover { background:var(--soft); }

::-webkit-scrollbar-button {
  display:block; height:14px; background-color:var(--panel);
  border:var(--edge); border-radius:50%; box-shadow:var(--bevel);
  background-repeat:no-repeat; background-size:4px 4px, 4px 4px;
  background-position:calc(50% - 2px) center, calc(50% + 2px) center;
}
::-webkit-scrollbar-button:hover { background-color:var(--soft); }
/* pressed — the bevel flips, the way a moulded button on this desktop would */
::-webkit-scrollbar-button:active {
  box-shadow:inset 1.5px 1.5px 0 #C3C9E2, inset -1.5px -1.5px 0 #FFFFFF;
}
::-webkit-scrollbar-button:vertical:decrement {
  background-image:linear-gradient(135deg,transparent 50%,var(--ink) 50%),
                   linear-gradient(45deg,var(--ink) 50%,transparent 50%);
}
::-webkit-scrollbar-button:vertical:increment {
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),
                   linear-gradient(135deg,var(--ink) 50%,transparent 50%);
}
/* one cap at each end — Chrome offers four slots and only two are wanted */
::-webkit-scrollbar-button:vertical:start:increment,
::-webkit-scrollbar-button:vertical:end:decrement,
::-webkit-scrollbar-button:horizontal { display:none; }


/* ---------------- 0. the spine ----------------
   A jewel-case spine down the left edge, the way a PS1 case carries its
   wordmark: a flat black band, the name set large and reading bottom to top,
   and the artwork butted straight up against it with no rule between.
   Fixed rather than a flex child, so it holds the full height whatever the
   window does, and the desk carries a matching left pad so nothing ever runs
   underneath it. vertical-rl turned 180° is what gets the text reading
   upward — sideways-lr says it more plainly but Safari does not take it. */
/* Not a slab of ink laid over the wallpaper — a smoked pane of it. Flat
   --ink was the wrong relationship twice over: hard against a graduated
   field up top, and near-invisible at the foot, where the desk's own falloff
   (#0E1342) is within a hair of the ink (#0D1233). Being translucent, the
   band is now a constant amount darker than whatever is behind it, so the
   8px ruling and the sunset both carry through it, and it thins toward the
   bottom to let the pink bloom rise into its foot. The hairline is what
   guarantees an edge down at the dark end, where tone alone stops working. */
.spine {
  position:fixed; left:0; top:0; bottom:0; width:var(--spine-w); z-index:6;
  background:linear-gradient(180deg,
    rgba(13,18,51,.94) 0%,
    rgba(13,18,51,.89) 52%,
    rgba(13,18,51,.60) 100%);
  border-right:1.5px solid rgba(253,231,240,.16);
  display:flex; align-items:center; justify-content:center;
  pointer-events:none;
}
/* Emotion Engine is embedded above as a subset, so this one actually ships
   rather than hoping the reader has it — it is the only face on the page
   that does. The rest of the stack is the fallback if the data URI is ever
   dropped: the closest geometric sans on each platform.
   line-height:1 matters: in vertical-rl the line box is the band's WIDTH, so
   the default 1.45 would have demanded a spine half again as wide. */
.spine span {
  writing-mode:vertical-rl; transform:rotate(180deg);
  font-family:"Emotion Engine","Century Gothic",Futura,"URW Gothic",var(--display);
  font-weight:700; line-height:1;
  font-size:clamp(26px, 4.3vh, 40px); letter-spacing:.06em;
  color:var(--panel); white-space:nowrap;
}

/* ---------------- 1. menu bar ---------------- */
/* The 盤 chip and the plate it sat in are gone; the clock is the only thing
   left up here, so it keeps the right edge it always had rather than sliding
   left into the space. The name now lives on the spine. */
.menubar {
  flex:none; width:100%; display:flex; justify-content:flex-end;
  align-items:stretch; position:sticky; top:0; z-index:5;
}
.plate {
  background:var(--panel); border:var(--edge);
  padding:8px 16px; font-family:var(--display); font-weight:700;
  font-size:11px; letter-spacing:.04em; display:flex; align-items:center; gap:8px;
}
.plate.clock { border-top:0; border-right:0; border-radius:0 0 0 var(--r-panel); }
/* the plate is set in the display face, but a ticking clock in a proportional
   one shifts width every time a 1 comes round, so the digits stay mono */
#clock { font-family:var(--mono); font-variant-numeric:tabular-nums; }
.tick { color:var(--accent); }

/* ---------------- 2. application window ---------------- */
/* The window floats rather than filling the screen. It still grows to take
   the room going — flex:1 — but max-height stops it short of the viewport,
   and the leftover is then handed to the auto block margins, which split it
   evenly above and below. That is what centres it: not justify-content on
   the desk, which would drag the menu bar down off the top edge with it.
   The 132px is the menu plate plus a band of desk at each end. */
.win {
  width:100%; max-width:var(--max);
  background:var(--panel); border:var(--edge); border-radius:var(--r-shell);
  box-shadow:0 2px 0 rgba(9,13,45,.18), 0 20px 38px -18px rgba(9,13,45,.5);
  flex:1; min-height:0; max-height:calc(100dvh - 132px); margin-block:auto;
  display:flex; flex-direction:column;
  transition:max-width .3s cubic-bezier(.22,.61,.36,1);
}

/* The title bar has been removed. It held a close/maximise/minimise cluster
   that did nothing and the words JOKYO 97, and once both were gone it was an
   empty band. The window now opens straight onto the place name and stats,
   which is the first thing in it that is actually true. The shop windows
   keep their own bars — those have a working ✕ and are what you drag. */

/* 2a. minimise. One button out of that old cluster has come back, on the
   condition the others could not meet: it does something. It has not brought
   the title bar with it — it sits at the right-hand end of the picker row,
   which is the window's top-right corner and where this desktop would have
   put it anyway. The hairline in front of it says it acts on the window and
   not on the walk, so it does not read as a fourth filter. */
.pickers .sep { flex:none; width:1.5px; height:17px; background:var(--hair); margin:0 3px; }
/* An ✕, set in the text face — and deliberately the SAME ✕ a shop window closes
   with, so there is one of them in the design rather than two shapes meaning the
   same thing. It replaces a 1.5px rule that was drawn rather than typed, on the
   grounds that ▁ and _ sit at different heights in every face in the stack;
   that argument does not carry over, because ✕ is centred in its em box and
   lands in the same place whichever fallback renders it. */
/* Scoped through .desk on purpose. There is a `.desk button { font:inherit }`
   near the top of this sheet, and at 0,1,1 it outranks a bare .minbtn at 0,1,0 —
   so a font-size set here was silently losing to the inherited 13px however far
   down the sheet it sat. Order does not settle that; specificity does. */
/* No plate, no bevel, no border — just the mark, exactly as a shop window's ✕
   is drawn. That is the same treatment as well as the same glyph, so the two
   read as one control appearing in two places rather than a bevelled key here
   and a bare mark there.
   The box stays as a hit area although nothing is drawn around it: 22px under a
   cursor, 34px under a thumb. And a point of size comes back, because the plate
   was carrying some of the weight and without it the glyph has to hold its own. */
.desk .minbtn {
  flex:none; width:22px; height:22px; padding:0; cursor:pointer;
  border:0; border-radius:0; background:none; box-shadow:none;
  display:grid; place-items:center;
  font-family:var(--text); font-size:13px; line-height:1; color:var(--ink);
}
/* With no ground to tint, the mark itself answers — the warn red, which is what
   a shop window's ✕ does on hover and the only other place this page uses it. */
.desk .minbtn:hover, .desk .minbtn:active { background:none; color:var(--warn); }

/* Putting it away folds it toward its own top-left corner, which is where
   the icon is waiting — so the two read as one object being set down rather
   than two being swapped. 130ms: long enough to carry the direction, short
   enough that it never stands between you and the map. Reduced motion
   flattens it through the block at the foot of this sheet, and the script
   drops its wait to zero to match. */
/* z-index only so the window covers the desktop icons behind it */
.win { transform-origin:0 0; position:relative; z-index:3; }
.win.folding {
  transform:scale(.86); opacity:0;
  transition:transform .13s ease-in, opacity .13s ease-in;
}
.win.unfolding { animation:unfold .13s ease-out both; }
@keyframes unfold { from { transform:scale(.86); opacity:0; } }

/* 2b. header row + filter bar. Fixed chrome at the top of the window — the
   list scrolls underneath them rather than the page scrolling past. */
.wintop { flex:none; }
.headrow {
  display:flex; align-items:baseline; justify-content:space-between; gap:16px;
  flex-wrap:wrap; padding:14px 16px 12px; border-bottom:var(--edge);
}
.place { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
.place .name {
  margin:0; font-family:var(--display); font-weight:700; font-size:16px; letter-spacing:.03em;
}
.place .stats { font-size:11px; color:var(--ink2); font-variant-numeric:tabular-nums; }
.pickers { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.pl { font-size:10px; color:var(--ink2); letter-spacing:.04em; }
/* GENRE is a menu rather than a native select: it multi-selects and shows a
   live count per genre, neither of which a <select> does well. It is styled
   to be indistinguishable from the two real selects beside it. */
.gwrap { position:relative; display:flex; }
.gpanel {
  position:absolute; top:calc(100% + 5px); left:0; z-index:30;
  min-width:230px; max-height:min(46vh,320px); overflow:hidden auto;
  background:var(--panel); border:var(--edge); border-radius:var(--r-panel);
  box-shadow:0 14px 30px -12px rgba(9,13,45,.55);
}
.gpanel button {
  display:flex; width:100%; align-items:center; gap:8px; text-align:left;
  padding:5px 10px; border:0; background:none; cursor:pointer; color:var(--ink);
  font-family:var(--display); font-size:10px; letter-spacing:.04em;
}
.gpanel button:hover { background:var(--soft); }
.gpanel button.clear { border-bottom:var(--edge); }
.gpanel .box {
  flex:none; width:11px; height:11px; border:1.5px solid var(--ink); border-radius:3px;
  background:var(--field); display:grid; place-items:center;
  font-size:9px; line-height:1; color:var(--field);
}
/* a ticked genre fills violet rather than black, matching the picked row */
.gpanel button[aria-pressed="true"] .box { background:var(--pool-violet); }
.gpanel .ct { margin-left:auto; opacity:.55; font-variant-numeric:tabular-nums; }

.pickers select, .pickers .gbtn {
  appearance:none; border:var(--edge); background:var(--field);
  border-radius:var(--r-ctl);
  font-family:var(--display); font-size:11px; padding:4px 22px 4px 8px;
  cursor:pointer; box-shadow:var(--bevel); color:var(--ink);
  max-width:250px; text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),
                   linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:right 9px center, right 5px center;
  background-size:4px 4px, 4px 4px; background-repeat:no-repeat;
}
.pickers select:hover, .pickers .gbtn:hover { background-color:var(--soft); }
/* A genre in force is the strongest thing on this row, so it says so. The caret
   is redrawn in white: the two-gradient arrow above is drawn in ink and would
   disappear into the accent. */
.pickers .gbtn.on {
  background-color:var(--accent); color:#FFFFFF; font-weight:700;
  box-shadow:var(--bevel-key);
  background-image:linear-gradient(45deg,transparent 50%,#FFFFFF 50%),
                   linear-gradient(135deg,#FFFFFF 50%,transparent 50%);
}
.pickers .gbtn.on:hover { background-color:#3945DD; }
.pickers .gbtn { text-align:left; }
.pickers .gbtn[aria-expanded="true"] { background-color:var(--soft); }

/* 2d. body — weighted toward the map. The list only needs room for a name
   and a time; the map is the thing you're actually reading. */
/* The map is the subject on the walk screen and scenery on the two above it:
   four circles for a whole country, eighteen orientation-only marks for a city,
   neither of which decides anything. So on those two it is not there at all and
   the list takes the window.
   The TRACK collapses rather than the element hiding, because display:none
   cannot be animated and this wants to open rather than appear. Both states
   are minmax(length, fr) so the two interpolate. */
.body {
  flex:1; min-height:0; display:grid; overflow:hidden;
  border-radius:0 0 calc(var(--r-shell) - 2px) calc(var(--r-shell) - 2px);
  grid-template-columns:minmax(420px,1.2fr) minmax(330px,1fr);
  transition:grid-template-columns .3s cubic-bezier(.22,.61,.36,1),
             grid-template-rows .3s cubic-bezier(.22,.61,.36,1);
}
/* The class sits on the WINDOW, not on the body. Shrinking the grid inside a
   1200px window only moved the emptiness around — a 551px list adrift in a
   frame built to hold a map beside it. With no map there is no reason for the
   window to be that wide, so it shrinks to the list and becomes what it should
   have been all along on these screens: a small window on a desktop. */
.win.nomap { max-width:600px; }
.win.nomap .body { grid-template-columns:minmax(0px,0fr) minmax(0,1fr); }
/* the seam goes with it, or a 1.5px line is left standing in an empty column */
/* padding:0 as well as a zero track — border-box does not clamp padding on an
   item whose track is 0, so 14px each side left a 28px sliver of invisible map
   cell lying over the left edge of the list, swallowing clicks on every row it
   covered. pointer-events:none covers the same ground during the transition. */
.win.nomap .mapcell {
  opacity:0; border-right-width:0; padding:0; pointer-events:none;
}

/* left cell — a real slippy map: Web Mercator, free pan and zoom, every
   shop in the set plotted at its true position. */
.mapcell {
  border-right:var(--edge); padding:14px; min-height:0; min-width:0;
  display:flex; flex-direction:column;
  overflow:hidden; transition:opacity .2s ease;
}
.mapcard {
  position:relative; background:var(--paper); border:var(--edge);
  border-radius:var(--r-panel);
  box-shadow:inset 2px 2px 0 var(--paper-line); padding:10px;
  flex:1; min-height:0; display:flex; overflow:hidden;
}
/* Scoped by id rather than ".mapcard svg". There was a second svg in this
   card — the locator inset — and a descendant selector sized it to the whole
   card. The inset is gone, but the id costs nothing and the next svg dropped
   in here would hit the same trap. */
#map {
  flex:1; min-width:0; min-height:0; width:100%; height:100%; display:block;
  cursor:grab; touch-action:none;
}
#map.dragging { cursor:grabbing; }

/* base: a world-anchored metric graticule, and nothing else. There is no
   basemap here, so the grid and the scale bar carry all the geography. */
.grid { stroke:var(--paper-line); stroke-width:1; fill:none; }
.scaleline { stroke:var(--ink); stroke-width:1.5; fill:none; }
.scaletext, .gridtext {
  font-family:var(--mono); font-size:9px; letter-spacing:.06em; fill:var(--ink2);
}

/* The route is cased: a wide paper-coloured line underneath knocks out the
   grid and any dot it crosses, so the ink line reads cleanly on top. */
.route-case {
  fill:none; stroke:var(--paper); stroke-width:6; stroke-linejoin:round;
  stroke-linecap:round; pointer-events:none;
}
.route {
  fill:none; stroke:var(--pool-violet); stroke-width:2; stroke-linejoin:round;
  stroke-dasharray:6 4; pointer-events:none;
}
.chev { fill:none; stroke:var(--pool-violet); stroke-width:1.6; stroke-linecap:round;
        stroke-linejoin:round; pointer-events:none; }

/* one shop, one circle. No numbers on the map — order lives in the list,
   and the two halves are tied together by the highlight instead. */
.pin { cursor:pointer; }
.pin .hit { fill:transparent; stroke:none; }
.pin .dot { fill:var(--paper); stroke:var(--ink); stroke-width:1.25; }
.pin .halo { fill:none; stroke:var(--ink); stroke-width:1.5; opacity:0; }

/* part of the walk currently on screen */
.pin.on .dot { fill:var(--pool-violet); }
/* where that walk starts, so the line has a readable beginning */
.pin.first .dot { fill:var(--pool-violet); }
.pin.first .halo { opacity:1; stroke:var(--pool-violet); }
/* excluded by a filter — still drawn, still openable */
.pin.off .dot { opacity:.3; }
/* the coordinate is a neighbourhood stub, not a doorway */
.pin.approx .dot { stroke-dasharray:2 2; }

/* the last stop, squared off so start and finish never read the same */
.pin .term { fill:none; stroke:var(--ink); stroke-width:1.5; }

/* Pointed at, from either the map or the list. This used to fill with the
   same accent the route dots used, so the fill said nothing and the halo did
   all the work. Filling with ink instead separates the two: 1.92:1 against a
   violet route dot, where before it was 1.00:1. */
.pin.hot .dot, .pin:hover .dot { fill:var(--ink); stroke-width:1.5; }
.pin.hot .halo, .pin:hover .halo { opacity:1; stroke:var(--ink); }
/* a dimmed shop comes back to full strength while you point at it */
.pin.hot .dot, .pin:hover .dot { opacity:1; }

/* ---------------- the city layer ----------------
   Below CITY_Z a shop dot stops meaning anything: 212 of them land inside
   190px of Tokyo and read as one blot. So the country resolves to one circle
   per city instead — cobalt rather than the route's violet, because this is
   the desktop's own blue and the layer never shares a frame with a route
   line, so the two can't be confused.
   The count sits inside the circle; the NAME does not, and never does — it
   comes up only under the pointer, same rule as a shop. */
/* .placepin carries the look; .citypin and .areapin only say WHICH layer a
   mark belongs to. They were one class until an area mark — which has no count
   inside it — was picked up by a `.citypin .cct` lookup and returned null. A
   class that means two things is a bug waiting for its moment. */
.placepin { cursor:pointer; }
.placepin .cdisc { fill:var(--accent); stroke:var(--ink); stroke-width:1.5; }
.placepin .cct {
  font-family:var(--mono); font-weight:700; font-size:10px; fill:#FFFFFF;
  text-anchor:middle; pointer-events:none; font-variant-numeric:tabular-nums;
}
/* pointed at, from either half — ink, exactly as a shop dot does it */
.placepin.hot .cdisc, .placepin:hover .cdisc { fill:var(--ink); }

/* The one place a name IS drawn persistently, and only under a thumb. The
   hover-only rule exists because clusters make standing labels unreadable —
   four circles with the whole country in frame have no cluster to be ruined
   by, and a touch device has no hover to reveal them with instead. So the
   rule's reason is what's being honoured here, not its letter. */
.citylab {
  font-family:var(--display); font-weight:700; font-size:10px; letter-spacing:.05em;
  fill:var(--ink); text-anchor:middle;
  paint-order:stroke; stroke:var(--paper); stroke-width:3.5;
  stroke-linejoin:round; pointer-events:none;
}
/* pointing at the row lights the mark and its name together */
.placepin.hot .citylab { fill:var(--pool-violet); }
/* The area layer is orientation-only at every size — see drawAreas. Eighteen
   marks over one city collide however wide the screen is, so these are never
   targets and the list is always the control. */
.placepin.orient { pointer-events:none; cursor:default; }

/* Hover label. Names are never drawn persistently — clusters make that
   unreadable — so this is the only text on the map, and only for the one
   circle under the pointer. Stroked in paper first so it stays legible over
   grid lines and other dots without needing a backing box. */
.hoverlab {
  font-family:var(--text); font-size:11px; font-weight:500; fill:var(--ink);
  paint-order:stroke; stroke:var(--paper); stroke-width:3.5;
  stroke-linejoin:round; pointer-events:none;
}

/* zoom controls, bevelled like everything else */
.zoomctl {
  position:absolute; right:16px; top:16px; display:flex; flex-direction:column; gap:5px;
}
.zoomctl button {
  width:28px; height:28px; padding:0; border:var(--edge); background:var(--field);
  border-radius:50%;
  box-shadow:var(--bevel); cursor:pointer; font-family:var(--display);
  font-size:13px; font-weight:700; line-height:1; color:var(--ink);
  display:grid; place-items:center;
}
.zoomctl button.wide { width:26px; font-size:8px; letter-spacing:.04em; }
.zoomctl button:hover { background:var(--soft); }
.zoomctl button[disabled] { opacity:.35; cursor:default; }
.zoomctl button[disabled]:hover { background:var(--field); }
/* Two columns already show the map and the list at once, so there is nothing
   for this to expand out of. It exists on the one-column layout only. */
#mapFull { display:none; }

/* There was a status bar under the card. It restated the breadcrumb from the
   window header and the in-view count from the stats line beside it, and its
   only original content was a raw zoom number the scale bar already answers
   in metres. Three ways of saying the same thing is two too many. */

/* right cell — the ordered list. Sizes to content and scrolls with the page;
   no inner scroller. */
.listcell { display:flex; flex-direction:column; min-height:0; }
#rows { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; }
/* the strip carries the walk's actions too, now that the action bar is gone —
   the totals live in the window header and are not repeated here */
.listhead {
  flex:none; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:7px 14px; border-bottom:var(--edge); background:var(--panel2);
}
.listhead .sec { font-family:var(--display); font-weight:700; font-size:11px; letter-spacing:.04em; }
/* empty on the walk screen — collapse it so the row's gap goes with it */
.listhead .sec:empty { display:none; }
.listhead .acts { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-left:auto; }
/* Continuation legs sit tight against the primary link so they read as one
   control that happens to have several doors, not as four separate actions. */
.mapsmore { display:inline-flex; gap:4px; flex-wrap:wrap; }
.mapsmore:empty { display:none; }
.mapsmore .btn { padding:4px 7px; font-size:9px; letter-spacing:.04em; }

.row {
  display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:12px;
  align-items:center; padding:9px 14px; border-bottom:1px solid var(--hair);
}
.row { cursor:pointer; }
/* the two figure columns keep the mono — they are the only things on the
   page that have to line up vertically down 35 rows */
.row .n { font-family:var(--mono); font-weight:700; font-size:11px; text-align:right; font-variant-numeric:tabular-nums; }
/* one line per stop: the name and nothing under it. A real button, so the
   window it opens is reachable by keyboard as well as pointer. */
.row .nm {
  font-size:13px; font-weight:500; min-width:0; text-align:left;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  border:0; background:none; padding:0; color:inherit;
  font-family:inherit; cursor:pointer;
}
.row .nm:hover { text-decoration:underline; }
.row .act { display:flex; align-items:center; gap:10px; justify-content:flex-end; }
.row .mins { font-family:var(--mono); font-size:10px; min-width:46px; text-align:right; color:var(--ink2); font-variant-numeric:tabular-nums; }
/* 35 always-visible buttons dominated the page, so they only appear on the
   row you're pointing at */
.row .startbtn {
  border:var(--edge); background:var(--soft); cursor:pointer; padding:3px 8px;
  border-radius:var(--r-tag);
  font-family:var(--display); font-size:9px; letter-spacing:.06em; color:var(--ink);
  box-shadow:var(--bevel-soft); opacity:0;
}
/* drop a stop from the walk. Quiet until you point at the row, same as
   START HERE — a column of ✕ down the list would read as an error state. */
.row .cut {
  border:var(--edge); background:var(--field); cursor:pointer;
  border-radius:var(--r-tag); padding:3px 7px; font-family:var(--display); font-size:9px; line-height:1;
  color:var(--ink2); box-shadow:var(--bevel); opacity:0;
}
.row .cut:hover { background:var(--warn); color:var(--field); }
.row.hot .startbtn, .row:hover .startbtn, .row .startbtn:focus-visible,
.row.hot .cut, .row:hover .cut, .row .cut:focus-visible { opacity:1; }
.row.first .startbtn { visibility:hidden; }
/* the row under the pointer stops being a black bar and becomes a Poolside
   plate — violet ground, pale pink name, hot pink time */
.row.hot, .row:hover { background:var(--pool-violet); color:var(--pool-pale); }
.row.hot .mins, .row:hover .mins { color:var(--on-dark); }
.empty { margin:0; padding:18px 14px; font-size:11px; color:var(--ink2); letter-spacing:.04em; }

/* What to do next, on the screens where there is no map left to say it on.
   Same shape as a drop note but in the secondary ink: this is guidance, not a
   warning about something being withheld. */
.leadnote {
  margin:0; padding:9px 14px; border-bottom:1px solid var(--hair);
  font-size:9.5px; letter-spacing:.06em; color:var(--ink2);
}

/* The city rows, which stand in for the ordered walk at a zoom where there is
   no walk to order. A real button, so the country view is as reachable from
   the keyboard as the shop list is — the circles on the map are pointer-work,
   and this is their twin. Deliberately taller and quieter than a shop row: no
   walk order, no minutes, nothing to remove. */
/* Back to one line, name and figures facing each other. It went to two to make
   room for the genre character, and that is gone. */
.crow {
  display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px;
  align-items:center; width:100%; padding:12px 14px; cursor:pointer;
  border:0; border-bottom:1px solid var(--hair); background:none;
  color:inherit; font:inherit; text-align:left;
}
.crow .cn {
  font-family:var(--display); font-weight:700; font-size:13px; letter-spacing:.03em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.crow .cc {
  font-family:var(--mono); font-size:10px; color:var(--ink2);
  font-variant-numeric:tabular-nums; letter-spacing:.04em;
  white-space:nowrap;
}
.crow.hot, .crow:hover { background:var(--pool-violet); color:var(--pool-pale); }
.crow.hot .cc, .crow:hover .cc { color:var(--on-dark); }
/* Focus lights the row, so by the time the ring is drawn the ground under it
   is the violet — where the sheet's cobalt ring is all but invisible. It takes
   the pink instead, the same swap the desktop icons make. Inset, because a row
   runs the full width of a scroller that would clip an outer ring. */
.crow:focus-visible { outline:2px solid var(--pool-pink); outline-offset:-4px; }

/* dropped stops, stated rather than silently missing */
.dropnote {
  margin:0; padding:8px 14px; border-bottom:1px solid var(--hair);
  font-size:9.5px; letter-spacing:.06em; color:var(--warn);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.dropnote .undo {
  border:var(--edge); background:var(--field); cursor:pointer;
  border-radius:var(--r-tag); padding:3px 9px; font-family:var(--display); font-size:9px; letter-spacing:.06em;
  color:var(--ink); box-shadow:var(--bevel);
}
.dropnote .undo:hover { background:var(--soft); }

.btn {
  border:var(--edge); background:var(--field); cursor:pointer; padding:7px 14px;
  border-radius:var(--r-ctl);
  font-family:var(--display); font-size:11px; color:var(--ink);
  box-shadow:var(--bevel-field); display:inline-flex; align-items:center; gap:7px;
}
.btn:hover { background:var(--soft); }
.btn.primary {
  background:var(--accent); color:#FFFFFF; font-weight:700; box-shadow:var(--bevel-key);
}
.btn.primary:hover { background:#3945DD; }
.btn.tight { padding:4px 9px; font-size:10px; gap:5px; }
.btn[disabled], .btn.dead { opacity:.4; cursor:default; pointer-events:none; }

/* ---------------- 2f. the minimised icon ----------------
   Where the window goes when you put it away — and the reason the desktop is
   finally doing something, since until now the cobalt field was wallpaper
   with nothing standing on it.
   Drawn the way this desktop would draw one: pictogram, name underneath, no
   plate behind it, and a selection box only while it is pointed at. Top
   left, clear of the spine and level with the clock plate, because that is
   the corner every desktop fills first.
   A record rather than a folder or a little map — it is the one object the
   whole page is about. The pale rim is not decoration: an ink disc on a dark
   blue field has nowhere near enough separation without it.

   The icons are stacked in a column and the column sits *under* the window,
   which is the right way round for a desktop: open the application and it
   covers them, put it away and they are what is left behind. Only PlayCast's
   own icon comes and goes, because that one is the folded window itself.
   Track of the Week is always down there. */
.deskicons {
  position:fixed; left:calc(var(--spine-w) + 12px); top:12px; z-index:2;
  display:flex; flex-direction:column; align-items:flex-start; gap:4px;
}
.deskicon {
  width:84px; padding:8px 4px 7px; cursor:pointer;
  border:1.5px solid transparent; border-radius:var(--r-panel); background:none;
  display:flex; flex-direction:column; align-items:center; gap:7px;
}
.deskicon:hover, .deskicon:focus-visible {
  background:rgba(9,13,45,.34); border-color:rgba(253,231,240,.34);
}
/* the sheet's global focus ring is the accent, and out here the accent is
   also the ground it would be drawn on — so the icon takes the pink instead */
.deskicon:focus-visible { outline:2px solid var(--pool-pink); outline-offset:2px; }
.deskicon svg { display:block; }
.deskicon .disc { fill:var(--ink); stroke:var(--panel); stroke-width:1.5; }
.deskicon .groove { fill:none; stroke:rgba(253,231,240,.28); }
.deskicon .lab { fill:var(--pool-pink); }
.deskicon .hole { fill:var(--panel); }
.deskicon .lbl {
  font-family:var(--display); font-weight:700; font-size:10px; letter-spacing:.05em;
  color:var(--panel); text-shadow:0 1px 0 rgba(9,13,45,.9);
  text-align:center; line-height:1.25;
}
/* the second icon: a set, so it reads as the same family as the disc — ink
   body, pale rim, and the pink doing the one job that matters, which here is
   the lit screen rather than the record label */
.deskicon .crt, .deskicon .foot { fill:var(--ink); stroke:var(--panel); stroke-width:1.5; }
.deskicon .scr { fill:var(--pool-pink); }
.deskicon .play { fill:var(--ink); }
/* With the window gone the desk has nothing left to give it height, and on
   the narrow layout it would shrink to the depth of the clock plate. A
   desktop is the whole screen or it is not a desktop. */
.desk.bare { min-height:100vh; min-height:100dvh; }

/* ---------------- 3. shop windows ----------------
   Click a stop and it opens as its own little window: same chrome as the
   main one, draggable by the title bar, and as many at once as you like. */
.wins { position:fixed; inset:0; pointer-events:none; z-index:20; }
.pop {
  position:absolute; pointer-events:auto;
  width:min(340px, calc(100vw - 24px));
  background:var(--panel); border:var(--edge); border-radius:var(--r-shell);
  box-shadow:0 2px 0 rgba(9,13,45,.18), 0 26px 46px -20px rgba(9,13,45,.55);
  display:flex; flex-direction:column; overflow:hidden;
}
.pop-bar {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:6px 10px; border-bottom:var(--edge);
  cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none;
}
.pop-bar:active { cursor:grabbing; }
.pop-close {
  border:0; background:none; padding:0 2px; font:inherit; font-size:14px;
  line-height:1; cursor:pointer; color:var(--ink);
}
.pop-close:hover { color:var(--warn); }
.pop-title {
  font-family:var(--display); font-weight:700; font-size:11px; letter-spacing:.04em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:right;
}
.pop-body {
  padding:11px 12px 12px; display:flex; flex-direction:column; gap:10px;
  max-height:min(58vh,520px); overflow-y:auto;
  background:var(--field); box-shadow:inset 2px 2px 0 var(--hair);
}
.spec {
  display:grid; grid-template-columns:56px minmax(0,1fr); gap:5px 10px;
  margin:0; font-size:10.5px;
}
.spec dt { color:var(--ink2); letter-spacing:.06em; font-size:9px; padding-top:2px; }
.spec dd { margin:0; line-height:1.5; overflow-wrap:anywhere; }
.spec dd.shut { color:var(--warn); }
.pop-links { display:flex; flex-wrap:wrap; gap:6px; }

/* The source line that ran under the window has been removed. Note that it
   carried the OpenStreetMap credit, and OSM data is ODbL — the attribution
   is a licence condition, not decoration, so it needs a home somewhere. */

/* ---------------- mobile ----------------
   Below this the desktop metaphor stops paying for itself. A 40px spine plus a
   16px gutter of wallpaper spent 14% of a phone's width on scenery, and the
   map — the thing the page is actually for — was left as a band partway down a
   long scrolling document.
   So on a phone the window IS the screen: edge to edge, no gutter, no radius,
   one screenful with the list scrolling inside it. That is not a special case
   bolted on, it is the same arrangement the desktop layout already uses; the
   old narrow breakpoint undid it and handed the page back to the scrollbar.
   Nothing of the desktop is on screen while the app is: no band, no clock, no
   icons, no gutter. It has not been thrown away — it has been moved. Press the
   − in the picker row and the app folds down, and then the desktop is ALL of
   the screen: the real vertical spine with the wordmark set large, the clock on
   its plate, the record and Track of the Week as proper labelled icons.
   Which is a far better showing than the 34px strip of cobalt this used to
   spend permanently at the top. A desktop is somewhere you go, not a border you
   look at — and that is also the only condition on which the minimise button
   earns its place back here, the same test everything else on this layout had
   to pass: it does something. */
@media (max-width:880px) {
  :root { --spine-w:0px; }

  /* While the app is up, the app is the whole phone. */
  .desk:not(.bare) .spine,
  .desk:not(.bare) .menubar,
  .desk:not(.bare) .deskicons { display:none; }

  /* Folded away, the desk gets its own layout back untouched — the base rules
     already describe exactly the right thing, so the trick is to stop
     overriding them rather than to write a second set. The token comes back
     first, because the spine's width and the icons' left edge both read it. */
  .desk.bare { --spine-w:40px; }
  .desk.bare .spine span { font-size:clamp(24px, 4vh, 34px); }

  /* Minimise is a real control again, and it does not live in the picker row.
     Sitting at the end of that row behind a hairline it was the tallest thing in
     it, so the row grew to hold it — and on a narrower phone the row wrapped and
     the button landed on a line of its own: a whole row of chrome for one
     button. Lifted out of the flow into the window's top-right corner instead,
     level with the place name, where there was already nothing. Out of flow
     means it now costs NO height at all, and the picker row is back to the three
     controls that actually belong to it.
     It is also the corner this button was always described as belonging to. */
  .headrow { position:relative; }
  .desk .minbtn {
    position:absolute; right:10px; top:5px;
    width:34px; height:34px; font-size:16px;
  }
  /* keep a long place name from running under it */
  .place { padding-right:42px; }
  /* The hairline was there to say the button acts on the window rather than on
     the walk. Out of the row altogether, its position says that by itself. */
  .pickers .sep { display:none; }

  /* ---- surviving the frame ----
     Embedded, this page is not sizing itself against a phone. It is sizing
     itself against an iframe whose height the host sets FROM this page's own
     scrollHeight. So 100dvh with everything clipped is circular: dvh resolves
     against the frame, the frame resolves against the content, and the pair
     settle at whatever height the frame happened to start at and never correct.
     That is how a layout which measures perfectly as a standalone file can come

     86 area labels, but only a couple of dozen places you can spend
     a day, and the labels mislead: Shinjuku and Nishi-Shinjuku are
     one stroll under two names, Kyoto's Nakagyo-ku and Chukyo-ku are
     the same ward romanised twice. So the labels don't get a vote.
     Shops cluster on their own coordinates — single linkage at 500 m,
     the distance you'd cross without thinking — and three or more in
     a cluster becomes a walk you can be handed whole.
     ============================================================ */
  SHOPS.forEach(function (s, i) { s.ix = i; });

  /* ---- reject coordinates that contradict their own address ----
     Four records geocoded to the wrong country or prefecture: one Osaka shop
     sits in Xi'an, one Tokyo shop in Oita, one in the Pacific off Chiba, and
     RAWMEN RECORDS lost a digit of longitude and landed 93 km away in
     Yamanashi. All four state a correct street address, so the coordinate is
     the part that is wrong. Anything more than 40 km from the median of the
     city the shop itself claims is treated as unplaced — it keeps its

  /* The 500m walk clusters that used to live here have gone. They were read by
     exactly two things — the JUMP TO menu and the opening frame — and both now
     work from areas, because a menu has to reach every shop and clusters only
     ever covered 71% of them. Removing them takes an O(n^2) pass over 313 shops
     out of page load, and takes with it the second set of names and numbers for
     the same places that had "Shibuya (19)" sitting next to "SHIBUYA 33 SHOPS". */

  /* ============================================================
     genre families + opening days
     ------------------------------------------------------------
     · 90 distinct genre strings, most of them a long tail of one-offs
       and near-duplicates ("Jazz"/"JAZZ", "Hip-Hop"/"HipHop"), so they
       roll up into families.
     · Opening days are free text. Some shops state a closing day we can
       parse, most say nothing. The day picker therefore drops shops
       KNOWN to be shut and keeps the unknowns — dropping every maybe
       helps nobody. The day-word pattern is deliberately tight: a looser
       one read "Monthly opening days are posted on Instagram" as Monday
       and marked that shop closed six days a week.
     ============================================================ */
  var FAMILIES = [
    ["ROCK",                 ["Rock & Oldies","Rock & Indie","Rock","Progressive Rock","Hard Rock & Metal","Indie Rock","Underground Rock","Shoegaze","Oldies","Beatles","New Wave","オルタナ","Pop","Pops"]],
    ["JAZZ",                 ["Jazz","JAZZ"]],
    ["SOUL & FUNK",          ["Soul","Funk & Disco","Soul Funk","Black Music etc","ブラックミュージック","ハワイアンソウル","All genres with a focus on soul","AOR and beyond","シハワイアンAOR"]],
    ["JAPANESE",             ["Kayōkyoku / J-Pop","City Pop","Japanese Indie","Shōwa / Wamono","Japanese","Japanese music","Okinawan"]],
    ["HIP-HOP & R&B",        ["Hip-Hop & R&B","Hip-hop","HipHop","Hip-Hop","R&B","R&B etc"]],
    ["PUNK & HARDCORE",      ["Punk","Post-Punk","Hardcore","Underground Metal & Punk","ハードコアなど","エモ","PUNK POWERPOP NEW WAVE POSTPUNK etc"]],
    ["CLUB & DANCE",         ["Club & Dance","House","Techno","Club music","Dance","12 Inch Single"]],
    ["LATIN & BRAZILIAN",    ["Latin & Brazilian","Latin","Brazilian","Brazil"]],
    ["REGGAE & SKA",         ["Reggae & Ska","Reggae","Ska / Rocksteady"]],
    ["CLASSICAL",            ["Classical","Contemporary"]],
    ["ELECTRONIC",           ["Electronica & Ambient","Ambient","Electronic music"]],
    ["WORLD",                ["World","Africa","Asian","Europe","アジア音楽","Chinese Underground","ハワイアントラディショナルEtc"]],
    ["FOLK & BLUES",         ["Folk","Blues","Country","Old-Time","Bluegrass"]],
    ["AVANT-GARDE",          ["Noise & Avant-Garde","Experimental","Avant-garde","Avant-Garde"]],
    ["SOUNDTRACKS",          ["Soundtracks","Soundtrack","サウンドトラック"]],
    ["EVERYTHING",           ["All genres","All genres (7-inch records only)","Non-genre selection","ROCK.SOUL.JAZZ.HIPHOP.REGGAE.J-POP etc","Independent","Independent Releases"]]
  ];
  var FAM_OF = {};
  FAMILIES.forEach(function (f) {
    f[1].forEach(function (tag) { FAM_OF[tag] = f[0]; });

    if (s._fams) return s._fams;
    var seen = {}, out = [];
    (s.g || []).forEach(function (tag) {

  }

  var DAY_ABBR = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
  var IDX = { sun:0, mon:1, tue:2, wed:3, thu:4, fri:5, sat:6 };
  /* substring tests — these run over text already known to name closures, so
     they can be loose. The lookaheads stop "month" and "satellite". */
  var SHUT_RX = [
    /sun|日曜/i, /mon(?!th)|月曜/i, /tue|火曜/i, /wed|水曜/i,
    /thu|木曜/i, /fri|金曜/i, /sat(?!ell)|土曜/i

  var D1 = "(sun|mon|tues?|wed(?:nes)?|thur?s?|fri|sat(?:ur)?)(?:day)?s?";
  var DAY_WORD = new RegExp("\\b" + D1 + "\\.?\\b", "gi");

     badged closed Tue–Thu. */

    "\\b" + D1 + "\\s*(?:[\\u2013\\u2014\\-~\\u301c]|through|thru|to)\\s*" + D1, "gi");
  /* "(11:00 - 20:00 on Saturdays, Sundays)" states DIFFERENT HOURS for those
     days, not an exclusive schedule. Inferring from it closes a shop that is
     in fact open all week, so treat the whole listing as unknown instead. */
  var HOURS_VARIATION = /[（(][^)）]*\d{1,2}[:：]\d{2}[^)）]*\bon\b/i;
  var NOISE = /(?:one|1st|2nd|3rd|first|second|third|last)\s+\w*\s*(?:a|per|of the)?\s*month|irregular|public holiday|national holiday|may vary/gi;

  /* Day indices the shop is known to be shut, or null when the listing says
     nothing we can trust. Explicit "closed X" wins; failing that, a stated
     open-day schedule implies the rest are shut. */
  function closedDays(s) {
    if (s._shut !== undefined) return s._shut;
    var bits = [], m, rx;
    if (s.cl) bits.push(s.cl);
    var h = s.h || "";
    rx = /clos(?:ed)?[^A-Za-z一-鿿]{0,3}([^)）·\/]*)/gi;
    while ((m = rx.exec(h))) bits.push(m[1]);
    rx = /定休日?[^0-9]{0,3}([^)）·\/]*)/g;
    while ((m = rx.exec(h))) bits.push(m[1]);

    var said = bits.join(" ").replace(NOISE, " "), out = [];
    if (said.trim()) {
      SHUT_RX.forEach(function (r, i) { if (r.test(said)) out.push(i); });
      if (out.length) { s._shut = out; return out; }
    }

    /* no explicit closure — infer from the days it says it IS open */
    if (HOURS_VARIATION.test(h)) { s._shut = null; return null; }
    var open = {}, any = false, i;
    DAY_RANGE.lastIndex = 0;
    while ((m = DAY_RANGE.exec(h))) {
      var a = IDX[m[1].slice(0, 3).toLowerCase()], b = IDX[m[2].slice(0, 3).toLowerCase()];
      for (i = a;; i = (i + 1) % 7) { open[i] = 1; any = true; if (i === b) break; }
    }
    DAY_WORD.lastIndex = 0;
    while ((m = DAY_WORD.exec(h))) { open[IDX[m[1].slice(0, 3).toLowerCase()]] = 1; any = true; }

    if (/weekend/i.test(h)) { [0,6].forEach(function (d) { open[d] = 1; }); any = true; }

  var PLACED = SHOPS.filter(function (s) { return s.lat != null && !s.badGeo; });
  var CITIES = [], CITY_BY_NAME = {};
  (function () {
    var by = {};
    PLACED.forEach(function (s) { (by[s.c] = by[s.c] || []).push(s); });
    CITIES = Object.keys(by).map(function (c) {
      var ss = by[c], lat = 0, lng = 0;
      /* The mean position rather than the middle of the bounding box, so the
         circle sits where the shops actually are and not halfway to whichever
         lone outlying shop stretches the box. */
      ss.forEach(function (s) { lat += s.lat; lng += s.lng; });
      return { c: c, shops: ss, lat: lat / ss.length, lng: lng / ss.length };
    }).sort(function (a, b) { return b.shops.length - a.shops.length; });
    CITIES.forEach(function (c) { CITY_BY_NAME[c.c] = c; });
  })();

     Osaka, and Kita of three cities, so the bare name is not a key. */
  var AREAS = [], AREA_BY_KEY = {};
  (function () {
    var by = {};
    PLACED.forEach(function (s) {
      var k = s.c + "|" + s.a;
      (by[k] = by[k] || []).push(s);
    });
    AREAS = Object.keys(by).map(function (k) {
      var ss = by[k], lat = 0, lng = 0;
      ss.forEach(function (s) { lat += s.lat; lng += s.lng; });
      return {
        key: k, c: ss[0].c, a: ss[0].a, shops: ss,
        lat: lat / ss.length, lng: lng / ss.length

    }).sort(function (a, b) { return b.shops.length - a.shops.length; });
    AREAS.forEach(function (a) { AREA_BY_KEY[a.key] = a; });
  })();

  /* ============================================================
     state
     ============================================================ */
  var day = "";                /* "" or "0".."6", 0 = Sunday */
  /* a set, not one value: a day out is "jazz or soul", not "jazz" */
  var GENS = {};
  /* stops dropped by hand from the right-hand list. Not a data edit — the shop
     stays in the set, it is just out of this walk until you restore it. */
  var CUT = {};
  var menuOpen = false;
  var PIN = null;              /* shop.ix of the chosen first stop */
  /* The CURRENT stop — not "the hovered one". Under a mouse those are the same
     thing and it behaves exactly as it always did. Under a thumb there is no
     hovering, so a tap sets it instead, and everything that used to need a
     cursor overhead — the name on the map, the lit row, START HERE and ✕ —
     hangs off this one value for both kinds of input. */
  var hot = null;

  /* Which kind of input is in use RIGHT NOW, rather than what the device is
     capable of: a laptop with a touchscreen is both, and what matters is which
     one the gesture in hand came from. Seeded from the media query for the
     first gesture, then corrected by every pointerdown. */
  /* Is this the one-column layout? Asked in one place because two unrelated
     things turn on it: shop windows dock instead of floating, and the header
     stats drop the two facts the map hint already carries. Live, not read once —
     a rotation crosses this line. */
  var narrowMQ = window.matchMedia("(max-width:880px)");
  function narrow() { return narrowMQ.matches; }

  /* Which pointer is in use RIGHT NOW, rather than what the device can do: a
     laptop with a touchscreen is both, and what matters is where the gesture in
     hand came from. Seeded from the media query, then corrected by every
     pointerdown.
     This governs BEHAVIOUR only — the two-stage tap, and whether hover is
     listened to. It must never trigger a redraw. It once did, to resize the hit
     discs, and that was a real bug: this listener runs on pointerdown, a
     deferred render then fired on the task boundary before the click, and
     rewriting #rows detached the very element under the finger — so the click
     landed on an orphan, never reached the handler, and the first tap on the

     toolbar being toggled), that comes with a resize, which redraws anyway. */
  var coarseDev = window.matchMedia("(hover: none), (pointer: coarse)");

  var placeName = "";          /* what the header calls the current view */

  var locked = null;

  function inDay(s) {

  }

  function genCount() { return Object.keys(GENS).length; }
  /* everything a shop has to pass to be part of the walk on screen */
  function keep(s) { return inDay(s) && inGenre(s) && !CUT[s.ix]; }

  function inGenre(s) {
    if (!genCount()) return true;
    var f = famsOf(s);
    for (var i = 0; i < f.length; i++) if (GENS[f[i]]) return true;
    return false;
  }

  /* ============================================================
     the route — an ordered day through whatever is on screen
     ------------------------------------------------------------
     Nearest-neighbour alone leaves obvious crossings, so several
     first stops are tried and each chain is polished with 2-opt.
     Trying every start is O(n³); past a dozen stops it samples eight
     spread through the set instead, which is indistinguishable in
     result and keeps a 40-stop solve instant.
     ============================================================ */
  var PACE_KMH = 4.5;          /* unhurried, carrying records */
  var DETOUR = 1.25;           /* streets over straight lines */
  var MAX_WAYPOINTS = 10;      /* what one Google Maps URL will take */

  function walkMinutes(km) { return Math.round(km * DETOUR / PACE_KMH * 60); }

  /* The widest gap between any two shops in a set — the one number that tells a
     visitor whether a place is an afternoon or an expedition. It separates
     Koenji (10 shops inside 650m) from Suginami (7 spread over 6.2km), which
     are both filed as "areas" and are not remotely the same proposition.
     Crow-flies, and deliberately so: this is a shape, not a route. */
  function spanKm(list) {
    var d = 0, i, j;
    for (i = 0; i < list.length; i++) {

        if (k > d) d = k;
      }
    }

  }
  /* A district's genre character used to be computed here and printed on the
     row. It has gone: the label could only ever name the top two families, so a
     district also holding electronic, or soundtracks, or anything under a
     quarter of its tagged shops, silently did not get the credit — and a
     summary that quietly drops what it cannot fit reads as fact while being
     partial. The genre PICKER still answers the same question exactly, by
     asking the data rather than by précising it. */

     stocking nothing, and the notes below are careful to say so. */
  function untagged(list) {

  }

    if (n < 2) {

      return res;

    for (i = 0; i < n; i++) {

    if (n <= 12) { for (i = 0; i < n; i++) starts.push(i); }

  /* Google's directions URL takes an origin, a destination and a handful of
     waypoints between them — ten points in all. A district walk is routinely
     three times that: Shinsaibashi is 35 stops, Shibuya 33. The old link took
     the first ten and said so on the button, which was honest and still left
     two thirds of the day with no directions.

     the chain is continuous rather than four disconnected fragments — the
     overlap is the whole point, otherwise you get no directions for the walk
     from stop 10 to stop 11. */
  function routeLegs(stops) {

  /* ============================================================
     the map — Web Mercator, free pan and zoom
     ------------------------------------------------------------
     Every shop in the set is plotted at its true position. There is

  var R_EARTH = 6378137, D2R = Math.PI / 180, R2D = 180 / Math.PI;

  function mppMerc() {

  var NICE = [1,2,5,10,20,50,100,200,250,500,1000,2000,5000,10000,20000,50000,

    for (var i = 0; i < NICE.length; i++) if (NICE[i] >= target) return NICE[i];
