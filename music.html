---
layout: music
permalink: /music/
title: Music
---

<style>
  :root {
    --window-bg: #fffaf4;
    --window-border: rgba(0,0,0,.18);
    --window-shadow: 0 12px 28px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.12);
    --titlebar-bg: #f6ece1;
    --titlebar-text: #2a1a0e;
    --accent: #e8560a;
    --accent-soft: #fde2cf;
    --ink: #1d1410;
    --muted: #6b5e54;
    --display: 'Dreamcast', 'Anton', sans-serif;
    --body: 'Nunito', 'Spoqa Han Sans', 'Apple SD Gothic Neo', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: var(--body);
    color: var(--ink);
    user-select: none;
  }

  body {
    background: #fffaf4;
    cursor: default;
  }
  .bg-graffiti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  #desktop {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  .window {
    position: absolute;
    background: var(--window-bg);
    border: 2.5px solid var(--ink);
    border-radius: 10px;
    box-shadow: 6px 6px 0 0 var(--ink);
    min-width: 220px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .titlebar {
    height: 44px;
    background: var(--titlebar-bg);
    border-bottom: 2px solid var(--ink);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 10px;
    cursor: grab;
    position: relative;
  }
  .titlebar:active { cursor: grabbing; }

  .titlebar .close {
    width: 18px;
    height: 18px;
    background: var(--window-bg);
    border: 2px solid var(--ink);
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .15s ease;
  }
  .titlebar .close:hover { background: var(--accent); }

  .titlebar .title {
    color: var(--titlebar-text);
    font-family: var(--display);
    font-weight: 400;
    font-size: 26px;
    letter-spacing: .04em;
    line-height: 1;
    margin: 0 auto;
    padding-right: 32px;
    white-space: nowrap;
  }

  .window-body {
    padding: 20px 22px;
    font-size: 19px;
    line-height: 1.5;
  }

  /* ======= VMU player (white line-art on orange — matches home) ======= */
  #w-player {
    width: 540px;
    left: 60px; top: 60px; z-index: 10;
    background: var(--accent);
    border: none;
    border-radius: 0;
    box-shadow: none;
    overflow: hidden;
    padding: 0;
  }
  #w-player .seam-l, #w-player .seam-r { display: none; }

  #w-player .titlebar {
    position: relative;
    height: 44px;
    background: var(--accent);
    border-bottom: 1px solid rgba(255, 255, 255, 0.35);
    padding: 0 14px;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #ffffff;
    font-family: var(--display);
    font-size: 22px;
    letter-spacing: 0.03em;
    cursor: grab;
  }
  #w-player .titlebar:active { cursor: grabbing; }
  #w-player .titlebar .close {
    background: transparent;
    border: 2px solid #ffffff;
    border-radius: 50%;
    width: 18px; height: 18px;
    flex-shrink: 0;
    cursor: pointer;
    transition: background .15s ease;
  }
  #w-player .titlebar .close:hover { background: #1d1410; border-color: #1d1410; }

  .vmu-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 620 / 700;
    background: var(--accent);
    container-type: inline-size;
    cursor: grab;
  }
  .vmu-stage:active { cursor: grabbing; }

  .vmu-art {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .vmu-art .vmu-line {
    fill: none;
    stroke: #ffffff;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }
  .vmu-art .vmu-letter text {
    fill: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 21px;
    text-anchor: middle;
  }
  .vmu-art .vmu-dim .dim {
    fill: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 21px;
    text-anchor: middle;
  }
  .vmu-art .vmu-dim .dim-small {
    fill: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 19px;
    text-anchor: middle;
  }

  /* LCD overlay aligned with SVG screen rect (216, 190, 188, 132) of 620x700 viewBox */
  .lcd-overlay {
    position: absolute;
    left: 34.84%;
    top: 27.14%;
    width: 30.32%;
    height: 18.86%;
    padding: 2.5%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: #ffffff;
    font-family: var(--body);
    pointer-events: none;
  }
  .lcd-overlay > * { pointer-events: auto; }
  .lcd-overlay .track-title {
    font-family: var(--display);
    font-size: 4cqw;
    line-height: 1.05;
    letter-spacing: 0.03em;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 2%;
  }
  .lcd-overlay .track-artist {
    font-size: 2.6cqw;
    line-height: 1.1;
    text-align: center;
    opacity: 0.85;
    margin-bottom: 6%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lcd-overlay .track-artist:empty { display: none; }
  .lcd-overlay .scrub {
    height: 0.9cqw;
    min-height: 4px;
    background: rgba(255, 255, 255, 0.18);
    border: 1px solid #ffffff;
    position: relative;
    cursor: pointer;
    overflow: hidden;
  }
  .lcd-overlay .scrub-fill {
    position: absolute;
    inset: 0;
    width: 0%;
    background: #ffffff;
    pointer-events: none;
  }
  .lcd-overlay .times {
    display: flex;
    justify-content: space-between;
    font-size: 2.2cqw;
    line-height: 1.1;
    margin-top: 4%;
    letter-spacing: 0.05em;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }

  /* Invisible interactive hot-spots over SVG buttons.
     Hover matches home: white → dark ink (#1d1410) via SVG stroke swap. */
  .hot {
    position: absolute;
    background: transparent;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: rgba(255, 255, 255, 0.2);
    user-select: none;
    transition: background 0.12s ease;
  }
  .hot:focus-visible {
    outline: 2px dashed #ffffff;
    outline-offset: -2px;
  }
  .hot.a-btn { left: 50.65%; top: 57.57%; width: 7.42%; height: 6.57%; border-radius: 50%; }
  .hot.b-btn { left: 60.32%; top: 57.57%; width: 7.42%; height: 6.57%; border-radius: 50%; }
  .hot.a-btn:hover,
  .hot.a-btn.playing { background: rgba(255, 255, 255, 0.25); }
  .hot.a-btn:active,
  .hot.b-btn:active  { background: rgba(255, 255, 255, 0.4); }

  /* D-pad cross actual coords (after translate -28,-35):
     up: x[224..260], y[382..408]  | down: x[224..260], y[444..470]
     left: x[198..226], y[408..444] | right: x[260..286], y[408..444] */
  .hot.dpad-up    { left: 36.13%; top: 54.57%; width: 5.81%; height: 3.71%; }
  .hot.dpad-down  { left: 36.13%; top: 63.43%; width: 5.81%; height: 3.71%; }
  .hot.dpad-left  { left: 31.94%; top: 58.29%; width: 4.52%; height: 5.14%; }
  .hot.dpad-right { left: 41.94%; top: 58.29%; width: 4.19%; height: 5.14%; }
  .hot.dpad-up:active,
  .hot.dpad-down:active,
  .hot.dpad-left:active,
  .hot.dpad-right:active { background: rgba(255, 255, 255, 0.25); }

  .hidden { display: none !important; }

  @media (max-width: 700px) {
    /* Hide palm-tree background entirely; use solid orange */
    .bg-graffiti { display: none; }
    body { background: var(--accent); }

    #desktop {
      overflow: hidden;
      padding: 0;
    }

    /* Player: full-width hero, top of viewport */
    #w-player {
      position: relative !important;
      left: auto !important;
      top: auto !important;
      width: 100%;
      max-width: 100vw;
      margin: 0 auto 80px auto;
      z-index: 10;
      padding: 0;
    }

    /* Bigger close buttons */
    .titlebar .close {
      width: 28px !important;
      height: 28px !important;
    }

    /* Thumb-friendly scrub on mobile */
    .lcd-overlay .scrub {
      height: 1.4cqw;
      min-height: 6px;
    }
  }
</style>

<div id="desktop">

      <span class="hot dpad-down"  id="btn-vol-down" role="button" tabindex="0" aria-label="Volume down"></span>
    </div>
  </section>

</div>

<audio id="audio" preload="metadata"></audio>

<script>
(() => {
  // ============ TRACKS ============
  // add entries here as you drop MP3s into /music/
  // example:
  //   { title: "Sunset Drive", artist: "Coastal", src: "/music/sunset-drive.mp3", cover: "/images/cover.jpg" },
  const tracks = [
    { title: "Body Heat", artist: "", src: "/music/Body%20Heat.mp3", cover: "/images/cover.jpg" },
    { title: "Dough", artist: "", src: "/music/Dough.mp3", cover: "/images/cover.jpg" },
    { title: "Sabia", artist: "", src: "/music/Sabia.mp3", cover: "/images/cover.jpg" },
    { title: "V.A.N. II (Remix)", artist: "", src: "/music/V.A.N.%20II%20%28Remix%29.mp3", cover: "/images/cover.jpg" },
  ];
  // ================================

  const $ = (s) => document.querySelector(s);
  const audio = $("#audio");
  const trackTitle = $("#track-title");
  const trackArtist = $("#track-artist");
  const scrub = $("#scrub");
  const scrubFill = $("#scrub-fill");
  const tCur = $("#time-current");
  const tTot = $("#time-total");
  const btnPlay = $("#btn-play");
  const btnStop = $("#btn-stop");
  const btnPrev = $("#btn-prev");
  const btnNext = $("#btn-next");
  const btnVolUp = $("#btn-vol-up");
  const btnVolDown = $("#btn-vol-down");

  let idx = -1;

  const fmt = (s) => {
    if (!isFinite(s)) return "0:00";
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, "0");
    return `${m}:${sec}`;
  };

  function load(i, autoplay) {
    if (!tracks.length) return;
    idx = (i + tracks.length) % tracks.length;
    const t = tracks[idx];
    audio.src = t.src;
    trackTitle.textContent = t.title || "untitled";
    trackArtist.textContent = t.artist || "";
    if (autoplay) audio.play();
  }

  btnPlay.addEventListener("click", () => {
    if (!tracks.length) return;
    if (idx < 0) load(0, true);
    else if (audio.paused) audio.play();
    else audio.pause();
  });
  btnPrev.addEventListener("click", () => { if (tracks.length) load(idx - 1, true); });
  btnNext.addEventListener("click", () => { if (tracks.length) load(idx + 1, true); });
  btnStop.addEventListener("click", () => { audio.pause(); audio.currentTime = 0; });

  // volume (d-pad up/down)
  audio.volume = 0.8;
  btnVolUp.addEventListener("click", () => {
    audio.volume = Math.min(1, Math.round((audio.volume + 0.1) * 10) / 10);
  });
  btnVolDown.addEventListener("click", () => {
    audio.volume = Math.max(0, Math.round((audio.volume - 0.1) * 10) / 10);
  });

  audio.addEventListener("play",  () => btnPlay.classList.add("playing"));
  audio.addEventListener("pause", () => btnPlay.classList.remove("playing"));
  audio.addEventListener("ended", () => load(idx + 1, true));
  audio.addEventListener("loadedmetadata", () => tTot.textContent = fmt(audio.duration));
  audio.addEventListener("timeupdate", () => {
    tCur.textContent = fmt(audio.currentTime);
    if (audio.duration) scrubFill.style.width = (audio.currentTime / audio.duration * 100) + "%";
  });
  // scrub: tap or drag to seek
  let scrubbing = false;
  function seekFromEvent(e) {
    if (!audio.duration) return;
    const r = scrub.getBoundingClientRect();
    const x = Math.max(0, Math.min(r.width, e.clientX - r.left));
    audio.currentTime = (x / r.width) * audio.duration;
  }
  scrub.addEventListener("pointerdown", (e) => {
    scrubbing = true;
    scrub.setPointerCapture(e.pointerId);
    seekFromEvent(e);
  });
  scrub.addEventListener("pointermove", (e) => {
    if (scrubbing) seekFromEvent(e);
  });
  scrub.addEventListener("pointerup", () => { scrubbing = false; });
  scrub.addEventListener("pointercancel", () => { scrubbing = false; });

  // VMU drag
  const isMobile = () => window.matchMedia("(max-width: 700px)").matches;
  const player = document.getElementById("w-player");
  const stage = player.querySelector(".vmu-stage");
  let dx = 0, dy = 0, dragging = false;
  stage.addEventListener("pointerdown", (e) => {
    if (isMobile()) return;
    if (e.target.closest(".hot, .scrub, button, [role=button]")) return;
    dragging = true;
    const r = player.getBoundingClientRect();
    dx = e.clientX - r.left;
    dy = e.clientY - r.top;
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const x = Math.max(0, Math.min(window.innerWidth  - 60, e.clientX - dx));
    const y = Math.max(0, Math.min(window.innerHeight - 24, e.clientY - dy));
    player.style.left = x + "px";
    player.style.top  = y + "px";
  });
  stage.addEventListener("pointerup",     () => dragging = false);
  stage.addEventListener("pointercancel", () => dragging = false);

  if (tracks.length) load(0, false);
})();
</script>
